# Conveyor resolves this extensionless command to conveyor-config.bat on
# Windows and to conveyor-config on Unix hosts.  Both launchers preserve
# stdout exclusively for the generated HOCON include.
include "#!../.github/scripts/conveyor-config"

app.version = ${env.APP_MAJOR_VERSION}.${env.APP_MINOR_VERSION}.${env.APP_MAINTENANCE_VERSION}
app.fsname = dobby-vpn
app.license = "Apache-2.0"

app.icons = "logos/logo.png"

app.vcs-url = github.com/DobbyVPN/DobbyVPN

app.mac {
  amd64.info-plist {
    LSMinimumSystemVersion = 11.0
  }

  aarch64.info-plist {
    LSMinimumSystemVersion = 15.0
  }

  inputs += "services/dobby-cli"
}

app.windows {
  inputs += "services/dobby-cli.exe"
}

# The GUI is the only JVM entry point. The operator CLI is a native Go binary
# staged in the platform service directory below, so invoking it never starts
# a JVM or creates a second runtime.
app.jvm.gui {
  main-class = MainKt
  console = false
}
# Linux-only product guardrail. This bounds the Compose GUI heap without
# changing machine configuration, service limits, or any other platform.
app.jvm.gui.linux.options += "-Xmx256m"

app.linux {
  # Keep the operator CLI in the stable package-level bin directory. The
  # Linux qualification contract invokes it independently of the JVM GUI.
  inputs += "services/dobby-cli" -> "bin/dobby-cli"
  inputs += "services/ubuntu_grpcvpnserver"
  inputs += "services/libdobby_bridge.so"
  inputs += "services/libc++.so.1"
  inputs += "services/libc++abi.so.1"

  # Set the prefix. App files will be placed in /usr/local/lib/${app.long-fsname-dir}
  # and a symlink to the launcher in /usr/local/bin
  prefix = /usr/local

  # Set the location where app files will be placed, overriding the prefix.
  install-path = /opt/dobbyvpn

  # Customize the name of the service and contents of the file:
  services {
    grpcvpnserver {
      include "/stdlib/linux/service.conf"

      file-name = dobbyvpn.service

      Unit {
        Description = "DobbyVPN gRPC service"
      }

      Service {
        Environment = "LD_LIBRARY_PATH="${app.linux.install-path}"/lib/runtime/lib"
        ExecStart = ${app.linux.install-path}/lib/app/ubuntu_grpcvpnserver
        Restart = "always"
        RestartSec = "2"
      }

      Install {
        Alias = "dobbyvpn.service"
        WantedBy = "multi-user.target"
      }
    }
  }
}

conveyor.compatibility-level = 16
