language: en

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  profile: chill
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true

  path_instructions:
    - path: "go_module/**/*.go"
      instructions: >
        Review Go behavior, concurrency, resource cleanup, errors, and platform
        boundaries. Check relevant tests without inventing undocumented gates.

    - path: "kmp_module/app/**/*.kt"
      instructions: >
        Review UI state, coroutine lifetime, platform boundaries, and relevant
        tests. Prefer the patterns already used in the affected module.

    - path: "swift_module/**/*.swift"
      instructions: >
        Review Swift/Kotlin interop, lifecycle, and VPN extension behavior.
        Keep findings tied to observable bugs or documented requirements.

    - path: ".github/workflows/**"
      instructions: >
        Review workflow triggers, dependencies, artifact flow, and secret
        boundaries. Use AGENTS.md and TESTING.md as the policy source; do not
        add speculative checks or publication gates.

    - path: "**/*.md"
      instructions: >
        Check that instructions match the implementation and link to the
        document that owns each rule. Avoid duplicated policy text.

chat:
  auto_reply: true
