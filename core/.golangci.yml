# golangci-lint v2 configuration
# Docs: https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
  sort-order:
    - linter
    - file

linters:
  enable:
    - bodyclose
    - nilerr
    - gosec
    - revive
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - goconst
    - gocyclo
    - nestif
    - unparam
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - errorlint
    - nakedret
    - noctx
    - exhaustive
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 20
    nestif:
      min-complexity: 5
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
    gosec:
      excludes:
        - G104
        - G302
        - G304
        - G306
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
  exclusions:
    paths:
      - ffi/ios
      - desktop
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst
          - gosec
          - gocritic
      # These helpers are used by the Android/iOS binding adapter in
      # sessionapi/mobilebinding/platform_mobile.go. Linux product analysis
      # has no production caller for that build-tagged adapter.
      - path: ^sessionapi/mobilebinding/(ownership|platform)\.go$
        text: "is unused"
        linters:
          - unused
      # The panic-recovery helper is called by native_runtime_mobile.go
      # (android || ios); desktop uses the lifecycle state definitions here.
      - path: ^sessionapi/runtime/native_lifecycle\.go$
        text: "runLockedWithPanicRecovery is unused"
        linters:
          - unused
      # This protected dialer helper graph is installed only by the Android
      # build-tagged protected_system_dialer_android.go.
      - path: ^xray/internal/protected_system_dialer\.go$
        text: "is unused"
        linters:
          - unused

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
