def resolveProjectConfigurations = { project ->
    project.configurations
        .findAll { configuration -> configuration.canBeResolved }
        .sort { left, right -> left.name <=> right.name }
        .each { configuration ->
            project.logger.lifecycle("Resolving ${project.path}:${configuration.name}")
            configuration.incoming.files.files
        }
}

gradle.projectsEvaluated {
    def projectTasks = rootProject.subprojects.collect { project ->
        project.tasks.register("resolveDobbyProjectDependencies") {
            group = "verification"
            description = "Download all resolvable dependencies for this project without running build tasks."
            doLast {
                resolveProjectConfigurations(project)
            }
        }
    }

    rootProject.tasks.register("resolveDobbyDependencies") {
        group = "verification"
        description = "Download all resolvable project dependencies without running build tasks."
        dependsOn projectTasks
        doLast {
            resolveProjectConfigurations(rootProject)
        }
    }
}
