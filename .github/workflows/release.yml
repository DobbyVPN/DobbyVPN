name: Release

# Configures this workflow to run every time a change is pushed to the main branch.
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  # Release jobs are serialized; PR verification runs in test.yml instead.
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/test.yml

  # Marketing version (x.y.z) is manual via the repo VERSION file.
  prepare_version:
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      maintenance: ${{ steps.version.outputs.maintenance }}
      version_name: ${{ steps.version.outputs.version_name }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          python3 .github/scripts/version_metadata.py \
            --version-file VERSION \
            --github-output "$GITHUB_OUTPUT"
          version_name="$(
            python3 .github/scripts/version_metadata.py \
              --version-file VERSION \
              --field version_name
          )"
          android_version_code="$(
            python3 .github/scripts/version_metadata.py \
              --version-file VERSION \
              --field android_version_code
          )"
          echo "Marketing version $version_name; Android/F-Droid versionCode $android_version_code"

  desktop_libs_build:
    needs: verification
    uses: ./.github/workflows/desktop_libs_generate.yml

  ios_libs_build:
    if: github.event_name != 'pull_request'
    needs: [verification, prepare_version]
    uses: ./.github/workflows/ios_libs_generate.yml
    with:
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
      android_version_code: ${{ needs.prepare_version.outputs.android_version_code }}
      source_sha: ${{ github.sha }}

  android_build:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/android_build.yml
    with:
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
    secrets:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

  fdroid_check:
    needs: verification
    uses: ./.github/workflows/fdroid_check.yml

  fdroid_scan_apk:
    needs: [prepare_version, android_build]
    uses: ./.github/workflows/fdroid_scan_apk.yml
    with:
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      version_code: ${{ needs.prepare_version.outputs.android_version_code }}

  ios_build:
    if: github.event_name != 'pull_request'
    needs: [prepare_version, ios_libs_build]
    uses: ./.github/workflows/ios_build.yml
    with:
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
    secrets:
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
      CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
      PROVISION_DOBBY_BASE64: ${{ secrets.PROVISION_DOBBY_BASE64 }}
      PROVISION_DOBBY_TUNNEL_BASE64: ${{ secrets.PROVISION_DOBBY_TUNNEL_BASE64 }}
      APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}

  desktop_build:
    needs: [prepare_version, desktop_libs_build]
    uses: ./.github/workflows/desktop_build.yml
    with:
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
    secrets:
      CONVEYOR_PASSPHRASE: ${{ secrets.CONVEYOR_PASSPHRASE }}
      CONVEYOR_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}

  installers_build:
    if: github.event_name != 'pull_request'
    # Real-profile and performance qualification is a separate maintainer
    # release gate; it never exposes private endpoints to public CI.
    needs: [prepare_version, desktop_build]
    uses: ./.github/workflows/installers_build.yml
    with:
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}

  # Public GitHub/F-Droid promotion is intentional/manual. A maintainer selects
  # one successful run with AppStore/publish_release.py; promote_release.yml
  # then transfers these retained artifacts to the public release entirely on
  # GitHub-hosted infrastructure and creates the sole F-Droid-visible tag.
