name: Release

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful Publish workflow run whose verified release should be submitted to stores.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve_publish:
    name: Verify selected Publish lineage and release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.selection.outputs.source_sha }}
      tag: ${{ steps.selection.outputs.tag }}
      version_name: ${{ steps.selection.outputs.version_name }}
      android_version_code: ${{ steps.selection.outputs.android_version_code }}
      apple_build_number: ${{ steps.selection.outputs.apple_build_number }}
      build_run_id: ${{ steps.selection.outputs.build_run_id }}
      build_run_number: ${{ steps.selection.outputs.build_run_number }}
      test_run_id: ${{ steps.selection.outputs.test_run_id }}
      test_run_number: ${{ steps.selection.outputs.test_run_number }}
      publish_run_id: ${{ steps.selection.outputs.publish_run_id }}
      publish_run_number: ${{ steps.selection.outputs.publish_run_number }}
      build_manifest_sha256: ${{ steps.selection.outputs.build_manifest_sha256 }}
      test_result_sha256: ${{ steps.selection.outputs.test_result_sha256 }}
      release_notes_sha256: ${{ steps.selection.outputs.release_notes_sha256 }}
      release_notes_b64: ${{ steps.selection.outputs.release_notes_b64 }}
    steps:
      - name: Require the production branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve and verify selected Publish run
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release/publish_selection.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$PUBLISH_RUN_ID" \
            --download-dir "$RUNNER_TEMP/selected-publish" \
            --output "$RUNNER_TEMP/publish.json"
          python3 - "$RUNNER_TEMP/publish.json" "$GITHUB_OUTPUT" <<'PYTHON'
          import base64, json, sys
          selected = json.load(open(sys.argv[1], encoding="utf-8"))
          values = {
              "source_sha": selected["source_sha"],
              "tag": selected["tag"],
              "version_name": selected["version"],
              "android_version_code": selected["android_version_code"],
              "apple_build_number": selected["apple_build_number"],
              "build_run_id": selected["build_run_id"],
              "build_run_number": selected["build_run_number"],
              "test_run_id": selected["test_run_id"],
              "test_run_number": selected["test_run_number"],
              "publish_run_id": selected["publish_run_id"],
              "publish_run_number": selected["publish_run_number"],
              "build_manifest_sha256": selected["build_manifest_sha256"],
              "test_result_sha256": selected["test_result_sha256"],
              "release_notes_sha256": selected["release_notes_sha256"],
              "release_notes_b64": base64.b64encode(selected["release_notes"].encode("utf-8")).decode("ascii"),
          }
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PYTHON

  app_store:
    name: Submit the selected TestFlight build to App Review
    needs: resolve_publish
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Install Ruby dependencies
        run: cd publishing && bundle install --jobs 4 --retry 3
      - name: Set selected release metadata and exact notes
        env:
          VERSION_NAME: ${{ needs.resolve_publish.outputs.version_name }}
          APPLE_BUILD_NUMBER: ${{ needs.resolve_publish.outputs.apple_build_number }}
          SOURCE_SHA: ${{ needs.resolve_publish.outputs.source_sha }}
          RELEASE_NOTES_B64: ${{ needs.resolve_publish.outputs.release_notes_b64 }}
        run: |
          set -euo pipefail
          IFS='.' read -r version_major version_minor version_maintenance <<< "$VERSION_NAME"
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s' "$RELEASE_NOTES_B64" | base64 --decode > "$notes_file"
          {
            echo "APP_STORE_VERSION=$VERSION_NAME"
            echo "APP_STORE_BUILD_NUMBER=$APPLE_BUILD_NUMBER"
            echo "APP_MAJOR_VERSION=$version_major"
            echo "APP_MINOR_VERSION=$version_minor"
            echo "APP_MAINTENANCE_VERSION=$version_maintenance"
            echo "ANDROID_VERSION_CODE=${{ needs.resolve_publish.outputs.android_version_code }}"
            echo "APP_SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_COMMIT=$SOURCE_SHA"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "APP_BUILD=$APPLE_BUILD_NUMBER"
            echo "APP_STORE_RELEASE_NOTES_FILE=$notes_file"
          } >> "$GITHUB_ENV"
      - name: Submit exact build to App Review
        env:
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: cd publishing && bundle exec fastlane ios submit_app_store_review

  fdroid:
    name: Publish F-Droid catalog
    needs: resolve_publish
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: write
      id-token: write
    uses: DobbyVPN/fdroid-repo/.github/workflows/publish.yml@8c19e1ede8e9376c9200b3984a4430019f65143a
    secrets:
      FDROID_REPO_KEYSTORE: ${{ secrets.FDROID_REPO_KEYSTORE }}
      FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
      FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
    with:
      source_sha: ${{ needs.resolve_publish.outputs.source_sha }}
      tag: ${{ needs.resolve_publish.outputs.tag }}
      build_run_id: ${{ needs.resolve_publish.outputs.build_run_id }}
      build_run_number: ${{ needs.resolve_publish.outputs.build_run_number }}
      test_run_id: ${{ needs.resolve_publish.outputs.test_run_id }}
      test_run_number: ${{ needs.resolve_publish.outputs.test_run_number }}
      publish_run_id: ${{ needs.resolve_publish.outputs.publish_run_id }}
      publish_run_number: ${{ needs.resolve_publish.outputs.publish_run_number }}
      android_version_code: ${{ needs.resolve_publish.outputs.android_version_code }}
      apple_build_number: ${{ needs.resolve_publish.outputs.apple_build_number }}
      build_manifest_sha256: ${{ needs.resolve_publish.outputs.build_manifest_sha256 }}
      test_result_sha256: ${{ needs.resolve_publish.outputs.test_result_sha256 }}
      release_notes_sha256: ${{ needs.resolve_publish.outputs.release_notes_sha256 }}
