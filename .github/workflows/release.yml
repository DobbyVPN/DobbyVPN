name: Release

# Release builds and qualifies packages without publishing.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dobbyvpn-actions-retention
  cancel-in-progress: false

jobs:
  verification:
    needs: prepare_version
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require CI success for the exact Release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/require_ci.py --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"

  # Marketing version (x.y.z) is manual via the repo VERSION file.
  prepare_version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      maintenance: ${{ steps.version.outputs.maintenance }}
      version_name: ${{ steps.version.outputs.version_name }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - name: Reject Release reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Release reruns are unsupported; dispatch a fresh Release workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/version_metadata.py \
            --version-file VERSION \
            --github-output "$GITHUB_OUTPUT"
          version_name="$(
            python3 .github/scripts/version_metadata.py \
              --version-file VERSION \
              --field version_name
          )"
          android_version_code="$(
            python3 .github/scripts/version_metadata.py \
              --version-file VERSION \
              --field android_version_code
          )"
          echo "Marketing version $version_name; Android/F-Droid versionCode $android_version_code"

  ios_libraries_build:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/ios_libs_generate.yml
    with:
      source_sha: ${{ github.sha }}

  android_build:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/android_build.yml
    with:
      source_sha: ${{ github.sha }}
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
      android_version_code: ${{ needs.prepare_version.outputs.android_version_code }}

  fdroid_check:
    needs: [verification, prepare_version, android_build]
    uses: ./.github/workflows/fdroid_check.yml
    with:
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      version_code: ${{ needs.prepare_version.outputs.android_version_code }}

  ios_build:
    needs: [verification, prepare_version, ios_libraries_build]
    uses: ./.github/workflows/ios_build.yml
    with:
      source_sha: ${{ github.sha }}
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
      android_version_code: ${{ needs.prepare_version.outputs.android_version_code }}
  build_linux:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/desktop_platform.yml
    with:
      platform: linux
      architecture: amd64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  build_windows:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/desktop_platform.yml
    with:
      platform: windows
      architecture: amd64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  build_macos_arm:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/desktop_platform.yml
    with:
      platform: macos
      architecture: arm64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  build_macos_intel:
    needs: [verification, prepare_version]
    uses: ./.github/workflows/desktop_platform.yml
    with:
      platform: macos
      architecture: amd64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  migrate_windows:
    needs: [prepare_version, build_windows]
    uses: ./.github/workflows/installer_migration.yml
    with:
      platform: windows
      architecture: amd64
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  migrate_macos_arm:
    needs: [prepare_version, build_macos_arm]
    uses: ./.github/workflows/installer_migration.yml
    with:
      platform: macos
      architecture: arm64
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  migrate_macos_intel:
    needs: [prepare_version, build_macos_intel]
    uses: ./.github/workflows/installer_migration.yml
    with:
      platform: macos
      architecture: amd64
      version_name: ${{ needs.prepare_version.outputs.version_name }}

  render_start:
    name: Start one disposable Render VPN
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: render-functional
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject Release reruns before creating a Render service
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Release reruns are unsupported; dispatch a fresh Release workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Start Render VPN
        working-directory: torturer
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_IMAGE_OWNER_ID: ${{ vars.RENDER_IMAGE_OWNER_ID }}
          RENDER_IMAGE_PATH: ${{ vars.RENDER_IMAGE_PATH }}
          RENDER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
          RENDER_REGION: ${{ vars.RENDER_REGION }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_TOKEN"
          test -n "$RENDER_OWNER_ID"
          test -n "$RENDER_IMAGE_OWNER_ID"
          test -n "$RENDER_IMAGE_PATH"
          test -n "$RENDER_IMAGE_DIGEST"
          test -n "$RENDER_REGION"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_provider.render_service start \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --owner-id "$RENDER_OWNER_ID" \
            --image-owner-id "$RENDER_IMAGE_OWNER_ID" \
            --image-path "$RENDER_IMAGE_PATH" \
            --image-digest "$RENDER_IMAGE_DIGEST" \
            --region "$RENDER_REGION" \
            --output "$RUNNER_TEMP/render"

      - name: Upload shared Render profile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/render/profile.toml
            ${{ runner.temp }}/render/deadline_epoch.txt
          if-no-files-found: error
          retention-days: 1

  qualify_linux:
    needs: [build_linux, render_start]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      platform: linux
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}

  qualify_windows:
    needs: [build_windows, render_start]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      platform: windows
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}

  qualify_macos:
    needs: [build_macos_arm, render_start]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      platform: macos
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}

  qualify_android:
    needs: [android_build, render_start]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      platform: android
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}

  render_cleanup:
    name: Delete disposable Render VPN
    if: always()
    needs: [render_start, qualify_linux, qualify_windows, qualify_macos, qualify_android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: render-functional
    permissions:
      contents: read
    env:
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Delete Render VPN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_provider.render_service stop \
            --run-id "$GITHUB_RUN_ID" --attempt 1 \
            --owner-id "$RENDER_OWNER_ID"

  qualification_result:
    name: Require hosted mini and Render cleanup
    if: always()
    needs: [render_start, qualify_linux, qualify_windows, qualify_macos, qualify_android, render_cleanup, fdroid_check, ios_build, migrate_windows, migrate_macos_arm, migrate_macos_intel]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Render and platform jobs
        env:
          RENDER_START_RESULT: ${{ needs.render_start.result }}
          LINUX_RESULT: ${{ needs.qualify_linux.result }}
          WINDOWS_RESULT: ${{ needs.qualify_windows.result }}
          MACOS_RESULT: ${{ needs.qualify_macos.result }}
          ANDROID_RESULT: ${{ needs.qualify_android.result }}
          RENDER_CLEANUP_RESULT: ${{ needs.render_cleanup.result }}
          FDROID_RESULT: ${{ needs.fdroid_check.result }}
          IOS_BUILD_RESULT: ${{ needs.ios_build.result }}
          WINDOWS_MIGRATION_RESULT: ${{ needs.migrate_windows.result }}
          MACOS_ARM_MIGRATION_RESULT: ${{ needs.migrate_macos_arm.result }}
          MACOS_INTEL_MIGRATION_RESULT: ${{ needs.migrate_macos_intel.result }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Release attempt $GITHUB_RUN_ATTEMPT cannot qualify or publish; dispatch a fresh Release workflow." >&2
            exit 1
          fi
          test "$RENDER_START_RESULT" = success
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$ANDROID_RESULT" = success
          test "$RENDER_CLEANUP_RESULT" = success
          test "$FDROID_RESULT" = success
          test "$IOS_BUILD_RESULT" = success
          test "$WINDOWS_MIGRATION_RESULT" = success
          test "$MACOS_ARM_MIGRATION_RESULT" = success
          test "$MACOS_INTEL_MIGRATION_RESULT" = success
          echo "Release hosted mini qualification passed"

  retain:
    name: Retain newest Release run
    if: always()
    needs: [prepare_version, verification, ios_libraries_build, android_build, fdroid_check, ios_build, build_linux, build_windows, build_macos_arm, build_macos_intel, migrate_windows, migrate_macos_arm, migrate_macos_intel, render_start, qualify_linux, qualify_windows, qualify_macos, qualify_android, render_cleanup, qualification_result]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Remove older workflow runs and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/actions_retention.py \
            --repository "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID" \
            --delete-caches --delete-intermediate-artifacts \
            --keep-artifact DobbyVPN.xcarchive.tar.gz \
            --keep-artifact dobbyVPN-linux.deb \
            --keep-artifact dobbyVPN-windows-amd64.msi \
            --keep-artifact dobbyVPN-macos-aarch64.pkg \
            --keep-artifact dobbyVPN-macos-amd64.pkg \
            --keep-artifact dobbyvpn-android-unsign.apk \
            --keep-artifact dobbyvpn-android-test-companion-unsigned.apk \
            --keep-artifact dobbyvpn-android-provenance \
            --keep-artifact dobbyvpn-go-coverage \
            --keep-artifact dobbyvpn-swift-coverage \
            --keep-artifact dobbyvpn-ios-simulator-mini \
            --keep-artifact dobbyvpn-qualification-linux \
            --keep-artifact dobbyvpn-qualification-windows \
            --keep-artifact dobbyvpn-qualification-macos \
            --keep-artifact dobbyvpn-qualification-android
