name: Release hosted mini qualification

# Runs the Release packages through the shared functional contract. Render
# service ownership stays in the calling Release workflow.
on:
  workflow_call:
    inputs:
      render_artifact_name:
        description: Artifact containing the shared Render VPN profile.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  linux:
    uses: ./.github/workflows/qualification_platform.yml
    with:
      platform: linux
      render_artifact_name: ${{ inputs.render_artifact_name }}
    permissions:
      contents: read
      actions: read

  windows:
    uses: ./.github/workflows/qualification_platform.yml
    with:
      platform: windows
      render_artifact_name: ${{ inputs.render_artifact_name }}
    permissions:
      contents: read
      actions: read

  macos:
    uses: ./.github/workflows/qualification_platform.yml
    with:
      platform: macos
      render_artifact_name: ${{ inputs.render_artifact_name }}
    permissions:
      contents: read
      actions: read

  android:
    uses: ./.github/workflows/qualification_platform.yml
    with:
      platform: android
      render_artifact_name: ${{ inputs.render_artifact_name }}
    permissions:
      contents: read
      actions: read

  aggregate:
    name: Require all hosted mini results
    if: always()
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check platform jobs and Render cleanup
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$MACOS_RESULT" = success
          test "$ANDROID_RESULT" = success
          echo "hosted mini qualification passed"
