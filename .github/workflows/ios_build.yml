name: iOS Build

on:
  workflow_call:
    inputs:
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true
      android_version_code:
        description: Stable build number shared with the product version metadata.
        type: string
        required: true
      debug:
        type: boolean
        default: false
      source_sha:
        description: Lowercase full source commit SHA to build.
        type: string
        required: true

jobs:
  ios_build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
      APP_BUILD: ${{ inputs.android_version_code }}
      DOBBY_BUILD_CONFIGURATION: ${{ inputs.debug && 'Debug' || 'Release' }}
      DEBUG_SUFFIX: ${{ inputs.debug && '-debug' || '' }}
      SOURCE_COMMIT: ${{ inputs.source_sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Download iOS runtime framework
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release/download_artifact.py \
            "$GITHUB_RUN_ID" "DobbyVPNRuntime$DEBUG_SUFFIX.xcframework" ui/apple/DobbyVPNRuntime.xcframework

      - if: ${{ !inputs.debug }}
        name: Analyze production iOS app and tunnel without signing
        run: |
          set -euo pipefail
          bash core/scripts/package_ios_app.sh \
            iosanalyze "$RUNNER_TEMP/dobbyvpn-ios-analysis" \
            ui/apple/DobbyVPNRuntime.xcframework

      - name: Archive production iOS app and tunnel without signing
        run: |
          set -euo pipefail
          mkdir -p ui/apple/build/release
          bash core/scripts/package_ios_app.sh \
            iosarchive "ui/apple/build/release/DobbyVPN.xcarchive$DEBUG_SUFFIX.tar.gz" \
            ui/apple/DobbyVPNRuntime.xcframework

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DobbyVPN.xcarchive${{ env.DEBUG_SUFFIX }}.tar.gz
          path: ui/apple/build/release/DobbyVPN.xcarchive${{ env.DEBUG_SUFFIX }}.tar.gz
          if-no-files-found: error
          retention-days: ${{ github.workflow == 'Release' && 7 || 1 }}
