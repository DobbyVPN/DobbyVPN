name: iOS Build

on:
  workflow_call:
    inputs:
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true
      android_version_code:
        description: Stable build number shared with the product version metadata.
        type: string
        required: true
      source_sha:
        description: Lowercase full source commit SHA to build.
        type: string
        required: true

jobs:
  ios_build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
      APP_BUILD: ${{ inputs.android_version_code }}
      SOURCE_COMMIT: ${{ inputs.source_sha }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Download iOS runtime framework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DobbyVPNRuntime.xcframework
          path: ui/apple/DobbyVPNRuntime.xcframework

      - name: Analyze production iOS app and tunnel without signing
        run: |
          set -euo pipefail
          bash core/scripts/package_ios_app.sh \
            iosanalyze "$RUNNER_TEMP/dobbyvpn-ios-analysis" \
            ui/apple/DobbyVPNRuntime.xcframework

      - name: Archive production iOS app and tunnel without signing
        run: |
          set -euo pipefail
          mkdir -p ui/apple/build/release
          bash core/scripts/package_ios_app.sh \
            iosarchive ui/apple/build/release/DobbyVPN.xcarchive.tar.gz \
            ui/apple/DobbyVPNRuntime.xcframework

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DobbyVPN.xcarchive.tar.gz
          path: ui/apple/build/release/DobbyVPN.xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 90
