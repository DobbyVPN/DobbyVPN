name: Build desktop installers

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full lowercase 40-character source commit SHA to build.
        type: string
        required: true
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true

jobs:
  build_desktop_installers:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: ubuntu
            runner: ubuntu-latest
          - os: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $actual_sha, expected $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Download Windows gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: windows_grpcvpnserver.exe
          path: installer/windows/

      - name: Download macOS arm64 gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: macos_grpcvpnserver-arm64
          path: installer/macos/services/arm64

      - name: Download macOS amd64 gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: macos_grpcvpnserver-amd64
          path: installer/macos/services/amd64

      - name: Add permissions to macOS service executables
        working-directory: installer/macos/
        run: |
          chmod +x services/arm64/macos_grpcvpnserver
          chmod +x services/amd64/macos_grpcvpnserver

      - name: Download Windows built application
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-windows.zip
          path: installer/windows/

      - name: Download Linux built application
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-linux.deb
          path: installer/linux/

      - name: Download MacOS amd64 built application
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-macos-amd64.zip
          path: installer/macos/

      - name: Download MacOS aarch64 built application
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-macos-aarch64.zip
          path: installer/macos/

      - name: Build Windows installer - Add msbuild to PATH
        if: matrix.os == 'windows'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      
      - name: Build Windows installer - Install WiX
        if: matrix.os == 'windows'
        working-directory: installer/windows
        run: dotnet tool install --global wix --version 6.0.0
        
      - name: Build Windows installer
        if: matrix.os == 'windows'
        working-directory: installer/windows
        run: |
          ./build.bat
        env:
          APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
          APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
          APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify Windows installer version
        if: matrix.os == 'windows'
        working-directory: installer/windows
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Resolve-Path "bin/amd64/dobbyVPN-windows-amd64.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.GetType().InvokeMember(
            "OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0)
          )
          $view = $database.GetType().InvokeMember(
            "OpenView", "InvokeMethod", $null, $database,
            "SELECT Value FROM Property WHERE Property = 'ProductVersion'"
          )
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
          $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          if ($null -eq $record) {
            throw "MSI ProductVersion property is missing"
          }
          $actual = $record.GetType().InvokeMember(
            "StringData", "GetProperty", $null, $record, 1
          )
          if ($actual -ne $env:EXPECTED_VERSION) {
            throw "MSI ProductVersion $actual does not match $env:EXPECTED_VERSION"
          }
          $fileView = $database.GetType().InvokeMember(
            "OpenView", "InvokeMethod", $null, $database,
            'SELECT `FileName` FROM `File`'
          )
          $fileView.GetType().InvokeMember("Execute", "InvokeMethod", $null, $fileView, $null)
          $installed = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::OrdinalIgnoreCase
          )
          while ($true) {
            $fileRecord = $fileView.GetType().InvokeMember(
              "Fetch", "InvokeMethod", $null, $fileView, $null
            )
            if ($null -eq $fileRecord) {
              break
            }
            $fileName = $fileRecord.GetType().InvokeMember(
              "StringData", "GetProperty", $null, $fileRecord, 1
            )
            [void]$installed.Add(($fileName -split '\|')[-1])
          }
          foreach ($required in @(
            "windows_grpcvpnserver.exe",
            "dobby_bridge.dll",
            "wintun.dll"
          )) {
            if (-not $installed.Contains($required)) {
              throw "Windows MSI runtime closure is missing $required"
            }
          }

      - name: Build Linux installer
        if: matrix.os == 'ubuntu'
        working-directory: installer/linux/
        run: |
          echo "[+] Linux installer has already been built"

      - name: Build MacOS installer
        if: matrix.os == 'macos'
        working-directory: installer/macos/
        run: |
          sh build.sh
        env:
          APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
          APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
          APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify macOS installer versions
        if: matrix.os == 'macos'
        working-directory: installer/macos/
        env:
          EXPECTED_VERSION: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          for package in \
            bin/amd64/dobbyVPN-macos-amd64.pkg \
            bin/aarch64/dobbyVPN-macos-aarch64.pkg; do
            expanded="$temporary/$(basename "$package").expanded"
            pkgutil --expand-full "$package" "$expanded"
            python3 - "$expanded" "$EXPECTED_VERSION" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          package_info = list(root.rglob("PackageInfo"))
          if len(package_info) != 1:
              raise SystemExit("expected exactly one PackageInfo in macOS package")
          actual = ET.parse(package_info[0]).getroot().get("version")
          if actual != expected:
              raise SystemExit(f"macOS package version {actual!r} does not match {expected!r}")
          PY
          done

      - name: Upload Windows amd64 installer
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-windows-amd64.msi
          path: installer/windows/bin/amd64/dobbyVPN-windows-amd64.msi
          if-no-files-found: error

      - name: Upload MacOS amd64 installer
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-macos-amd64.pkg
          path: installer/macos/bin/amd64/dobbyVPN-macos-amd64.pkg
          if-no-files-found: error

      - name: Upload MacOS aarch64 installer
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-macos-aarch64.pkg
          path: installer/macos/bin/aarch64/dobbyVPN-macos-aarch64.pkg
          if-no-files-found: error
