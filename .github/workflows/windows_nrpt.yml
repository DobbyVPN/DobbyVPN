name: Windows NRPT

# Runs only when the Windows DNS / NRPT code or this workflow changes: the job
# needs a Windows runner and changes the runner's DNS settings.
on:
  pull_request:
    branches: [main]
    paths:
      - core/routing/nrpt*.go
      - core/routing/dns_windows.go
      - core/tunnel/platform_engine/engine_windows.go
      - core/tunnel/platform_engine/nrpt_windows_ci_test.go
      - core/clientserver/executor/windows_execute.go
      - .github/workflows/windows_nrpt.yml
  push:
    branches: [main]
    paths:
      - core/routing/nrpt*.go
      - core/routing/dns_windows.go
      - core/tunnel/platform_engine/engine_windows.go
      - core/tunnel/platform_engine/nrpt_windows_ci_test.go
      - core/clientserver/executor/windows_execute.go
      - .github/workflows/windows_nrpt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_nrpt:
    name: Windows NRPT rule (add, resolve, remove)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: false
      # Through the product code: add the rule with a local DNS responder as
      # the tunnel server and resolve through it, remove it with EngineStop,
      # recover after a crash and after an interrupted write, check that a
      # second process cannot take ownership and that foreign rules stay.
      - name: Add, resolve through and remove the NRPT rule on the runner
        working-directory: core
        env:
          GOTOOLCHAIN: local
          DOBBY_NRPT_LIVE: "1"
        run: go test -count=1 -run '^TestWindowsNRPTRuleOnRealDNSClient$' -v ./tunnel/platform_engine
      # Second attempt if the test was killed: removes only the DobbyVPN key
      # while it still carries the DobbyVPN comment, and this CI's own rules.
      - name: Remove leftover test NRPT rules and show the table
        if: always()
        shell: pwsh
        run: |
          $owned = 'HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters\DnsPolicyConfig\{6d0b1b5e-7c3a-4f52-9e1d-2a8b4c6f0d17}'
          if ((Test-Path $owned) -and ((Get-ItemProperty -Path $owned -Name Comment -ErrorAction SilentlyContinue).Comment -like 'DobbyVPN*')) {
            Remove-Item -Path $owned -Recurse -Force
          }
          Get-DnsClientNrptRule | Where-Object { $_.Comment -like 'DobbyVPN CI foreign rule *' } | Remove-DnsClientNrptRule -Force
          Clear-DnsClientCache
          Get-DnsClientNrptRule | Format-List Name, Namespace, NameServers, Comment
          Get-DnsClientNrptPolicy | Format-List Namespace, NameServers
