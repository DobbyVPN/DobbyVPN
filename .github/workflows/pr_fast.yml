name: Await reviewed behavioral tests

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  pending:
    name: Request private review
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Mark the submitted Product commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f context='Fast behavioral tests' -f state=pending \
            -f description='Awaiting private execution of a reviewed Product and Torturer revision.'
