name: Promote Release
run-name: Promote v${{ inputs.version }} from Release run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to publish (X.Y.Z)
        required: true
        type: string
      run_id:
        description: Successful Release workflow run containing the artifacts
        required: true
        type: string
      commit_sha:
        description: Exact main commit built by the selected run
        required: true
        type: string
      linux_sha256:
        description: SHA-256 of the exact locally qualified Linux DEB
        required: true
        type: string
      windows_amd64_sha256:
        description: SHA-256 of the exact locally qualified Windows amd64 MSI
        required: true
        type: string
      macos_amd64_sha256:
        description: SHA-256 of the exact locally qualified macOS amd64 PKG
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      release_state: ${{ steps.preflight.outputs.release_state }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_SOURCE_SHA: ${{ inputs.commit_sha }}
      QUALIFIED_LINUX_SHA256: ${{ inputs.linux_sha256 }}
      QUALIFIED_WINDOWS_AMD64_SHA256: ${{ inputs.windows_amd64_sha256 }}
      QUALIFIED_MACOS_AMD64_SHA256: ${{ inputs.macos_amd64_sha256 }}
      EXPECTED_ANDROID_SIGNER_SHA256: c3f0414a74012060d7c6aa3a3d9dac0aa13c1bd23b7512eefd860fb865e67933
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate selected release run
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must use X.Y.Z format" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "run_id must be numeric" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full commit SHA" >&2
            exit 1
          fi
          for qualified_digest in \
            "$QUALIFIED_LINUX_SHA256" \
            "$QUALIFIED_WINDOWS_AMD64_SHA256" \
            "$QUALIFIED_MACOS_AMD64_SHA256"; do
            if [[ ! "$qualified_digest" =~ ^[0-9a-f]{64}$ ]] || \
              [[ "$qualified_digest" = "$(printf '0%.0s' {1..64})" ]]; then
              echo "qualified desktop SHA-256 inputs must be nonzero lowercase digests" >&2
              exit 1
            fi
          done
          test "$GITHUB_REF" = "refs/heads/main"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$GITHUB_SHA" = "$current_main"
          test "$RELEASE_SOURCE_SHA" = "$current_main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"

          run_json="$(
            gh run view "$RELEASE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json conclusion,event,headBranch,headSha,number,status,workflowName
          )"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .workflowName <<<"$run_json")" = "Release"
          test "$(jq -r .event <<<"$run_json")" = "push"
          test "$(jq -r .headBranch <<<"$run_json")" = "main"
          test "$(jq -r .headSha <<<"$run_json")" = "$RELEASE_SOURCE_SHA"

          encoded_version="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$RELEASE_SOURCE_SHA" \
              --jq .content
          )"
          source_version="$(printf '%s' "$encoded_version" | base64 --decode | tr -d '[:space:]')"
          test "$source_version" = "$RELEASE_VERSION"
          android_version_code="$(
            IFS=. read -r major minor maintenance <<< "$RELEASE_VERSION"
            test "$minor" -lt 1000
            test "$maintenance" -lt 1000
            echo $((10#$major * 1000000 + 10#$minor * 1000 + 10#$maintenance))
          )"
          test "$android_version_code" -ge 1
          test "$android_version_code" -le 2100000000

          tag="v$RELEASE_VERSION"
          run_number="$(jq -r .number <<<"$run_json")"
          tag_ref="refs/tags/$tag"
          tag_record="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | \
            jq -sc --arg ref "$tag_ref" '
              [.[][] | select(.ref == $ref)] |
              if length == 0 then empty
              elif length == 1 then .[0]
              else error("duplicate exact tag refs")
              end')"
          tag_state=absent
          tag_ref_object=""
          if [[ -n "$tag_record" ]]; then
            tag_state=existing
            object_type="$(jq -r .object.type <<<"$tag_record")"
            object_sha="$(jq -r .object.sha <<<"$tag_record")"
            tag_ref_object="$object_sha"
            for _ in 1 2 3 4 5 6 7 8; do
              if [[ "$object_type" != tag ]]; then
                break
              fi
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r .object.type <<<"$tag_object")"
              object_sha="$(jq -r .object.sha <<<"$tag_object")"
            done
            test "$object_type" = commit
            test "$object_sha" = "$RELEASE_SOURCE_SHA"
          fi

          release_state="new"
          release_json="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -sc --arg tag "$tag" '
              [.[][] | select(.tag_name == $tag)] |
              if length == 0 then empty
              elif length == 1 then .[0]
              else error("duplicate releases for exact tag")
              end')"
          if [[ -n "$release_json" ]]; then
            if [[ "$(jq -r .draft <<<"$release_json")" = "true" ]]; then
              echo "$tag already exists as a draft; inspect it before retrying" >&2
              exit 1
            else
              test "$tag_state" = existing
              release_state="published"
            fi
          fi

          {
            echo "tag=$tag"
            echo "run_number=$run_number"
            echo "android_version_code=$android_version_code"
            echo "release_state=$release_state"
            echo "tag_state=$tag_state"
            echo "tag_ref_object=$tag_ref_object"
          } >> "$GITHUB_OUTPUT"
          echo "Validated $tag from Release run $RELEASE_RUN_ID at $RELEASE_SOURCE_SHA"
          echo "Release state: $release_state"

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v4
        with:
          packages: build-tools;36.0.0

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-linux.deb
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download Windows amd64 package
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-windows-amd64.msi
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download macOS amd64 package
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-macos-amd64.pkg
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download macOS arm64 package
        uses: actions/download-artifact@v8
        with:
          name: dobbyVPN-macos-aarch64.pkg
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download signed Android package
        uses: actions/download-artifact@v8
        with:
          name: dobbyvpn-android-sign.apk
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download unsigned Android package
        uses: actions/download-artifact@v8
        with:
          name: dobbyvpn-android-unsign.apk
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Download Android provenance
        uses: actions/download-artifact@v8
        with:
          name: dobbyvpn-android-provenance
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Verify locally qualified desktop packages
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum release/dobbyVPN-linux.deb | awk '{print $1}')" = \
            "$QUALIFIED_LINUX_SHA256"
          test "$(sha256sum release/dobbyVPN-windows-amd64.msi | awk '{print $1}')" = \
            "$QUALIFIED_WINDOWS_AMD64_SHA256"
          test "$(sha256sum release/dobbyVPN-macos-amd64.pkg | awk '{print $1}')" = \
            "$QUALIFIED_MACOS_AMD64_SHA256"

      - name: Verify Android source and artifact provenance
        env:
          ANDROID_VERSION_CODE: ${{ steps.preflight.outputs.android_version_code }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_android_apk_source.py \
            --apk "release/DobbyVPN-v$RELEASE_VERSION-sign.apk" \
            --apk "release/DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --source-sha "$RELEASE_SOURCE_SHA" --repository "$GITHUB_REPOSITORY"
          python3 .github/scripts/verify_android_reproducibility.py verify-provenance \
            --apk "release/DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --provenance "release/DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --version-name "$RELEASE_VERSION" \
            --version-code "$ANDROID_VERSION_CODE"
          python3 .github/scripts/verify_android_reproducibility.py verify-signed-payload \
            --unsigned-apk "release/DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --signed-apk "release/DobbyVPN-v$RELEASE_VERSION-sign.apk"
          mapfile -t signer_digests < <(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs \
              "release/DobbyVPN-v$RELEASE_VERSION-sign.apk" | \
              sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p'
          )
          test "${#signer_digests[@]}" -eq 1
          test "${signer_digests[0]}" = "$EXPECTED_ANDROID_SIGNER_SHA256"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = Path("release")
          version = os.environ["RELEASE_VERSION"]
          expected = {
              "signed": release / f"DobbyVPN-v{version}-sign.apk",
              "unsigned": release / f"DobbyVPN-v{version}-unsign.apk",
          }
          manifest_path = release / f"DobbyVPN-v{version}-android-provenance.json"
          document = json.loads(manifest_path.read_text(encoding="utf-8"))
          if document.get("schema") != 1:
              raise SystemExit("Android provenance schema mismatch")
          if document.get("source_sha") != os.environ["RELEASE_SOURCE_SHA"]:
              raise SystemExit("Android provenance source mismatch")
          if document.get("version_name") != version:
              raise SystemExit("Android provenance version mismatch")
          if document.get("version_code") != int(os.environ["ANDROID_VERSION_CODE"]):
              raise SystemExit("Android provenance version code mismatch")
          if document.get("application_id") != "com.dobby.vpn":
              raise SystemExit("Android provenance application ID mismatch")
          if document.get("signer_certificate_sha256") != os.environ["EXPECTED_ANDROID_SIGNER_SHA256"]:
              raise SystemExit("Android signer certificate mismatch")
          if document.get("signed_payload_matches_unsigned") is not True:
              raise SystemExit("Android signed-payload binding is missing")

          artifacts = document.get("artifacts")
          if not isinstance(artifacts, list) or len(artifacts) != len(expected):
              raise SystemExit("Android provenance artifact set mismatch")
          by_kind = {item.get("kind"): item for item in artifacts if isinstance(item, dict)}
          if set(by_kind) != set(expected):
              raise SystemExit("Android provenance artifact kinds mismatch")
          for kind, path in expected.items():
              item = by_kind[kind]
              if item.get("name") != path.name:
                  raise SystemExit(f"Android provenance {kind} filename mismatch")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if item.get("sha256") != digest:
                  raise SystemExit(f"Android provenance {kind} digest mismatch")
          print("Android provenance validation passed")
          PY

      - name: Create F-Droid version metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "versionName=$RELEASE_VERSION"
            echo "versionCode=${{ steps.preflight.outputs.android_version_code }}"
          } > release/version.txt

      - name: Create and verify public release provenance
        shell: bash
        run: |
          set -euo pipefail
          asset_args=(
            --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json"
            --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk"
            --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk"
            --asset dobbyVPN-linux.deb
            --asset dobbyVPN-macos-aarch64.pkg
            --asset dobbyVPN-macos-amd64.pkg
            --asset dobbyVPN-windows-amd64.msi
            --asset version.txt
          )
          metadata_args=(
            --directory release
            --tag "${{ steps.preflight.outputs.tag }}"
            --version "$RELEASE_VERSION"
            --source-sha "$RELEASE_SOURCE_SHA"
            --release-run-id "$RELEASE_RUN_ID"
            --release-run-number "${{ steps.preflight.outputs.run_number }}"
            --android-version-code "${{ steps.preflight.outputs.android_version_code }}"
          )
          python3 .github/scripts/release_provenance.py create \
            "${metadata_args[@]}" "${asset_args[@]}"
          python3 .github/scripts/release_provenance.py verify \
            "${metadata_args[@]}" "${asset_args[@]}"

      - name: Verify already-published release against selected run
        if: steps.preflight.outputs.release_state == 'published'
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "${{ steps.preflight.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published \
            --pattern '*'
          cmp release/release-provenance.json published/release-provenance.json
          python3 .github/scripts/release_provenance.py verify \
            --directory published \
            --tag "${{ steps.preflight.outputs.tag }}" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --release-run-number "${{ steps.preflight.outputs.run_number }}" \
            --android-version-code "${{ steps.preflight.outputs.android_version_code }}" \
            --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
            --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk" \
            --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --asset dobbyVPN-linux.deb \
            --asset dobbyVPN-macos-aarch64.pkg \
            --asset dobbyVPN-macos-amd64.pkg \
            --asset dobbyVPN-windows-amd64.msi \
            --asset version.txt

      - name: Create verified draft and publish
        if: steps.preflight.outputs.release_state == 'new'
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ steps.preflight.outputs.tag }}"
          expected_tag_object="${{ steps.preflight.outputs.tag_ref_object }}"
          tag_created=false
          draft_created=false
          owned_release_id=""
          published=false
          transaction="$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$RELEASE_SOURCE_SHA"
          release_notes="DobbyVPN $RELEASE_VERSION (build ${{ steps.preflight.outputs.run_number }}); promotion=$transaction"

          exact_tag_record() {
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$release_tag" | \
              jq -sc --arg ref "refs/tags/$release_tag" '
                [.[][] | select(.ref == $ref)] |
                if length == 0 then empty
                elif length == 1 then .[0]
                else error("duplicate exact tag refs")
                end'
          }

          verify_remote_tag() {
            local expected_object="$1"
            local record
            local object_type
            local object_sha
            record="$(exact_tag_record)"
            test -n "$record"
            object_type="$(jq -r .object.type <<<"$record")"
            object_sha="$(jq -r .object.sha <<<"$record")"
            test "$object_sha" = "$expected_object"
            for _ in 1 2 3 4 5 6 7 8; do
              if [[ "$object_type" != tag ]]; then
                break
              fi
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r .object.type <<<"$tag_object")"
              object_sha="$(jq -r .object.sha <<<"$tag_object")"
            done
            test "$object_type" = commit
            test "$object_sha" = "$RELEASE_SOURCE_SHA"
          }

          exact_release() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
              jq -sc --arg tag "$release_tag" '
                [.[][] | select(.tag_name == $tag)] |
                if length == 0 then empty
                elif length == 1 then .[0]
                else error("duplicate releases for exact tag")
                end'
          }

          wait_for_exact_release() {
            local expected_draft="${1:-any}"
            local record
            for _ in {1..30}; do
              if record="$(exact_release)" && [[ -n "$record" ]]; then
                if [[ "$expected_draft" == any || "$(jq -r .draft <<<"$record")" == "$expected_draft" ]]; then
                  printf '%s\n' "$record"
                  return 0
                fi
              fi
              sleep 1
            done
            return 1
          }

          rollback() {
            status=$?
            if (( status == 0 )) || [[ "$published" == true ]]; then
              exit "$status"
            fi
            set +e
            safe_to_delete_tag=false
            if [[ "$draft_created" == true ]]; then
              if [[ ! "$owned_release_id" =~ ^[1-9][0-9]*$ ]]; then
                release_record="$(wait_for_exact_release any)"
                release_query_status=$?
                if (( release_query_status == 0 )); then
                  owned_release_id="$(jq -r .id <<<"$release_record")"
                fi
              fi
              if [[ "$owned_release_id" =~ ^[1-9][0-9]*$ ]]; then
                release_record="$(gh api "repos/$GITHUB_REPOSITORY/releases/$owned_release_id")"
              else
                release_record=""
              fi
              if [[ "$owned_release_id" =~ ^[1-9][0-9]*$ ]] && \
                 [[ "$(jq -r .tag_name <<<"$release_record")" == "$release_tag" ]] && \
                 [[ "$(jq -r .draft <<<"$release_record")" == true ]] && \
                 [[ "$(jq -r .body <<<"$release_record")" == "$release_notes" ]] && \
                 gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$owned_release_id"; then
                safe_to_delete_tag=true
              else
                echo "warning: failed to roll back owned draft release $release_tag" >&2
              fi
            else
              release_record="$(exact_release)"
              release_query_status=$?
              if (( release_query_status != 0 )); then
                echo "warning: could not determine rollback release ownership" >&2
              elif [[ -z "$release_record" ]]; then
                safe_to_delete_tag=true
              else
                echo "warning: refusing to roll back a release not created by this run" >&2
              fi
            fi

            if [[ "$tag_created" == true && "$safe_to_delete_tag" == true ]]; then
              remote_record="$(exact_tag_record)"
              tag_query_status=$?
              if (( tag_query_status != 0 )); then
                echo "warning: could not determine rollback tag ownership" >&2
              elif [[ -z "$remote_record" ]]; then
                :
              elif [[ "$(jq -r .object.sha <<<"$remote_record")" == "$expected_tag_object" ]]; then
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" || \
                  echo "warning: failed to roll back owned tag $release_tag" >&2
              else
                echo "warning: refusing to delete a tag object not owned by this run" >&2
              fi
            fi
            exit "$status"
          }
          trap rollback EXIT

          if [[ "${{ steps.preflight.outputs.tag_state }}" == absent ]]; then
            test -z "$expected_tag_object"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$release_tag" "$RELEASE_SOURCE_SHA" --message "DobbyVPN $release_tag"
            test "$(git rev-parse "$release_tag^{}")" = "$RELEASE_SOURCE_SHA"
            expected_tag_object="$(git rev-parse "$release_tag^{tag}")"
            [[ "$expected_tag_object" =~ ^[0-9a-f]{40}$ ]]
            tag_created=true
            git push origin "refs/tags/$release_tag"
          else
            test "${{ steps.preflight.outputs.tag_state }}" = existing
            [[ "$expected_tag_object" =~ ^[0-9a-f]{40}$ ]]
          fi
          verify_remote_tag "$expected_tag_object"

          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$release_tag" \
            --notes "$release_notes" \
            release/*
          draft_created=true
          release_record="$(wait_for_exact_release true)"
          owned_release_id="$(jq -r .id <<<"$release_record")"
          [[ "$owned_release_id" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r .draft <<<"$release_record")" = true
          test "$(jq -r .tag_name <<<"$release_record")" = "$release_tag"
          test "$(jq -r .body <<<"$release_record")" = "$release_notes"
          verify_remote_tag "$expected_tag_object"

          mkdir published
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published \
            --pattern '*'
          cmp release/release-provenance.json published/release-provenance.json
          python3 .github/scripts/release_provenance.py verify \
            --directory published \
            --tag "$release_tag" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --release-run-id "$RELEASE_RUN_ID" \
            --release-run-number "${{ steps.preflight.outputs.run_number }}" \
            --android-version-code "${{ steps.preflight.outputs.android_version_code }}" \
            --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
            --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk" \
            --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --asset dobbyVPN-linux.deb \
            --asset dobbyVPN-macos-aarch64.pkg \
            --asset dobbyVPN-macos-amd64.pkg \
            --asset dobbyVPN-windows-amd64.msi \
            --asset version.txt
          verify_remote_tag "$expected_tag_object"
          gh release edit "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          published=true
          release_record="$(wait_for_exact_release false)"
          test "$(jq -r .id <<<"$release_record")" = "$owned_release_id"
          test "$(jq -r .draft <<<"$release_record")" = false
          test "$(jq -r .tag_name <<<"$release_record")" = "$release_tag"
          trap - EXIT

      - name: Confirm publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ steps.preflight.outputs.tag }}" --jq .sha)" = \
            "$RELEASE_SOURCE_SHA"
          gh release view "${{ steps.preflight.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName,url \
            --jq 'select(.isDraft == false) | {tagName,url}'
