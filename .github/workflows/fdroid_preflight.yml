name: F-Droid Preflight

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true
      build_run_id:
        default: ''
        required: false
        type: string
      retention_days:
        default: 1
        type: number

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Validate F-Droid update, build and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FDROID_IMAGE: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the candidate unsigned Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.run_id }}
        run: |
          python3 .github/scripts/release/download_artifact.py \
            "$BUILD_RUN_ID" dobbyvpn-android-unsign.apk "$RUNNER_TEMP/fdroid-reference"
      - name: Fetch current official F-Droid tools and shared build resources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-unsign.apk"
          df -h /
          git clone --depth 1 https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata"
          git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git "$RUNNER_TEMP/fdroidserver"
          git -C "$RUNNER_TEMP/fdroiddata" rev-parse HEAD
          git -C "$RUNNER_TEMP/fdroidserver" rev-parse HEAD
          docker pull "$FDROID_IMAGE"
          docker image inspect --format='{{index .RepoDigests 0}}' "$FDROID_IMAGE"
      - name: Run the unmodified updater, metadata checks, build and scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fdroid-build"
          docker run --rm --init \
            --volume "$GITHUB_WORKSPACE:/workspace/product:ro" \
            --volume "$RUNNER_TEMP/fdroiddata:/workspace/fdroiddata:ro" \
            --volume "$RUNNER_TEMP/fdroidserver:/workspace/fdroidserver:ro" \
            --volume "$RUNNER_TEMP/fdroid-reference:/workspace/reference:ro" \
            --volume "$RUNNER_TEMP/fdroid-build:/home/vagrant/tmp" \
            --env SOURCE_SHA --env VERSION_NAME --env VERSION_CODE \
            --env SOURCE_REPOSITORY="$GITHUB_REPOSITORY" \
            "$FDROID_IMAGE" bash -euo pipefail -c '
              source /etc/profile.d/bsenv.sh
              export ANDROID_HOME="${ANDROID_HOME:-/opt/android-sdk}"
              export ANDROID_SDK_ROOT="$ANDROID_HOME"
              export DEBIAN_FRONTEND=noninteractive
              printf "%s\n" "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/dobby-jdk17.list
              apt-get update
              apt-get install -y sudo
              apt-get install -y -t trixie-backports golang-1.27-go
              apt-get install -y -t bookworm openjdk-17-jdk-headless
              test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
              sdkmanager "cmdline-tools;latest"
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$PATH"
              chown -R vagrant:vagrant /home/vagrant
              sudo --set-home --user vagrant git config --global --add safe.directory /workspace/product
              sudo --set-home --user vagrant git config --global --add safe.directory /workspace/product/.git
              sudo --preserve-env --set-home --user vagrant env "PATH=$PATH" \
                python3 /workspace/product/.github/scripts/android/fdroid_preflight.py \
                --source-root /workspace/product \
                --work-root /home/vagrant \
                --fdroiddata /workspace/fdroiddata \
                --fdroidserver /workspace/fdroidserver \
                --reference-apk "/workspace/reference/DobbyVPN-v${VERSION_NAME}-unsign.apk" \
                --source-sha "$SOURCE_SHA" \
                --repository "$SOURCE_REPOSITORY" \
                --apkanalyzer "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
                --version-name "$VERSION_NAME" --version-code "$VERSION_CODE"
            '
      - name: Retain failed F-Droid rebuilt APK
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-fdroid-rebuild.apk
          path: ${{ runner.temp }}/fdroid-build/com.dobby.vpn_${{ env.VERSION_CODE }}.apk
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention_days }}
