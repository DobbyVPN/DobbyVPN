name: Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build workflow run whose packages should be signed for the GitHub Release and internal TestFlight.
        required: true
        type: string
      test_run_id:
        description: Successful Test workflow run that qualified the selected Build.
        required: true
        type: string
      release_notes:
        description: English release notes for the GitHub Release and App Store submission.
        required: true
        type: string

concurrency:
  group: release-verification
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  resolve_inputs:
    name: Validate selected Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      deployments: read
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.selection.outputs.source_sha }}
      build_run_number: ${{ steps.selection.outputs.build_run_number }}
      test_run_number: ${{ steps.selection.outputs.test_run_number }}
      version_name: ${{ steps.selection.outputs.version_name }}
      android_version_code: ${{ steps.selection.outputs.android_version_code }}
      apple_build_number: ${{ steps.selection.outputs.apple_build_number }}
      build_manifest_sha256: ${{ steps.selection.outputs.build_manifest_sha256 }}
      test_result_sha256: ${{ steps.selection.outputs.test_result_sha256 }}
    steps:
      - name: Require production branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve and verify the selected Build manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release/build_manifest.py resolve \
            --require-main --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ inputs.build_run_id }}" \
            --download-dir "$RUNNER_TEMP/selected-build-manifest" \
            --output "$RUNNER_TEMP/build.json"
      - name: Resolve the successful Test result for that exact Build
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TEST_RUN_ID: ${{ inputs.test_run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release/test_manifest.py \
            --repository "$GITHUB_REPOSITORY" --run-id "$TEST_RUN_ID" \
            --build-manifest "$RUNNER_TEMP/build.json" \
            --download-dir "$RUNNER_TEMP/selected-test-result" \
            --output "$RUNNER_TEMP/test.json"
          python3 - "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/test.json" "$GITHUB_OUTPUT" <<'PYTHON'
          import json, sys
          build = json.loads(open(sys.argv[1], encoding="utf-8").read())
          test = json.loads(open(sys.argv[2], encoding="utf-8").read())
          values = {
              "source_sha": build["source_sha"],
              "build_run_number": build["run_number"],
              "test_run_number": test["run_number"],
              "version_name": build["version"],
              "android_version_code": build["android_version_code"],
              "apple_build_number": build["apple_build_number"],
              "build_manifest_sha256": build["manifest_sha256"],
              "test_result_sha256": test["manifest_sha256"],
          }
          with open(sys.argv[3], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PYTHON
      - name: Check selected source version and stable tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.selection.outputs.source_sha }}
          path: selected-source
          persist-credentials: false
      - name: Match selected source version and check the stable tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.selection.outputs.source_sha }}
          VERSION_NAME: ${{ steps.selection.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.selection.outputs.android_version_code }}
          APPLE_BUILD_NUMBER: ${{ steps.selection.outputs.apple_build_number }}
        run: |
          set -euo pipefail
          test "$(git -C selected-source rev-parse HEAD | tee /dev/stderr)" = "$SOURCE_SHA"
          actual_version="$(python3 .github/scripts/release/version_metadata.py --version-file selected-source/VERSION --field version_name)"
          actual_android_code="$(python3 .github/scripts/release/version_metadata.py --version-file selected-source/VERSION --field android_version_code)"
          test "$actual_version" = "$VERSION_NAME"
          test "$actual_android_code" = "$ANDROID_VERSION_CODE"
          python3 - "$SOURCE_SHA" "v$VERSION_NAME" <<'PYTHON'
          import json, subprocess, sys
          source_sha, tag = sys.argv[1:]
          def api(endpoint):
              return json.loads(subprocess.run(
                  ["gh", "api", endpoint], check=True, stdout=subprocess.PIPE,
              ).stdout)
          refs = api(f"repos/{__import__('os').environ['GITHUB_REPOSITORY']}/git/matching-refs/tags/{tag}")
          matches = [item for item in refs if item.get("ref") == f"refs/tags/{tag}"]
          if len(matches) > 1:
              raise SystemExit("GitHub returned duplicate exact stable tag refs")
          if not matches:
              raise SystemExit(0)
          target = matches[0].get("object")
          seen = set()
          while isinstance(target, dict) and target.get("type") == "tag":
              object_sha = target.get("sha")
              if not isinstance(object_sha, str) or object_sha in seen:
                  raise SystemExit("stable tag contains an invalid or cyclic annotated tag")
              seen.add(object_sha)
              target = api(f"repos/{__import__('os').environ['GITHUB_REPOSITORY']}/git/tags/{object_sha}").get("object")
          if not isinstance(target, dict) or target.get("type") != "commit":
              raise SystemExit("stable tag does not resolve to a commit")
          if target.get("sha") != source_sha:
              raise SystemExit(f"release tag {tag} points to {target.get('sha')}, not selected source {source_sha}")
          PYTHON
  upload_testflight:
    name: Upload selected iOS build to internal TestFlight
    needs: resolve_inputs
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check out selected source entitlements
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve_inputs.outputs.source_sha }}
          path: selected-source
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: publishing
        env:
          BUNDLE_RETRY: "3"
      - name: Set release metadata
        run: |
          set -euo pipefail
          echo "APP_STORE_VERSION=${{ needs.resolve_inputs.outputs.version_name }}" >> "$GITHUB_ENV"
          echo "APP_STORE_BUILD_NUMBER=${{ needs.resolve_inputs.outputs.apple_build_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${{ needs.resolve_inputs.outputs.version_name }}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${{ needs.resolve_inputs.outputs.apple_build_number }}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${{ needs.resolve_inputs.outputs.source_sha }}" >> "$GITHUB_ENV"
      - name: Download selected unsigned archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 .github/scripts/release/download_artifact.py \
            "$BUILD_RUN_ID" DobbyVPN.xcarchive.tar.gz selected-release
      - name: Prepare Apple signing identity and profiles
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          PROVISION_DOBBY_BASE64: ${{ secrets.PROVISION_DOBBY_BASE64 }}
          PROVISION_DOBBY_TUNNEL_BASE64: ${{ secrets.PROVISION_DOBBY_TUNNEL_BASE64 }}
        run: cd publishing && bundle exec fastlane ios prepare_signing
      - name: Sign and export selected archive without compiling
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_ENTITLEMENTS_DIR: ${{ github.workspace }}/selected-source/ui/apple/ios
        run: |
          set -euo pipefail
          bash selected-source/core/scripts/package_ios_app.sh iosexport \
            selected-release/DobbyVPN.ipa \
            selected-release/DobbyVPN.xcarchive.tar.gz
      - name: Verify signed IPA entitlements and profile binding
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/dobbyvpn-ios-entitlements.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          ditto -x -k selected-release/DobbyVPN.ipa "$work/extracted"
          apps=("$work"/extracted/Payload/*.app)
          test "${#apps[@]}" -eq 1
          tunnels=("${apps[0]}"/PlugIns/*.appex)
          test "${#tunnels[@]}" -eq 1
          codesign --verify --strict "${apps[0]}"
          codesign --verify --strict "${tunnels[0]}"
          codesign --display --entitlements :- "${apps[0]}" | tee "$work/app-entitlements.plist"
          codesign --display --entitlements :- "${tunnels[0]}" | tee "$work/tunnel-entitlements.plist"
          security cms -D -i "${apps[0]}/embedded.mobileprovision" > "$work/app-profile.plist"
          security cms -D -i "${tunnels[0]}/embedded.mobileprovision" > "$work/tunnel-profile.plist"
          python3 .github/scripts/ios/verify_ios_app_group.py \
            --app-entitlements "$work/app-entitlements.plist" \
            --app-profile "$work/app-profile.plist" \
            --tunnel-entitlements "$work/tunnel-entitlements.plist" \
            --tunnel-profile "$work/tunnel-profile.plist" \
            --app-info "${apps[0]}/Info.plist" \
            --tunnel-info "${tunnels[0]}/Info.plist" \
            --team-id "$APPLE_TEAM_ID" \
            --source-sha "$SOURCE_COMMIT" \
            --version "$VERSION_NAME" \
            --build-number "$APP_BUILD"
          stat -f "Signed IPA bytes: %z" selected-release/DobbyVPN.ipa
          shasum -a 256 selected-release/DobbyVPN.ipa
      - name: Verify Fastlane can read the selected IPA
        env:
          IPA_PATH: ${{ github.workspace }}/selected-release/DobbyVPN.ipa
        run: |
          cd publishing
          bundle exec ruby <<'RUBY'
          require "fastlane_core"
          require "fastlane_core/ipa_file_analyser"
          ipa = ENV.fetch("IPA_PATH")
          info = FastlaneCore::IpaFileAnalyser.fetch_info_plist_file(ipa)
          expected = {
            "CFBundleIdentifier" => "vpn.dobby.app",
            "CFBundleShortVersionString" => ENV.fetch("VERSION_NAME"),
            "CFBundleVersion" => ENV.fetch("APP_BUILD"),
            "DobbySourceCommit" => ENV.fetch("SOURCE_COMMIT")
          }
          abort "Fastlane read unexpected IPA metadata" unless info && expected.all? { |key, value| info[key].to_s == value }
          Zip::File.open(ipa) do |archive|
            archive.each do |entry|
              next if entry.directory?
              entry.get_input_stream { |stream| while (chunk = stream.read(1024 * 1024)) && !chunk.empty?; end }
            end
          end
          puts "Fastlane metadata and complete ZIP payload reading passed"
          RUBY
      - name: Upload or reuse exact IPA and wait for processing
        env:
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_IPA_PATH: ${{ github.workspace }}/selected-release/DobbyVPN.ipa
        run: |
          cd publishing
          bundle exec ruby <<'RUBY'
          require "spaceship"
          require "net/http"
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch("APP_STORE_KEY_ID"),
            issuer_id: ENV.fetch("APP_STORE_ISSUER_ID"),
            key: ENV.fetch("APP_STORE_API_KEY"),
            duration: 1200
          )
          app = Spaceship::ConnectAPI::App.find("vpn.dobby.app")
          abort "App Store Connect app was not found" unless app
          version = ENV.fetch("APP_STORE_VERSION")
          number = ENV.fetch("APP_STORE_BUILD_NUMBER")
          find_build = lambda do
            matches = Spaceship::ConnectAPI::Build.all(
              app_id: app.id, version: version, build_number: number, platform: "IOS"
            )
            abort "Multiple builds match #{version} (#{number})" if matches.length > 1
            matches.first
          end
          find_upload = lambda do
            uri = URI("https://api.appstoreconnect.apple.com/v1/apps/#{app.id}/buildUploads")
            uri.query = URI.encode_www_form(
              "filter[cfBundleShortVersionString]" => version,
              "filter[cfBundleVersion]" => number,
              "filter[platform]" => "IOS"
            )
            request = Net::HTTP::Get.new(uri)
            request["Authorization"] = "Bearer #{Spaceship::ConnectAPI.token.text}"
            response = Net::HTTP.start(uri.host, uri.port, use_ssl: true, open_timeout: 30, read_timeout: 30) { |http| http.request(request) }
            abort "Cannot read Apple upload status: HTTP #{response.code}" unless response.is_a?(Net::HTTPSuccess)
            uploads = JSON.parse(response.body).fetch("data")
            abort "Multiple uploads match #{version} (#{number})" if uploads.length > 1
            state = uploads.first&.dig("attributes", "state")
            abort "Apple upload processing failed; inspect App Store Connect delivery details" if state && state["state"] == "FAILED"
            state
          end
          build = find_build.call
          upload = find_upload.call
          if build || upload
            puts "Reusing uploaded build #{version} (#{number})"
          else
            success = system("bundle", "exec", "fastlane", "ios", "upload_testflight")
            abort "IPA upload failed" unless success
          end
          deadline = Process.clock_gettime(Process::CLOCK_MONOTONIC) + 900
          loop do
            build = find_build.call
            find_upload.call unless build
            if build
              abort "Selected Apple build is expired" if build.expired
              state = build.processing_state
              abort "Apple build processing failed: #{state}" if %w[FAILED INVALID].include?(state)
              if state == "VALID"
                puts "Build #{version} (#{number}) is ready for internal TestFlight testing"
                break
              end
            end
            abort "Timed out waiting for Apple build processing; retry Release to resume" if Process.clock_gettime(Process::CLOCK_MONOTONIC) >= deadline
            puts "Waiting for Apple to process #{version} (#{number})"
            sleep 30
          end
          RUBY
  prepare_release:
    name: Prepare signed Android package and public Release assets
    needs: resolve_inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload_prepared_release.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE_SHA: ${{ needs.resolve_inputs.outputs.source_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_RUN_NUMBER: ${{ needs.resolve_inputs.outputs.build_run_number }}
      TEST_RUN_ID: ${{ inputs.test_run_id }}
      TEST_RUN_NUMBER: ${{ needs.resolve_inputs.outputs.test_run_number }}
      BUILD_MANIFEST_SHA256: ${{ needs.resolve_inputs.outputs.build_manifest_sha256 }}
      TEST_RESULT_SHA256: ${{ needs.resolve_inputs.outputs.test_result_sha256 }}
      PUBLISH_RUN_ID: ${{ github.run_id }}
      PUBLISH_RUN_NUMBER: ${{ github.run_number }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      EXPECTED_ANDROID_SIGNER_SHA256: c3f0414a74012060d7c6aa3a3d9dac0aa13c1bd23b7512eefd860fb865e67933
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve_inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read release metadata
        id: metadata
        env:
          RELEASE_VERSION: ${{ needs.resolve_inputs.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.resolve_inputs.outputs.android_version_code }}
        run: |
          set -euo pipefail
          {
            echo "version=$RELEASE_VERSION"
            echo "version_code=$ANDROID_VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
      # Artifact names are deliberately exact; broad matching could include
      # build intermediates.
      - name: Download selected Build packages and Test Android provenance
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            dobbyVPN-linux-debug.deb \
            dobbyVPN-windows-amd64-debug.msi \
            dobbyVPN-macos-aarch64-debug.pkg \
            dobbyVPN-macos-amd64-debug.pkg \
            DobbyVPN.xcarchive-debug.tar.gz \
            dobbyvpn-android-debug.apk \
            dobbyVPN-linux.deb \
            dobbyVPN-windows-amd64.msi \
            dobbyVPN-macos-aarch64.pkg \
            dobbyVPN-macos-amd64.pkg \
            dobbyvpn-android-unsign.apk; do
            python3 .github/scripts/release/download_artifact.py \
              "$BUILD_RUN_ID" "$artifact" release
          done
          python3 .github/scripts/release/download_artifact.py \
            "$TEST_RUN_ID" dobbyvpn-android-provenance release
      - name: Read Android dependency versions
        id: pins
        run: |
          set -euo pipefail
          for pin in java_major android_build_tools android_cmdline_tools; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ steps.pins.outputs.java_major }}
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: build-tools;${{ steps.pins.outputs.android_build_tools }}
      - name: Verify and production-sign selected Android package
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          unsigned="release/DobbyVPN-v$RELEASE_VERSION-unsign.apk"
          python3 .github/scripts/release/download_artifact.py "$TEST_RUN_ID" test-result "$RUNNER_TEMP/selected-test-result"
          python3 - "$RUNNER_TEMP/selected-test-result/test-result.json" "$unsigned" <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import test_manifest
          raw = Path(sys.argv[1]).read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["TEST_RESULT_SHA256"]:
              raise SystemExit("selected Test result changed before publication")
          test_manifest.validate_android_pairing(json.loads(raw), hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest())
          PYTHON
          provenance="release/DobbyVPN-v$RELEASE_VERSION-android-provenance.json"
          signed="release/DobbyVPN-v$RELEASE_VERSION-sign.apk"
          test -f "$unsigned"; test -f "$provenance"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$sdk_root/build-tools/${{ steps.pins.outputs.android_build_tools }}/apksigner"
          test -x "$apksigner"
          export APKANALYZER="$sdk_root/cmdline-tools/${{ steps.pins.outputs.android_cmdline_tools }}/bin/apkanalyzer"
          test -x "$APKANALYZER"
          apkanalyzer="$(python3 .github/scripts/android/android_tool_selection.py --tool apkanalyzer)"

          python3 .github/scripts/android/verify_android_reproducibility.py verify-provenance \
            --apk "$unsigned" --provenance "$provenance" \
            --source-sha "$RELEASE_SOURCE_SHA" --version-name "$RELEASE_VERSION" \
            --version-code "$ANDROID_VERSION_CODE"
          python3 .github/scripts/android/verify_android_apk_source.py \
            --apk "$unsigned" --source-sha "$RELEASE_SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --apkanalyzer "$apkanalyzer" \
            --version-name "$RELEASE_VERSION" --version-code "$ANDROID_VERSION_CODE"

          python3 .github/scripts/android/android_apk_signing.py sign-release \
            --unsigned-apk "$unsigned" --signed-apk "$signed" --apksigner "$apksigner"

          python3 .github/scripts/android/android_apk_signing.py finalize-provenance \
            --provenance "$provenance" --unsigned-apk "$unsigned" --signed-apk "$signed" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --version-name "$RELEASE_VERSION" --version-code "$ANDROID_VERSION_CODE" \
            --apksigner "$apksigner"

          python3 .github/scripts/android/verify_android_reproducibility.py verify-publication \
            --unsigned-apk "$unsigned" --signed-apk "$signed" --provenance "$provenance" \
            --source-sha "$RELEASE_SOURCE_SHA" --version-name "$RELEASE_VERSION" \
            --version-code "$ANDROID_VERSION_CODE" \
            --signer-certificate-sha256 "$EXPECTED_ANDROID_SIGNER_SHA256"
      - name: Create Build/Test/Release provenance
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          APPLE_BUILD_NUMBER: ${{ needs.resolve_inputs.outputs.apple_build_number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release/version_metadata.py \
            --version "$RELEASE_VERSION" --update-file release/version.txt
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          notes_sha256="$(sha256sum "$RUNNER_TEMP/release-notes.md" | cut -d' ' -f1)"
          python3 .github/scripts/release/release_provenance.py create-published \
            --directory release --tag "v$RELEASE_VERSION" --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" --build-run-number "$BUILD_RUN_NUMBER" \
            --test-run-id "$TEST_RUN_ID" --test-run-number "$TEST_RUN_NUMBER" \
            --publish-run-id "$PUBLISH_RUN_ID" --publish-run-number "$PUBLISH_RUN_NUMBER" \
            --android-version-code "$ANDROID_VERSION_CODE" --apple-build-number "$APPLE_BUILD_NUMBER" \
            --build-manifest-sha256 "$BUILD_MANIFEST_SHA256" \
            --test-result-sha256 "$TEST_RESULT_SHA256" --release-notes-sha256 "$notes_sha256" \
            --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
            --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk" \
            --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --asset version.txt --asset dobbyVPN-linux.deb --asset dobbyVPN-macos-aarch64.pkg \
            --asset dobbyVPN-macos-amd64.pkg --asset dobbyVPN-windows-amd64.msi \
            --asset dobbyVPN-linux-debug.deb --asset dobbyVPN-windows-amd64-debug.msi \
            --asset dobbyVPN-macos-aarch64-debug.pkg --asset dobbyVPN-macos-amd64-debug.pkg \
            --asset DobbyVPN.xcarchive-debug.tar.gz --asset "DobbyVPN-v$RELEASE_VERSION-debug.apk"
      - name: Stage public assets and exact Release notes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dobbyvpn-release-prepared"
          cp -a release "$RUNNER_TEMP/dobbyvpn-release-prepared/release"
          cp -- "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/dobbyvpn-release-prepared/release-notes.md"
      - name: Upload prepared public Release assets
        id: upload_prepared_release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dobbyvpn-release-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dobbyvpn-release-prepared
          if-no-files-found: error
          retention-days: 7
  publish_github_release:
    name: Publish verified selected Build packages
    needs: [resolve_inputs, prepare_release, upload_testflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE_SHA: ${{ needs.resolve_inputs.outputs.source_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_RUN_NUMBER: ${{ needs.resolve_inputs.outputs.build_run_number }}
      TEST_RUN_ID: ${{ inputs.test_run_id }}
      TEST_RUN_NUMBER: ${{ needs.resolve_inputs.outputs.test_run_number }}
      BUILD_MANIFEST_SHA256: ${{ needs.resolve_inputs.outputs.build_manifest_sha256 }}
      TEST_RESULT_SHA256: ${{ needs.resolve_inputs.outputs.test_result_sha256 }}
      PUBLISH_RUN_ID: ${{ github.run_id }}
      PUBLISH_RUN_NUMBER: ${{ github.run_number }}
      PREPARED_ARTIFACT_NAME: dobbyvpn-release-prepared-${{ github.run_id }}-${{ github.run_attempt }}
      PREPARED_ARTIFACT_DIGEST: ${{ needs.prepare_release.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve_inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Read release metadata
        id: metadata
        env:
          RELEASE_VERSION: ${{ needs.resolve_inputs.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ needs.resolve_inputs.outputs.android_version_code }}
        run: |
          set -euo pipefail
          {
            echo "version=$RELEASE_VERSION"
            echo "version_code=$ANDROID_VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
      - name: Download and verify prepared Release artifact digest
        shell: bash
        run: |
          set -euo pipefail
          python3 release-tools/.github/scripts/release/download_artifact.py \
            "$PUBLISH_RUN_ID" "$PREPARED_ARTIFACT_NAME" "$RUNNER_TEMP/prepared-release" \
            --expected-digest "$PREPARED_ARTIFACT_DIGEST"
      - name: Verify prepared Release notes and asset inventory
        id: prepared
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_VERSION: ${{ needs.resolve_inputs.outputs.version_name }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/prepared-release" "$RELEASE_VERSION" <<'PYTHON'
          import hashlib, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import publish_selection
          root = Path(sys.argv[1])
          if root.is_symlink() or not root.is_dir():
              raise SystemExit("prepared Release artifact root is not a regular directory")
          expected_root = {"release", "release-notes.md"}
          if {item.name for item in root.iterdir()} != expected_root:
              raise SystemExit("prepared Release artifact contains unexpected or missing root entries")
          release_dir = root / "release"
          notes_path = root / "release-notes.md"
          if release_dir.is_symlink() or not release_dir.is_dir():
              raise SystemExit("prepared Release assets are missing or not a regular directory")
          if notes_path.is_symlink() or not notes_path.is_file():
              raise SystemExit("prepared Release notes are missing or not a regular file")
          notes = notes_path.read_bytes()
          if notes != os.environ["RELEASE_NOTES"].encode("utf-8"):
              raise SystemExit("prepared Release notes differ from the approved workflow input")
          publish_selection._release_assets(release_dir, sys.argv[2])
          notes_sha256 = hashlib.sha256(notes).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_notes_sha256={notes_sha256}\n")
          PYTHON
      - name: Verify prepared Release provenance bindings before publication
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          APPLE_BUILD_NUMBER: ${{ needs.resolve_inputs.outputs.apple_build_number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release/release_provenance.py verify-published \
            --directory "$RUNNER_TEMP/prepared-release/release" \
            --tag "v$RELEASE_VERSION" --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" --build-run-number "$BUILD_RUN_NUMBER" \
            --test-run-id "$TEST_RUN_ID" --test-run-number "$TEST_RUN_NUMBER" \
            --publish-run-id "$PUBLISH_RUN_ID" --publish-run-number "$PUBLISH_RUN_NUMBER" \
            --android-version-code "$ANDROID_VERSION_CODE" --apple-build-number "$APPLE_BUILD_NUMBER" \
            --build-manifest-sha256 "$BUILD_MANIFEST_SHA256" \
            --test-result-sha256 "$TEST_RESULT_SHA256" \
            --release-notes-sha256 "${{ steps.prepared.outputs.release_notes_sha256 }}" \
            --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
            --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk" \
            --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --asset version.txt --asset dobbyVPN-linux.deb --asset dobbyVPN-macos-aarch64.pkg \
            --asset dobbyVPN-macos-amd64.pkg --asset dobbyVPN-windows-amd64.msi \
            --asset dobbyVPN-linux-debug.deb --asset dobbyVPN-windows-amd64-debug.msi \
            --asset dobbyVPN-macos-aarch64-debug.pkg --asset dobbyVPN-macos-amd64-debug.pkg \
            --asset DobbyVPN.xcarchive-debug.tar.gz --asset "DobbyVPN-v$RELEASE_VERSION-debug.apk"
          cp -a "$RUNNER_TEMP/prepared-release/release" release
      - name: Create tag and GitHub Release
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_NOTES_SHA256: ${{ steps.prepared.outputs.release_notes_sha256 }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          release_lookup_dir="$(mktemp -d "$RUNNER_TEMP/release-list.XXXXXX")"
          trap 'rm -rf -- "$release_lookup_dir"' EXIT
          release_lookup_stdout="$release_lookup_dir/stdout"
          release_lookup_stderr="$release_lookup_dir/stderr"
          set +e
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            >"$release_lookup_stdout" 2>"$release_lookup_stderr"
          release_lookup_status=$?
          set -e
          if [ "$release_lookup_status" -ne 0 ]; then
            cat "$release_lookup_stdout"
            cat "$release_lookup_stderr" >&2
            printf 'Unable to list GitHub Releases before publication (gh api exited %s).\n' \
              "$release_lookup_status" >&2
            exit "$release_lookup_status"
          fi
          if exact_release_count="$(python3 - "$release_lookup_stdout" "$tag" <<'PYTHON'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as response_file:
                  pages = json.load(response_file)
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Invalid GitHub Releases response: {error}")

          if not isinstance(pages, list) or not pages:
              raise SystemExit("Invalid GitHub Releases response: expected a nonempty page array")
          exact_matches = 0
          for page in pages:
              if not isinstance(page, list):
                  raise SystemExit("Invalid GitHub Releases response: page is not an array")
              for release in page:
                  if not isinstance(release, dict) or not isinstance(release.get("tag_name"), str):
                      raise SystemExit("Invalid GitHub Releases response: release has no string tag_name")
                  exact_matches += release["tag_name"] == sys.argv[2]

          if exact_matches > 1:
              raise SystemExit(f"GitHub Releases response contains duplicate exact tag {sys.argv[2]}")
          print(exact_matches)
          PYTHON
          )"; then
            :
          else
            release_parse_status=$?
            cat "$release_lookup_stdout"
            cat "$release_lookup_stderr" >&2
            printf 'Unable to validate GitHub Releases before publication.\n' >&2
            exit "$release_parse_status"
          fi
          cat "$release_lookup_stderr" >&2
          if [ "$exact_release_count" -eq 1 ]; then
            echo "GitHub Release $tag already exists; checking its Build/Test/Release provenance."
            mkdir "$RUNNER_TEMP/existing-release"
            gh release download "$tag" --dir "$RUNNER_TEMP/existing-release"
            python3 .github/scripts/release/release_provenance.py verify-published \
              --directory "$RUNNER_TEMP/existing-release" --tag "$tag" --version "$RELEASE_VERSION" \
              --source-sha "$RELEASE_SOURCE_SHA" \
              --build-run-id "$BUILD_RUN_ID" --build-run-number "$BUILD_RUN_NUMBER" \
              --test-run-id "$TEST_RUN_ID" --test-run-number "$TEST_RUN_NUMBER" \
              --publish-run-id "$PUBLISH_RUN_ID" --publish-run-number "$PUBLISH_RUN_NUMBER" \
              --android-version-code "${{ needs.resolve_inputs.outputs.android_version_code }}" \
              --apple-build-number "${{ needs.resolve_inputs.outputs.apple_build_number }}" \
              --build-manifest-sha256 "$BUILD_MANIFEST_SHA256" \
              --test-result-sha256 "$TEST_RESULT_SHA256" --release-notes-sha256 "$RELEASE_NOTES_SHA256" \
              --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
              --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk" \
              --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
              --asset version.txt --asset dobbyVPN-linux.deb --asset dobbyVPN-macos-aarch64.pkg \
              --asset dobbyVPN-macos-amd64.pkg --asset dobbyVPN-windows-amd64.msi \
              --asset dobbyVPN-linux-debug.deb --asset dobbyVPN-windows-amd64-debug.msi \
              --asset dobbyVPN-macos-aarch64-debug.pkg --asset dobbyVPN-macos-amd64-debug.pkg \
              --asset DobbyVPN.xcarchive-debug.tar.gz --asset "DobbyVPN-v$RELEASE_VERSION-debug.apk"
          else
            echo "GitHub Release $tag is absent from the complete paginated list; checking the local tag."
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-list -n1 "$tag^{commit}")" = "$RELEASE_SOURCE_SHA"
            else
              tag_lookup_status=$?
              if [ "$tag_lookup_status" -ne 1 ]; then
                printf 'Unable to inspect exact release tag ref refs/tags/%s (git show-ref exited %s).\n' \
                  "$tag" "$tag_lookup_status" >&2
                exit "$tag_lookup_status"
              fi
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git tag --annotate "$tag" "$RELEASE_SOURCE_SHA" --message "DobbyVPN $tag"
              git push origin "refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag --title "$tag" \
              --notes-file "$RUNNER_TEMP/prepared-release/release-notes.md" release/*
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PYTHON'
          import hashlib, json, os, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          body = release.get("body")
          if not isinstance(body, str):
              raise SystemExit("GitHub Release body is missing or invalid")
          actual = hashlib.sha256(body.encode("utf-8")).hexdigest()
          if actual != os.environ["RELEASE_NOTES_SHA256"]:
              raise SystemExit("GitHub Release notes do not match the reviewed Release input")
          PYTHON
      - name: Verify published GitHub Release assets
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          APPLE_BUILD_NUMBER: ${{ needs.resolve_inputs.outputs.apple_build_number }}
          RELEASE_NOTES_SHA256: ${{ steps.prepared.outputs.release_notes_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "v$RELEASE_VERSION" --dir published --pattern '*'
          python3 .github/scripts/release/release_provenance.py verify-published \
            --directory published --tag "v$RELEASE_VERSION" --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --build-run-id "$BUILD_RUN_ID" --build-run-number "$BUILD_RUN_NUMBER" \
            --test-run-id "$TEST_RUN_ID" --test-run-number "$TEST_RUN_NUMBER" \
            --publish-run-id "$PUBLISH_RUN_ID" --publish-run-number "$PUBLISH_RUN_NUMBER" \
            --android-version-code "$ANDROID_VERSION_CODE" --apple-build-number "$APPLE_BUILD_NUMBER" \
            --build-manifest-sha256 "$BUILD_MANIFEST_SHA256" \
            --test-result-sha256 "$TEST_RESULT_SHA256" --release-notes-sha256 "$RELEASE_NOTES_SHA256" \
            --asset "DobbyVPN-v$RELEASE_VERSION-android-provenance.json" \
            --asset "DobbyVPN-v$RELEASE_VERSION-sign.apk" \
            --asset "DobbyVPN-v$RELEASE_VERSION-unsign.apk" \
            --asset version.txt --asset dobbyVPN-linux.deb --asset dobbyVPN-macos-aarch64.pkg \
            --asset dobbyVPN-macos-amd64.pkg --asset dobbyVPN-windows-amd64.msi \
            --asset dobbyVPN-linux-debug.deb --asset dobbyVPN-windows-amd64-debug.msi \
            --asset dobbyVPN-macos-aarch64-debug.pkg --asset dobbyVPN-macos-amd64-debug.pkg \
            --asset DobbyVPN.xcarchive-debug.tar.gz --asset "DobbyVPN-v$RELEASE_VERSION-debug.apk"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PYTHON'
          import hashlib, json, os, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          body = release.get("body")
          if not isinstance(body, str) or hashlib.sha256(body.encode("utf-8")).hexdigest() != os.environ["RELEASE_NOTES_SHA256"]:
              raise SystemExit("published GitHub Release notes do not match the reviewed Release input")
          PYTHON
      - name: Record the successful Release identity for Delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-result
          path: published/release-provenance.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
