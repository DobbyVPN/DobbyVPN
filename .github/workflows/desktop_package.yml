name: Build one desktop package

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_name:
        required: true
        type: string
      debug:
        type: boolean
        default: false
      source_sha:
        required: true
        type: string
      retention_days:
        default: 1
        type: number

permissions:
  contents: read

jobs:
  package:
    name: ${{ inputs.platform }} / ${{ inputs.architecture }} package
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || 'windows-2022' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out package source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PRODUCTION_BUILD: ${{ github.workflow_ref == 'DobbyVPN/DobbyVPN/.github/workflows/build.yml@refs/heads/main' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$PRODUCTION_BUILD" == true ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$SOURCE_SHA" = "$GITHUB_SHA"
          fi

      - name: Restore Go modules and verified tool archives
        uses: ./.github/actions/dependency-cache
        with:
          pinned-tools: ${{ inputs.platform == 'linux' || inputs.platform == 'windows' }}

      - name: Install pinned .NET SDK
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build package with the local platform command
        id: build
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
          VERSION_NAME: ${{ inputs.version_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          output="$RUNNER_TEMP/dobbyvpn-desktop-package"
          package_args=(build)
          if [[ "$DEBUG" == true ]]; then package_args+=(--debug); fi
          python3 .github/scripts/desktop/desktop_package.py "${package_args[@]}" \
            --platform "$PLATFORM" --arch "$ARCHITECTURE" \
            --version "$VERSION_NAME" --source-sha "$SOURCE_SHA" \
            --output-dir "$output"
          case "$PLATFORM:$ARCHITECTURE" in
            linux:amd64) package=dobbyVPN-linux.deb ;;
            windows:amd64) package=dobbyVPN-windows-amd64.msi ;;
            *) exit 1 ;;
          esac
          if [[ "$DEBUG" == true ]]; then package="${package%.*}-debug.${package##*.}"; fi
          test -s "$output/$package"
          printf 'package=%s\n' "$output/$package" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$package" >> "$GITHUB_OUTPUT"

      # The MSI of this exact build, installed under SYSTEM through a scheduled task (as Intune and SCCM do): refused early without
      # DOBBYVPN_CONTROL_PIPE_SID, installed with it, uninstalled without it. Debug builds only (the pull request signal); the release
      # package gets the same checks, plus the upgrade over a released MSI, in the Test workflow.
      - name: Check the SYSTEM install guard of the MSI
        if: ${{ inputs.platform == 'windows' && inputs.debug }}
        shell: bash
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: python3 .github/scripts/desktop/windows_system_install_check.py --package "$PACKAGE" --log-dir "$RUNNER_TEMP/system-install-check"

      - name: Upload exact package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact }}${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
