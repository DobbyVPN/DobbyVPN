name: Build one desktop package

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_name:
        required: true
        type: string
      debug:
        type: boolean
        default: false
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: ${{ inputs.platform }} / ${{ inputs.architecture }} package
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || inputs.platform == 'windows' && 'windows-2022' || inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - name: Reject Release reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Build package with the local platform command
        id: build
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
          VERSION_NAME: ${{ inputs.version_name }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          output="$RUNNER_TEMP/dobbyvpn-desktop-package"
          package_args=(build)
          if [[ "$DEBUG" == true ]]; then package_args+=(--debug); fi
          python3 .github/scripts/desktop/desktop_package.py "${package_args[@]}" \
            --platform "$PLATFORM" --arch "$ARCHITECTURE" \
            --version "$VERSION_NAME" --source-sha "$SOURCE_SHA" \
            --output-dir "$output"
          case "$PLATFORM:$ARCHITECTURE" in
            linux:amd64) package=dobbyVPN-linux.deb ;;
            windows:amd64) package=dobbyVPN-windows-amd64.msi ;;
            macos:arm64) package=dobbyVPN-macos-aarch64.pkg ;;
            macos:amd64) package=dobbyVPN-macos-amd64.pkg ;;
            *) exit 1 ;;
          esac
          if [[ "$DEBUG" == true ]]; then package="${package%.*}-debug.${package##*.}"; fi
          test -s "$output/$package"
          printf 'package=%s\n' "$output/$package" >> "$GITHUB_OUTPUT"
          printf 'artifact=%s\n' "$package" >> "$GITHUB_OUTPUT"

      - name: Upload exact package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ steps.build.outputs.package }}
          if-no-files-found: error
          retention-days: ${{ github.workflow == 'Release' && 7 || 1 }}
