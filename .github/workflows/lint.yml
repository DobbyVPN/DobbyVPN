name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GOTOOLCHAIN: local

jobs:
  lint-go-client:
    name: "Go Lint — golangci-lint"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Run golangci-lint with reviewdog
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: go_module
          golangci_lint_flags: --config .golangci.yml ./...
          reporter: github-pr-review
          filter_mode: nofilter
          level: warning
          fail_level: error

  lint-android:
    name: "Android native-shell lint"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Download Go modules
        working-directory: go_module
        run: go mod download

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platforms;android-35 build-tools;36.0.0 ndk;27.3.13750724

      - name: Run Android native-shell lint
        working-directory: android_module
        run: ./gradlew -PdobbyGoBinary="$(go env GOROOT)/bin/go" :app:lintRelease --no-daemon --stacktrace

  lint-swift:
    name: "Swift Lint — SwiftLint"
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup reviewdog
        uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893 # v1.3.2
        with:
          reviewdog_version: v0.20.3

      - name: Install SwiftLint
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint

      - name: Run SwiftLint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: swift_module
        run: |
          swiftlint lint --config .swiftlint.yml --reporter checkstyle | \
            reviewdog -f=checkstyle -name="SwiftLint" -reporter=github-pr-review -level=warning
