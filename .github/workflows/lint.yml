name: Lint

on:
  workflow_call:

env:
  GOTOOLCHAIN: local

jobs:
  lint-go-client:
    name: "Go Lint — golangci-lint"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Stage Linux native/Fyne dependencies
        run: python3 .github/scripts/desktop_build.py prepare-go-test-deps --go-mod-tidy

      - name: Install pinned golangci-lint
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/golangci-lint-bin"
          mkdir -p "$GOBIN"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          test -x "$GOBIN/golangci-lint"
          "$GOBIN/golangci-lint" version
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Setup reviewdog
        uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893 # v1.3.2
        with:
          reviewdog_version: v0.20.3

      - name: Run pinned golangci-lint and annotate with reviewdog
        working-directory: go_module
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/golangci-lint.txt"
          if golangci-lint run --output.text.path stdout --config .golangci.yml ./... >"$report" 2>&1; then
            lint_status=0
          else
            lint_status=$?
          fi
          cat "$report"
          if [[ -s "$report" ]]; then
            reviewdog \
              -f=golangci-lint \
              -name=golangci \
              -reporter=github-pr-review \
              -filter-mode=nofilter \
              -level=warning \
              -fail-level=none \
              <"$report" || true
          fi
          exit "$lint_status"

  lint-android:
    name: "Android native-shell lint"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Download Go modules
        working-directory: go_module
        run: go mod download

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-disabled: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platforms;android-35 build-tools;36.0.0 ndk;27.3.13750724

      - name: Run Android native-shell lint
        working-directory: android_module
        run: ./gradlew -PdobbyGoBinary="$(go env GOROOT)/bin/go" :app:lintRelease --no-daemon --stacktrace

  lint-swift:
    name: "Swift Lint — SwiftLint"
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup reviewdog
        uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893 # v1.3.2
        with:
          reviewdog_version: v0.20.3

      - name: Install SwiftLint
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint

      - name: Run SwiftLint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: swift_module
        run: |
          swiftlint lint --config .swiftlint.yml --reporter checkstyle | \
            reviewdog -f=checkstyle -name="SwiftLint" -reporter=github-pr-review -level=warning
