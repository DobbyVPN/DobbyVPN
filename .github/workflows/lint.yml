name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-go-client:
    name: "Go Lint — golangci-lint"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Run golangci-lint with reviewdog
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: go_module
          golangci_lint_flags: --config .golangci.yml ./...
          reporter: github-pr-review
          filter_mode: nofilter
          level: warning
          fail_level: error

  lint-kotlin:
    name: "Kotlin Lint — detekt"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Setup reviewdog
        uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893 # v1.3.2
        with:
          reviewdog_version: v0.20.3

      - name: Run detekt
        working-directory: kmp_module
        run: |
          ./gradlew \
            :app:detektMetadataCommonMain \
            :app:detektJvmMain \
            :grpcstub:detekt

      - name: Upload Detekt baseline-ratchet reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: kmp_module/**/build/reports/detekt/
          if-no-files-found: error

      - name: Report Detekt results on pull requests
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The tracked Detekt baselines suppress only acknowledged findings.
          # New findings fail the Gradle task above and are also surfaced here.
          mapfile -d '' -t detekt_files < <(
            find kmp_module -path "*/build/reports/detekt/*.xml" -type f -print0 | sort -z
          )
          ((${#detekt_files[@]}))
          for f in "${detekt_files[@]}"; do
            test -s "$f"
            reviewdog -f=checkstyle -name="detekt" -reporter=github-pr-review -level=warning -fail-level=error < "$f"
          done

  lint-swift:
    name: "Swift Lint — SwiftLint"
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup reviewdog
        uses: reviewdog/action-setup@e04ffabe3898a0af8d0fb1af00c188831c4b5893 # v1.3.2
        with:
          reviewdog_version: v0.20.3

      - name: Install SwiftLint
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint

      - name: Run SwiftLint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: swift_module
        run: |
          swiftlint lint --config .swiftlint.yml --reporter checkstyle | \
            reviewdog -f=checkstyle -name="SwiftLint" -reporter=github-pr-review -level=warning
