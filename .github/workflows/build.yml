name: Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare_version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      maintenance: ${{ steps.version.outputs.maintenance }}
      version_name: ${{ steps.version.outputs.version_name }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      apple_build_number: ${{ steps.version.outputs.apple_build_number }}
    steps:
      - name: Reject Build reruns
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Build reruns are unsupported; dispatch a fresh Build workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release/version_metadata.py \
            --version-file VERSION \
            --github-output "$GITHUB_OUTPUT"
          version_name="$(
            python3 .github/scripts/release/version_metadata.py \
              --version-file VERSION \
              --field version_name
          )"
          android_version_code="$(
            python3 .github/scripts/release/version_metadata.py \
              --version-file VERSION \
              --field android_version_code
          )"
          apple_build_number=$((android_version_code + GITHUB_RUN_NUMBER))
          echo "apple_build_number=$apple_build_number" >> "$GITHUB_OUTPUT"
          echo "Marketing version $version_name; Android versionCode $android_version_code; Apple build $apple_build_number"

  ios_libraries_build:
    needs: prepare_version
    uses: ./.github/workflows/ios_runtime_framework.yml
    with:
      source_sha: ${{ github.sha }}
      retention_days: 7

  android_build:
    needs: prepare_version
    uses: ./.github/workflows/android_build.yml
    with:
      source_sha: ${{ github.sha }}
      single_build: true
      retention_days: 7
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
      android_version_code: ${{ needs.prepare_version.outputs.android_version_code }}

  ios_build:
    needs: [prepare_version, ios_libraries_build]
    uses: ./.github/workflows/ios_build.yml
    with:
      source_sha: ${{ github.sha }}
      app_major_version: ${{ needs.prepare_version.outputs.major }}
      app_minor_version: ${{ needs.prepare_version.outputs.minor }}
      app_maintenance_version: ${{ needs.prepare_version.outputs.maintenance }}
      android_version_code: ${{ needs.prepare_version.outputs.android_version_code }}
      apple_build_number: ${{ needs.prepare_version.outputs.apple_build_number }}
      retention_days: 7
  build_linux:
    needs: prepare_version
    uses: ./.github/workflows/desktop_package.yml
    with:
      platform: linux
      architecture: amd64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      retention_days: 7

  build_windows:
    needs: prepare_version
    uses: ./.github/workflows/desktop_package.yml
    with:
      platform: windows
      architecture: amd64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      retention_days: 7

  build_macos_arm:
    needs: prepare_version
    uses: ./.github/workflows/desktop_package.yml
    with:
      platform: macos
      architecture: arm64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      retention_days: 7

  build_macos_intel:
    needs: prepare_version
    uses: ./.github/workflows/desktop_package.yml
    with:
      platform: macos
      architecture: amd64
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      retention_days: 7

  debug_packages:
    needs: prepare_version
    uses: ./.github/workflows/debug_packages.yml
    with:
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.prepare_version.outputs.version_name }}
      major: ${{ needs.prepare_version.outputs.major }}
      minor: ${{ needs.prepare_version.outputs.minor }}
      maintenance: ${{ needs.prepare_version.outputs.maintenance }}
      build_number: ${{ needs.prepare_version.outputs.android_version_code }}
      apple_build_number: ${{ needs.prepare_version.outputs.apple_build_number }}
      retention_days: 7

  build_manifest:
    name: Record selected Build artifacts
    needs: [prepare_version, ios_libraries_build, android_build, ios_build, build_linux, build_windows, build_macos_arm, build_macos_intel, debug_packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create Build artifact inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 .github/scripts/release/version_metadata.py --version-file VERSION --field version_name)"
          android_code="$(python3 .github/scripts/release/version_metadata.py --version-file VERSION --field android_version_code)"
          apple_build_number=$((android_code + GITHUB_RUN_NUMBER))
          source_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          python3 .github/scripts/release/build_manifest.py create \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" --source-sha "$GITHUB_SHA" \
            --source-tree "$source_tree" --version "$version" \
            --android-version-code "$android_code" --apple-build-number "$apple_build_number" \
            --output "$RUNNER_TEMP/build.json"
      - name: Upload Build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-manifest
          path: ${{ runner.temp }}/build.json
          if-no-files-found: error
          retention-days: 7
