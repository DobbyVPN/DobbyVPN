name: Build iOS VPN Libraries

on:
  workflow_call:
    inputs:
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true
      source_sha:
        description: Lowercase full source commit SHA to build.
        type: string
        required: true

jobs:
  build_ios_lib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 26.3 Build version 17C529 "

      - name: Cache iOS VPN library
        id: ios_lib_cache
        uses: actions/cache@v5
        with:
          path: go_module/DobbyVPNRuntime.xcframework
          key: ${{ runner.os }}-xcode-26.3-ios-15.6-vpn-lib-${{ hashFiles('.github/workflows/ios_libs_generate.yml', '.go-version', 'go_module/go.sum', 'go_module/**') }}

      - name: Set up Go
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Download Go modules & dependencies
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        run: |
          go mod download
          go mod tidy

      - name: Install gomobile & init
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          gomobile init

      - name: Fetch gomobile runtime
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        run: |
          go get "golang.org/x/mobile/bind@$(go list -m -f '{{.Version}}' golang.org/x/mobile)"

      - name: Build iOS XCFramework
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        run: |
          ./scripts/build_ios_xcframework.sh

      - name: Upload iOS XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: DobbyVPNRuntime.xcframework
          path: go_module/DobbyVPNRuntime.xcframework
          if-no-files-found: error

  build_ios_app_lib:
    runs-on: macos-15
    env:
      APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
      APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
      APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
      APPLE_BUILD_NUMBER: ${{ github.run_number }}
      APP_SOURCE_SHA: ${{ inputs.source_sha }}
      APP_SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | tr '\n' ' ')" = "Xcode 26.3 Build version 17C529 "

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            kmp_module/**/*.gradle.kts
            kmp_module/gradle/libs.versions.toml
            kmp_module/gradle/wrapper/gradle-wrapper.properties

      - name: Cache Kotlin/Native compiler data
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('kmp_module/gradle/libs.versions.toml', 'kmp_module/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-build-cache-${{ hashFiles('kmp_module/**/*.gradle.kts', 'kmp_module/gradle/libs.versions.toml', 'kmp_module/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-cache-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-xcode-spm-${{ hashFiles('swift_module/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-spm-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project swift_module/iosApp.xcodeproj

      - name: Build KMP iOS framework
        working-directory: kmp_module
        run: |
          set -euo pipefail
          test "$APP_SOURCE_SHA" = "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          VERSION_NAME="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          VERSION_CODE="${APPLE_BUILD_NUMBER}"
          ./gradlew linkReleaseFrameworkIosArm64 --build-cache --parallel \
            -PprojectRepositoryCommit="${APP_SOURCE_SHA}" \
            -PprojectRepositoryCommitLink="https://github.com/${APP_SOURCE_REPOSITORY}/tree/${APP_SOURCE_SHA}" \
            -Pandroid.injected.version.code="${VERSION_CODE}" \
            -Pandroid.injected.version.name="${VERSION_NAME}"

      - name: Upload app.framework
        uses: actions/upload-artifact@v7
        with:
          name: app.framework
          path: kmp_module/app/build/bin/iosArm64/releaseFramework/app.framework
          if-no-files-found: error
