name: Build iOS VPN Libraries

on:
  workflow_call:
    inputs:
      source_sha:
        description: Lowercase full source commit SHA to build.
        type: string
        required: true

env:
  GOTOOLCHAIN: local

jobs:
  build_ios_lib:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          test "$(xcodebuild -version | tee /dev/stderr | tr '\n' ' ')" = "Xcode 26.3 Build version 17C529 "

      - name: Cache iOS VPN library
        id: ios_lib_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go_module/DobbyVPNRuntime.xcframework
          key: ${{ runner.os }}-xcode-26.3-ios-15.6-vpn-lib-${{ hashFiles('.github/workflows/ios_libs_generate.yml', '.go-version', 'go_module/go.sum', 'go_module/**') }}

      - name: Set up Go
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Download Go modules
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        run: go mod download

      - name: Install pinned Go mobile runtime tools
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mobile_version='v0.0.0-20260520154334-0e4426e1883d'
          go install golang.org/x/mobile/cmd/gomobile@"$mobile_version"
          go install golang.org/x/mobile/cmd/gobind@"$mobile_version"
          gopath="$(go env GOPATH)"
          echo "$gopath/bin" >> "$GITHUB_PATH"
          for tool in gomobile gobind; do
            test -x "$gopath/bin/$tool"
            go version -m "$gopath/bin/$tool" | grep -F "$mobile_version" >/dev/null
          done

      - name: Verify pinned Go mobile runtime dependency
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        run: |
          test "$(go list -m -f '{{.Version}}' golang.org/x/mobile)" = 'v0.0.0-20260520154334-0e4426e1883d'
          go mod download golang.org/x/mobile

      - name: Build iOS Go runtime XCFramework
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        run: ./scripts/build_ios_xcframework.sh

      - name: Verify Go bootstrap preserved candidate source
        if: steps.ios_lib_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload iOS runtime XCFramework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DobbyVPNRuntime.xcframework
          path: go_module/DobbyVPNRuntime.xcframework
          if-no-files-found: error
