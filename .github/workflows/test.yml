name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow secret-isolation policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce secretless PR workflow policy
        run: python3 .github/scripts/check_workflow_policy.py

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Run Go test suite
        working-directory: go_module
        run: go test ./...

      - name: Race-check lifecycle and routing
        working-directory: go_module
        run: go test -race ./core ./routing ./tunnel/...

  kotlin:
    name: Kotlin and Android service tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # gomobile currently needs a bootstrap toolchain to build the configured
      # Android Go toolchain from source. Keep this aligned with android_build.
      - name: Set up bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Read Android Go version
        id: android_go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Android Go toolchain
        uses: actions/cache@v4
        with:
          path: .ci-cache/go-android
          key: ${{ runner.os }}-android-go-${{ steps.android_go.outputs.version }}

      - name: Build Go from source for Android
        run: |
          set -euo pipefail
          GO_VERSION="${{ steps.android_go.outputs.version }}"
          GO_SRC="$GITHUB_WORKSPACE/.ci-cache/go-android"

          if [ ! -x "$GO_SRC/bin/go" ]; then
            rm -rf "$GO_SRC"
            git clone --depth 1 --branch "go${GO_VERSION}" https://github.com/golang/go.git "$GO_SRC"
            pushd "$GO_SRC/src"
            ./make.bash
            popd
          fi

          echo "GOROOT=$GO_SRC" >> "$GITHUB_ENV"
          echo "$GO_SRC/bin" >> "$GITHUB_PATH"
          "$GO_SRC/bin/go" env GOROOT GOVERSION

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            kmp_module/**/*.gradle.kts
            kmp_module/gradle/libs.versions.toml
            kmp_module/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-35
            build-tools;36.0.0
            ndk;27.2.12479018

      - name: Install gomobile
        working-directory: go_module
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Run KMP and Android service tests
        working-directory: kmp_module
        run: ./gradlew :grpcstub:test :app:jvmTest :app:testDebugUnitTest --stacktrace

  swift:
    name: Swift lifecycle seam tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run Swift lifecycle seam tests
        run: swift test --package-path swift_module/LifecycleSeamTests
