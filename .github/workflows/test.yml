name: Test

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Active or successful Build run whose exact packages should be qualified.
        type: string
        required: true
      torturer_sha:
        description: Exact private Torturer revision already verified locally.
        type: string
        required: true
      release_attempt_id:
        description: Optional existing release-verification reservation.
        type: string
        required: false

concurrency:
  group: release-verification
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve_build:
    name: Resolve selected Build
    runs-on: ubuntu-24.04
    environment: release-tests
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      major: ${{ steps.resolve.outputs.major }}
      minor: ${{ steps.resolve.outputs.minor }}
      maintenance: ${{ steps.resolve.outputs.maintenance }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
      apple_build_number: ${{ steps.resolve.outputs.apple_build_number }}
      torturer_sha: ${{ steps.identity.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ steps.identity.outputs.torturer_tree_sha256 }}
    steps:
      - name: Validate Test retry identity
        env:
          TORTURER_SHA: ${{ inputs.torturer_sha }}
          RELEASE_ATTEMPT_ID: ${{ inputs.release_attempt_id }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$RELEASE_ATTEMPT_ID" || "$RELEASE_ATTEMPT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out exact private tests
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.torturer_sha }}
          path: torturer
          ssh-key: ${{ secrets.TORTURER_READ_KEY }}
          persist-credentials: false
      - name: Resolve active Build identity
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py identity
      - name: Validate exact tests and existing release stops
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          TORTURER_SHA: ${{ inputs.torturer_sha }}
          RELEASE_ATTEMPT_ID: ${{ inputs.release_attempt_id }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          sha = subprocess.check_output(["git", "-C", "torturer", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["TORTURER_SHA"]:
              raise SystemExit("private test checkout differs from selected revision")
          tree = release_guard.tests_tree_sha256(Path("torturer"))
          release_guard.validate_early_test(
              release_guard.GitHubAPI(), os.environ["GITHUB_REPOSITORY"],
              int(os.environ["GITHUB_RUN_ID"]), int(os.environ["BUILD_RUN_ID"]),
              os.environ["GITHUB_SHA"], sha, tree,
              reservation_id=int(os.environ["RELEASE_ATTEMPT_ID"]) if os.environ["RELEASE_ATTEMPT_ID"] else None)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"torturer_sha={sha}\ntorturer_tree_sha256={tree}\n")
          PYTHON

  ready_linux:
    needs: resolve_build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      packages: ${{ steps.ready.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for linux package producers
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py wait --group linux

  ready_windows:
    needs: resolve_build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      packages: ${{ steps.ready.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for windows package producers
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py wait --group windows

  ready_macos:
    needs: resolve_build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      packages: ${{ steps.ready.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for macos package producers
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py wait --group macos

  ready_android:
    needs: resolve_build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      packages: ${{ steps.ready.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for android package producers
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py wait --group android

  ready_ios:
    needs: resolve_build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      packages: ${{ steps.ready.outputs.packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for ios package producers
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py wait --group ios

  final_build:
    needs: resolve_build
    runs-on: ubuntu-24.04
    environment: release-tests
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      build_manifest: ${{ steps.resolve.outputs.build_manifest }}
      manifest_sha256: ${{ steps.resolve.outputs.manifest_sha256 }}
      release_attempt_id: ${{ steps.claim.outputs.release_attempt_id }}
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.torturer_sha }}
          path: torturer
          ssh-key: ${{ secrets.TORTURER_READ_KEY }}
          persist-credentials: false
      - name: Require successful final Build manifest
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py final
      - name: Claim the exact reserved release verification
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          TORTURER_SHA: ${{ inputs.torturer_sha }}
          RELEASE_ATTEMPT_ID: ${{ inputs.release_attempt_id }}
        run: |
          python3 - "$RUNNER_TEMP/build.json" <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          build = json.load(open(sys.argv[1], encoding="utf-8"))
          if build["source_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Test main revision differs from selected Build")
          tests_sha = subprocess.check_output(["git", "-C", "torturer", "rev-parse", "HEAD"], text=True).strip()
          if tests_sha != os.environ["TORTURER_SHA"]:
              raise SystemExit("private tests checkout does not match requested revision")
          tree = release_guard.tests_tree_sha256(Path("torturer"))
          candidate = {
              "schema": 1, "build_run_id": build["run_id"],
              "build_manifest_sha256": build["manifest_sha256"],
              "product_sha": build["source_sha"], "tests_repository": "DobbyVPN/Torturer",
              "tests_sha": tests_sha, "tests_tree_sha256": tree,
          }
          deployment_id = release_guard.reservation_for_test(
              release_guard.GitHubAPI(), os.environ["GITHUB_REPOSITORY"],
              int(os.environ["GITHUB_RUN_ID"]), candidate,
              reservation_id=int(os.environ["RELEASE_ATTEMPT_ID"]) if os.environ["RELEASE_ATTEMPT_ID"] else None)
          release_guard.claim(release_guard.GitHubAPI(), os.environ["GITHUB_REPOSITORY"],
                              deployment_id, int(os.environ["GITHUB_RUN_ID"]), candidate)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_attempt_id={deployment_id}\ntorturer_sha={tests_sha}\ntorturer_tree_sha256={tree}\nclaimed=true\n")
          PY

  source_linux:
    needs: resolve_build
    uses: ./.github/workflows/source_tests.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04
      checks: go-tests go-native-runtime python-tests
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_linux_arm:
    needs: resolve_build
    uses: ./.github/workflows/source_tests.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      checks: go-native-runtime
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_windows:
    needs: resolve_build
    uses: ./.github/workflows/source_tests.yml
    secrets: inherit
    with:
      runner: windows-2022
      checks: go-native-runtime windows-mutations
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_android:
    needs: resolve_build
    uses: ./.github/workflows/source_tests.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04
      checks: android-unit android-mutations
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_macos:
    needs: resolve_build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    uses: ./.github/workflows/source_tests.yml
    secrets: inherit
    with:
      runner: ${{ matrix.runner }}
      checks: go-native-runtime swift-unit swift-mutations
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  ios_simulator:
    needs: resolve_build
    uses: ./.github/workflows/ios_simulator_test.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  ios_analysis:
    needs: [resolve_build, ready_ios]
    uses: ./.github/workflows/ios_analysis.yml
    with:
      build_packages: ${{ needs.ready_ios.outputs.packages }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}

  android_reproducibility:
    needs: [resolve_build, ready_android]
    uses: ./.github/workflows/android_build.yml
    with:
      build_packages: ${{ needs.ready_android.outputs.packages }}
      single_build: true
      reference_build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      app_major_version: ${{ needs.resolve_build.outputs.major }}
      app_minor_version: ${{ needs.resolve_build.outputs.minor }}
      app_maintenance_version: ${{ needs.resolve_build.outputs.maintenance }}
      android_version_code: ${{ needs.resolve_build.outputs.android_version_code }}
      retention_days: 7

  fdroid_preflight:
    needs: [resolve_build, ready_android]
    uses: ./.github/workflows/fdroid_preflight.yml
    with:
      build_packages: ${{ needs.ready_android.outputs.packages }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      version_code: ${{ needs.resolve_build.outputs.android_version_code }}
      build_run_id: ${{ inputs.build_run_id }}
      retention_days: 7

  migrate_windows:
    needs: [resolve_build, ready_windows]
    uses: ./.github/workflows/installer_migration.yml
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_windows.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: windows
      architecture: amd64
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      build_run_id: ${{ inputs.build_run_id }}

  migrate_macos_arm:
    needs: [resolve_build, ready_macos]
    uses: ./.github/workflows/installer_migration.yml
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_macos.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: macos
      architecture: arm64
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      build_run_id: ${{ inputs.build_run_id }}

  migrate_macos_intel:
    needs: [resolve_build, ready_macos]
    uses: ./.github/workflows/installer_migration.yml
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_macos.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: macos
      architecture: amd64
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      build_run_id: ${{ inputs.build_run_id }}

  render_start_linux:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_linux.result == 'success' }}
    needs: [resolve_build, ready_linux]
    uses: ./.github/workflows/render_start.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: linux
      retention_days: 7

  render_start_windows:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_windows.result == 'success' }}
    needs: [resolve_build, ready_windows]
    uses: ./.github/workflows/render_start.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: windows
      retention_days: 7

  render_start_macos:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_macos.result == 'success' }}
    needs: [resolve_build, ready_macos]
    uses: ./.github/workflows/render_start.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: macos
      retention_days: 7

  render_start_android:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_android.result == 'success' }}
    needs: [resolve_build, ready_android]
    uses: ./.github/workflows/render_start.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: android
      retention_days: 7

  render_start:
    name: Aggregate Render fixture startup
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, render_start_linux, render_start_windows, render_start_macos, render_start_android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform fixture
        env:
          LINUX: ${{ needs.render_start_linux.result }}
          WINDOWS: ${{ needs.render_start_windows.result }}
          MACOS: ${{ needs.render_start_macos.result }}
          ANDROID: ${{ needs.render_start_android.result }}
        run: |
          test "$LINUX" = success
          test "$WINDOWS" = success
          test "$MACOS" = success
          test "$ANDROID" = success

  qualify_linux:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_linux.result == 'success' && needs.render_start_linux.result == 'success' }}
    needs: [resolve_build, ready_linux, render_start_linux]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_linux.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: linux
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}-linux

  qualify_windows:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_windows.result == 'success' && needs.render_start_windows.result == 'success' }}
    needs: [resolve_build, ready_windows, render_start_windows]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_windows.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: windows
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}-windows

  qualify_macos:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_macos.result == 'success' && needs.render_start_macos.result == 'success' }}
    needs: [resolve_build, ready_macos, render_start_macos]
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, amd64]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_macos.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: macos
      architecture: ${{ matrix.architecture }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}-macos

  android_test_inputs:
    needs: [resolve_build, ready_android]
    uses: ./.github/workflows/android_test_inputs.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_android.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}

  qualify_android:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.ready_android.result == 'success' && needs.render_start_android.result == 'success' && needs.android_test_inputs.result == 'success' }}
    needs: [resolve_build, ready_android, render_start_android, android_test_inputs]
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      build_packages: ${{ needs.ready_android.outputs.packages }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: android
      android_companion_manifest_sha256: ${{ needs.android_test_inputs.outputs.manifest_sha256 }}
      android_companion_producer_attempt: ${{ needs.android_test_inputs.outputs.producer_attempt }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      render_artifact_name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}-android

  render_cleanup_linux:
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, render_start_linux, qualify_linux]
    uses: ./.github/workflows/render_cleanup.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: linux

  render_cleanup_windows:
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, render_start_windows, qualify_windows]
    uses: ./.github/workflows/render_cleanup.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: windows

  render_cleanup_macos:
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, render_start_macos, qualify_macos]
    uses: ./.github/workflows/render_cleanup.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: macos

  render_cleanup_android:
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, render_start_android, qualify_android]
    uses: ./.github/workflows/render_cleanup.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: android

  render_cleanup:
    name: Aggregate Render fixture cleanup
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, render_cleanup_linux, render_cleanup_windows, render_cleanup_macos, render_cleanup_android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform cleanup
        env:
          LINUX: ${{ needs.render_cleanup_linux.result }}
          WINDOWS: ${{ needs.render_cleanup_windows.result }}
          MACOS: ${{ needs.render_cleanup_macos.result }}
          ANDROID: ${{ needs.render_cleanup_android.result }}
        run: |
          test "$LINUX" = success
          test "$WINDOWS" = success
          test "$MACOS" = success
          test "$ANDROID" = success

  qualification_result:
    name: Record final verification and release stop
    if: ${{ always() }}
    needs: [resolve_build, final_build, ready_linux, ready_windows, ready_macos, ready_android, ready_ios, source_linux, source_linux_arm, source_windows, source_macos, source_android, ios_simulator, render_start, qualify_linux, qualify_windows, qualify_macos, qualify_android, render_cleanup, ios_analysis, android_reproducibility, migrate_windows, migrate_macos_arm, migrate_macos_intel, fdroid_preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_ATTEMPT_ID: ${{ needs.final_build.outputs.release_attempt_id }}
      BUILD_JSON: ${{ needs.final_build.outputs.build_manifest }}
      TORTURER_SHA: ${{ needs.resolve_build.outputs.torturer_sha }}
      TORTURER_TREE_SHA256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download selected Android package for pairing verification
        if: needs.resolve_build.result == 'success'
        run: |
          python3 .github/scripts/release/download_artifact.py "$BUILD_RUN_ID" dobbyvpn-android-unsign.apk "$RUNNER_TEMP/selected-android"
      - name: Record and validate complete Test result
        id: result
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ANDROID_PAIRING: ${{ needs.qualify_android.outputs.android_pairing }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import test_manifest, package_readiness, build_manifest
          result_path = Path(os.environ["RUNNER_TEMP"]) / "test-result.json"
          needs = json.loads(os.environ["NEEDS_JSON"])
          build = json.loads(os.environ["BUILD_JSON"] or "{}")
          if any(needs[name]["result"] != "success" for name in ("final_build", *["ready_" + group for group in package_readiness.PACKAGES])):
              raise SystemExit("Build completion or package readiness failed")
          selections = {group: json.loads(needs["ready_" + group]["outputs"].get("packages") or "{}")
                        for group in package_readiness.PACKAGES}
          inventory = build_manifest._artifact_inventory(os.environ["GITHUB_REPOSITORY"], int(os.environ["BUILD_RUN_ID"]), build.get("run_attempt", 1), tuple(name for group in package_readiness.PACKAGES.values() for name in group))
          jobs_by_attempt = {attempt: package_readiness._pages(os.environ["GITHUB_REPOSITORY"],
                              f"actions/runs/{build['run_id']}/attempts/{attempt}/jobs", "jobs")
                             for attempt in range(1, build.get("run_attempt", 1) + 1)}
          package_readiness.reconcile(build, selections, inventory, jobs_by_attempt=jobs_by_attempt)
          pairing = json.loads(os.environ["ANDROID_PAIRING"] or "{}")
          pairing.update(build_run_id=int(os.environ["BUILD_RUN_ID"]),
                         build_manifest_sha256=build.get("manifest_sha256", ""))
          result = {
              "schema": 2, "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_path": ".github/workflows/test.yml",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "build_run_id": int(os.environ["BUILD_RUN_ID"]),
              "source_sha": build.get("source_sha", ""),
              "build_manifest_sha256": build.get("manifest_sha256", ""),
              "torturer_repository": "DobbyVPN/Torturer",
              "torturer_sha": os.environ["TORTURER_SHA"],
              "torturer_tree_sha256": os.environ["TORTURER_TREE_SHA256"],
              "release_attempt_id": int(os.environ["RELEASE_ATTEMPT_ID"]),
              "android_pairing": pairing,
              "checks": {name: needs[name].get("result") for name in test_manifest.REQUIRED_CHECKS},
          }
          result_path.write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n")
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Only main Test runs can qualify")
          test_manifest.validate_result(result, repository=os.environ["GITHUB_REPOSITORY"],
                                        run_id=result["run_id"], build=build, source_sha=os.environ["GITHUB_SHA"])
          apk = Path(os.environ["RUNNER_TEMP"]) / "selected-android" / f"DobbyVPN-v{build['version']}-unsign.apk"
          test_manifest.validate_android_pairing(result, hashlib.sha256(apk.read_bytes()).hexdigest())
          PYTHON
      - name: Upload Test result
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-result-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Finalize durable release verification
        if: always()
        env:
          QUALIFICATION_VALID: ${{ steps.result.outcome == 'success' && steps.upload.outcome == 'success' && job.status == 'success' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard, test_manifest
          api = release_guard.GitHubAPI()
          deployment = release_guard._test_reservation(api, os.environ["GITHUB_REPOSITORY"], int(os.environ["GITHUB_RUN_ID"]))
          if deployment is None:
              raise SystemExit("No claimed Test reservation; qualification remains stopped")
          candidate = deployment["_candidate"]
          valid = os.environ["QUALIFICATION_VALID"] == "true"
          identity = test_manifest.guard_candidate(json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-result.json").read_text())) if valid else None
          if identity is not None:
              identity.update(test_run_id=int(os.environ["GITHUB_RUN_ID"]),
                              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]))
          release_guard.finalize(api, os.environ["GITHUB_REPOSITORY"],
              deployment["id"], int(os.environ["GITHUB_RUN_ID"]), candidate,
              outcome="success" if valid else "failure", result_identity=identity)
          if not valid:
              raise SystemExit("Final release verification failed. Release is stopped; diagnose before retrying.")
          PYTHON
