name: Test

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run whose public packages should be verified.
        type: string
        required: true
      torturer_sha:
        description: Exact reviewed private Torturer commit (40 lowercase hexadecimal characters).
        type: string
        required: true
      release_attempt_id:
        description: Existing public Build-verification reservation.
        type: string
        required: true

concurrency:
  group: release-verification
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve_build:
    name: Resolve selected Build
    runs-on: ubuntu-24.04
    environment: release-tests
    permissions:
      contents: read
      actions: read
      deployments: write
    outputs:
      torturer_sha: ${{ steps.identity.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ steps.identity.outputs.torturer_tree_sha256 }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version_name: ${{ steps.resolve.outputs.version_name }}
      major: ${{ steps.resolve.outputs.major }}
      minor: ${{ steps.resolve.outputs.minor }}
      maintenance: ${{ steps.resolve.outputs.maintenance }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
      build_manifest: ${{ steps.resolve.outputs.build_manifest }}
      packages: ${{ steps.resolve.outputs.packages }}
      release_attempt_id: ${{ steps.claim.outputs.release_attempt_id }}
    steps:
      - name: Require the release coordinator on main
        env:
          QUALIFICATION_COORDINATOR_ID: ${{ vars.QUALIFICATION_COORDINATOR_ID }}
          RELEASE_ATTEMPT_ID: ${{ inputs.release_attempt_id }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TORTURER_SHA: ${{ inputs.torturer_sha }}
        run: |
          set -euo pipefail
          [[ "$TORTURER_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          [[ "$QUALIFICATION_COORDINATOR_ID" =~ ^[1-9][0-9]*$ ]]
          test "$QUALIFICATION_COORDINATOR_ID" = "$GITHUB_ACTOR_ID"
          [[ "$RELEASE_ATTEMPT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out exact private tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.torturer_sha }}
          path: torturer
          ssh-key: ${{ secrets.TORTURER_READ_KEY }}
          persist-credentials: false
      - name: Bind exact private test identity
        id: identity
        env:
          TORTURER_SHA: ${{ inputs.torturer_sha }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          sha = subprocess.check_output(["git", "-C", "torturer", "rev-parse", "HEAD"], text=True).strip()
          if sha != os.environ["TORTURER_SHA"]:
              raise SystemExit("private tests differ from selected revision")
          tree = release_guard.tests_tree_sha256(Path("torturer"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"torturer_sha={sha}\ntorturer_tree_sha256={tree}\n")
          PYTHON
      - name: Pin packages from the completed Build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 .github/scripts/release/package_readiness.py
      - name: Claim the exact reserved release verification
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ATTEMPT_ID: ${{ inputs.release_attempt_id }}
        run: |
          python3 - "$RUNNER_TEMP/build.json" <<'PY'
          import json, os, sys
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          build = json.load(open(sys.argv[1], encoding="utf-8"))
          if build["source_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("Test main revision differs from selected Build")
          candidate = {
              "schema": release_guard.PUBLIC_SCHEMA, "build_run_id": build["run_id"],
              "build_manifest_sha256": build["manifest_sha256"],
              "product_sha": build["source_sha"],
          }
          deployment_id = release_guard.reservation_for_test(
              release_guard.GitHubAPI(), os.environ["GITHUB_REPOSITORY"],
              int(os.environ["GITHUB_RUN_ID"]), candidate,
              reservation_id=int(os.environ["RELEASE_ATTEMPT_ID"]) if os.environ["RELEASE_ATTEMPT_ID"] else None)
          release_guard.claim(release_guard.GitHubAPI(), os.environ["GITHUB_REPOSITORY"],
                              deployment_id, int(os.environ["GITHUB_RUN_ID"]), candidate)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_attempt_id={deployment_id}\n")
          PY

  ios_analysis:
    needs: resolve_build
    uses: ./.github/workflows/ios_analysis.yml
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).ios) }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}

  android_reproducibility:
    needs: resolve_build
    uses: ./.github/workflows/android_build.yml
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).android) }}
      reference_build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      app_major_version: ${{ needs.resolve_build.outputs.major }}
      app_minor_version: ${{ needs.resolve_build.outputs.minor }}
      app_maintenance_version: ${{ needs.resolve_build.outputs.maintenance }}
      android_version_code: ${{ needs.resolve_build.outputs.android_version_code }}
      retention_days: 7

  fdroid_preflight:
    needs: resolve_build
    uses: ./.github/workflows/fdroid_preflight.yml
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).android) }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      version_code: ${{ needs.resolve_build.outputs.android_version_code }}
      build_run_id: ${{ inputs.build_run_id }}
      retention_days: 7

  dependency_scan:
    uses: ./.github/workflows/dependency_scan.yml
    permissions:
      contents: read

  source_linux:
    needs: resolve_build
    secrets: inherit
    uses: ./.github/workflows/source_tests.yml
    with:
      runner: ubuntu-24.04
      checks: go-tests go-native-runtime python-tests
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_linux_arm:
    needs: resolve_build
    secrets: inherit
    uses: ./.github/workflows/source_tests.yml
    with:
      runner: ubuntu-24.04-arm
      checks: go-native-runtime
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_windows:
    needs: resolve_build
    secrets: inherit
    uses: ./.github/workflows/source_tests.yml
    with:
      runner: windows-2022
      checks: go-native-runtime windows-mutations
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_android:
    needs: resolve_build
    secrets: inherit
    uses: ./.github/workflows/source_tests.yml
    with:
      runner: ubuntu-24.04
      checks: android-unit android-mutations android-lint
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  source_macos:
    needs: resolve_build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    secrets: inherit
    uses: ./.github/workflows/source_tests.yml
    with:
      runner: ${{ matrix.runner }}
      checks: go-native-runtime swift-unit swift-mutations
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  ios_simulator:
    needs: resolve_build
    secrets: inherit
    uses: ./.github/workflows/ios_simulator_test.yml
    with:
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}

  migrate_windows:
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/installer_migration.yml
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).windows) }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: windows
      architecture: amd64
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      build_run_id: ${{ inputs.build_run_id }}

  migrate_macos_arm:
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/installer_migration.yml
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).macos) }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: macos
      architecture: arm64
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      build_run_id: ${{ inputs.build_run_id }}

  migrate_macos_intel:
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/installer_migration.yml
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).macos) }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: macos
      architecture: amd64
      version_name: ${{ needs.resolve_build.outputs.version_name }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      build_run_id: ${{ inputs.build_run_id }}

  fixture_host_linux:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/fixture_host.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: linux
      freshness_jobs: '["Resolve selected Build"]'
      consumer_names: '["qualify_linux / Hosted mini / linux / default"]'
      retention_days: 7

  fixture_host_windows:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/fixture_host.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: windows
      freshness_jobs: '["Resolve selected Build"]'
      consumer_names: '["qualify_windows / Hosted mini / windows / default"]'
      retention_days: 7

  fixture_host_android:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.android_test_inputs.result == 'success' }}
    needs: [resolve_build, android_test_inputs]
    secrets: inherit
    uses: ./.github/workflows/fixture_host.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      fixture_key: android
      freshness_jobs: '["Resolve selected Build", "android_test_inputs / Compile reusable Android test companion"]'
      consumer_names: '["qualify_android / Hosted mini / android / default"]'
      retention_days: 7

  fixture_hosts:
    name: Require all fixture hosts and cleanup
    if: ${{ always() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build, fixture_host_linux, fixture_host_windows, fixture_host_android]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform fixture
        env:
          LINUX: ${{ needs.fixture_host_linux.result }}
          WINDOWS: ${{ needs.fixture_host_windows.result }}
          ANDROID: ${{ needs.fixture_host_android.result }}
        run: |
          test "$LINUX" = success
          test "$WINDOWS" = success
          test "$ANDROID" = success

  qualify_linux:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).linux) }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: linux
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      fixture_artifact_name: vpn-fixtures-${{ github.run_id }}-linux-attempt-${{ github.run_attempt }}
      fixture_host_name: fixture_host_linux / Serve fixtures / linux

  qualify_windows:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' }}
    needs: [resolve_build]
    secrets: inherit
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).windows) }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: windows
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      fixture_artifact_name: vpn-fixtures-${{ github.run_id }}-windows-attempt-${{ github.run_attempt }}
      fixture_host_name: fixture_host_windows / Serve fixtures / windows

  android_test_inputs:
    needs: resolve_build
    secrets: inherit
    uses: ./.github/workflows/android_test_inputs.yml
    permissions:
      contents: read
      actions: read
    with:
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}

  qualify_android:
    if: ${{ always() && !cancelled() && needs.resolve_build.result == 'success' && needs.android_test_inputs.result == 'success' }}
    needs: [resolve_build, android_test_inputs]
    secrets: inherit
    uses: ./.github/workflows/qualification_platform.yml
    permissions:
      contents: read
      actions: read
    with:
      build_packages: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).android) }}
      torturer_sha: ${{ needs.resolve_build.outputs.torturer_sha }}
      torturer_tree_sha256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
      platform: android
      android_companion_manifest_sha256: ${{ needs.android_test_inputs.outputs.manifest_sha256 }}
      android_companion_producer_attempt: ${{ needs.android_test_inputs.outputs.producer_attempt }}
      build_run_id: ${{ inputs.build_run_id }}
      source_sha: ${{ needs.resolve_build.outputs.source_sha }}
      retention_days: 7
      fixture_artifact_name: vpn-fixtures-${{ github.run_id }}-android-attempt-${{ github.run_attempt }}
      fixture_host_name: fixture_host_android / Serve fixtures / android

  qualification_result:
    name: Record final verification and release stop
    if: ${{ always() }}
    needs: [resolve_build, source_linux, source_linux_arm, source_windows, source_android, source_macos, ios_simulator, migrate_windows, migrate_macos_arm, migrate_macos_intel, fixture_hosts, qualify_linux, qualify_windows, qualify_android, android_test_inputs, ios_analysis, android_reproducibility, fdroid_preflight, dependency_scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_ATTEMPT_ID: ${{ needs.resolve_build.outputs.release_attempt_id }}
      BUILD_JSON: ${{ needs.resolve_build.outputs.build_manifest }}
      TORTURER_SHA: ${{ needs.resolve_build.outputs.torturer_sha }}
      TORTURER_TREE_SHA256: ${{ needs.resolve_build.outputs.torturer_tree_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download selected Android package for pairing verification
        if: needs.resolve_build.result == 'success'
        env:
          DOBBY_BUILD_PACKAGES: ${{ toJSON(fromJSON(needs.resolve_build.outputs.packages).android) }}
        run: |
          python3 .github/scripts/release/download_artifact.py "$BUILD_RUN_ID" dobbyvpn-android-unsign.apk "$RUNNER_TEMP/selected-android"
      - name: Record and validate complete Test result
        id: result
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ANDROID_PAIRING: ${{ needs.qualify_android.outputs.android_pairing }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import test_manifest, package_readiness
          result_path = Path(os.environ["RUNNER_TEMP"]) / "test-result.json"
          needs = json.loads(os.environ["NEEDS_JSON"])
          build = json.loads(os.environ["BUILD_JSON"] or "{}")
          if needs["resolve_build"]["result"] != "success":
              raise SystemExit("Build package selection or reservation failed")
          if needs["dependency_scan"]["result"] != "success":
              raise SystemExit("Fresh candidate dependency scan failed")
          selections = json.loads(needs["resolve_build"]["outputs"]["packages"])
          confirmed, current = package_readiness.package_snapshot(
              os.environ["GITHUB_REPOSITORY"], int(os.environ["BUILD_RUN_ID"]),
              Path(os.environ["RUNNER_TEMP"]) / "confirmed-build-manifest")
          if confirmed["manifest_sha256"] != build["manifest_sha256"]:
              raise SystemExit("Build manifest changed during verification; a new reservation is required")
          package_readiness.reconcile(selections, current)
          apk = Path(os.environ["RUNNER_TEMP"]) / "selected-android" / f"DobbyVPN-v{build['version']}-unsign.apk"
          with apk.open("rb") as source:
              apk_sha = hashlib.file_digest(source, "sha256").hexdigest()
          pairing = json.loads(os.environ["ANDROID_PAIRING"] or "{}")
          pairing.update(build_run_id=build["run_id"], build_manifest_sha256=build["manifest_sha256"])
          result = {
              "schema": 5,
              "torturer_repository": "DobbyVPN/Torturer",
              "torturer_sha": os.environ["TORTURER_SHA"],
              "torturer_tree_sha256": os.environ["TORTURER_TREE_SHA256"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_path": ".github/workflows/test.yml",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "build_run_id": int(os.environ["BUILD_RUN_ID"]),
              "source_sha": build.get("source_sha", ""),
              "build_manifest_sha256": build.get("manifest_sha256", ""),
              "release_attempt_id": int(os.environ["RELEASE_ATTEMPT_ID"]),
              "android_pairing": pairing,
              "checks": {name: needs[name]["result"] for name in test_manifest.HOSTED_CHECKS},
          }
          result_path.write_text(json.dumps(result, sort_keys=True, separators=(",", ":")) + "\n")
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Only main Test runs can qualify")
          test_manifest.validate_result(result, repository=os.environ["GITHUB_REPOSITORY"],
                                        run_id=result["run_id"], build=build, source_sha=os.environ["GITHUB_SHA"])
          test_manifest.validate_android_pairing(result, apk_sha)
          PYTHON
      - name: Upload Test result
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-result-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Finalize durable release verification
        if: always()
        env:
          QUALIFICATION_VALID: ${{ steps.result.outcome == 'success' && steps.upload.outcome == 'success' && job.status == 'success' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard, test_manifest
          api = release_guard.GitHubAPI()
          deployment = release_guard._test_reservation(api, os.environ["GITHUB_REPOSITORY"], int(os.environ["GITHUB_RUN_ID"]))
          if deployment is None:
              raise SystemExit("No claimed Test reservation; qualification remains stopped")
          candidate = deployment["_candidate"]
          valid = os.environ["QUALIFICATION_VALID"] == "true"
          identity = test_manifest.guard_candidate(json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-result.json").read_text())) if valid else None
          if identity is not None:
              identity.update(test_run_id=int(os.environ["GITHUB_RUN_ID"]),
                              run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]))
          release_guard.finalize(api, os.environ["GITHUB_REPOSITORY"],
              deployment["id"], int(os.environ["GITHUB_RUN_ID"]), candidate,
              outcome="success" if valid else "failure", result_identity=identity)
          if not valid:
              raise SystemExit("Final release verification failed. Release is stopped; diagnose before retrying.")
          PYTHON
