name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-tooling:
    name: Functional test tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check the integrated functional suite
        working-directory: torturer
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  windows-containment:
    name: Windows process containment
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check native Windows Job Objects
        shell: pwsh
        env:
          PYTHONPATH: torturer
        run: python -m unittest discover -s torturer/tests -p test_windows_job_integration.py -v

  python-tooling:
    name: Python tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run Python tooling tests
        run: |
          python3 -m venv "$RUNNER_TEMP/python-test-venv"
          "$RUNNER_TEMP/python-test-venv/bin/pip" install --disable-pip-version-check --no-input "pytest==9.0.2" "PyYAML==6.0.3"
          "$RUNNER_TEMP/python-test-venv/bin/python" -m pytest -q .github/scripts

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Stage pinned Linux native dependencies for Go tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxxf86vm-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev
          python3 .github/scripts/desktop_build.py prepare-go-test-deps --go-mod-tidy
          test -f go_module/libdobby_bridge.so
          test -f go_module/libc++.so.1
          test -f go_module/libc++abi.so.1

      - name: Run Go test suite
        working-directory: go_module
        run: |
          # Fyne's ci driver is software-backed, so the shared UI and its
          # transport client are tested without opening a host window.
          mkdir -p "$RUNNER_TEMP/dobbyvpn-go-coverage"
          go test -tags=ci -covermode=atomic -coverpkg=./... \
            -coverprofile="$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.out" ./...
          go tool cover -func="$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.out" \
            | tee "$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.txt"

      - name: Race-check lifecycle and routing
        working-directory: go_module
        run: |
          go test -race ./routing/... ./sessionapi/... ./tunnel/...

      - name: Upload unified Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: ${{ runner.temp }}/dobbyvpn-go-coverage
          if-no-files-found: warn

  android:
    name: Android native shell and Go/Fyne tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Verify pinned Go installation
        run: |
          set -euo pipefail
          expected="go$(tr -d '[:space:]' < .go-version)"
          test "$(go env GOVERSION)" = "$expected"
          go_root="$(go env GOROOT)"
          test "$(readlink -f "$(command -v go)")" = "$(readlink -f "$go_root/bin/go")"
          echo "GOROOT=$go_root" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android_module/**/*.gradle.kts
            android_module/gradle/wrapper/gradle-wrapper.properties
            go_module/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >
            platforms;android-35
            build-tools;36.0.0
            ndk;27.3.13750724

      - name: Download Go modules for the native Go/Fyne library
        working-directory: go_module
        run: go mod download

      - name: Run Android shell tests and build both Go ABIs
        working-directory: android_module
        run: ./gradlew :app:testReleaseUnitTest :app:assembleReleaseAndroidTest :app:assembleRelease --stacktrace

  ios_libraries:
    name: iOS native dependencies
    uses: ./.github/workflows/ios_libs_generate.yml
    with:
      source_sha: ${{ github.sha }}

  ios:
    name: iOS unsigned build
    needs: ios_libraries
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Download Go modules
        working-directory: go_module
        run: go mod download

      - name: Download iOS native dependencies
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: DobbyVPNRuntime.xcframework
          path: swift_module/DobbyVPNRuntime.xcframework
          merge-multiple: true

      - name: Build Go/Fyne iOS app without signing
        run: |
          ./go_module/scripts/package_ios_app.sh \
            iossimulator "$RUNNER_TEMP/Dobby-Vpn.app" \
            swift_module/DobbyVPNRuntime.xcframework arm64

  swift:
    name: iOS production lifecycle policy tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run and ratchet production-source iOS lifecycle policy coverage
        run: |
          set -euo pipefail
          swift test --enable-code-coverage --package-path swift_module
          BUILD_PATH="$(swift build --show-bin-path --package-path swift_module)"
          COVERAGE_PROFILE="$(find "$BUILD_PATH" -type f -path '*/codecov/default.profdata' -print -quit)"
          TEST_EXECUTABLE="$(find "$BUILD_PATH" -type f -path '*.xctest/Contents/MacOS/*PackageTests' -perm -111 -print -quit)"
          test -f "$COVERAGE_PROFILE"
          test -x "$TEST_EXECUTABLE"

          COVERAGE_LCOV="$RUNNER_TEMP/swift-lifecycle-core.lcov"
          COVERAGE_SUMMARY="$RUNNER_TEMP/swift-lifecycle-core-coverage.md"
          xcrun llvm-cov export \
            "$TEST_EXECUTABLE" \
            -instr-profile="$COVERAGE_PROFILE" \
            -format=lcov > "$COVERAGE_LCOV"
          python3 .github/scripts/check_swift_coverage.py \
            --lcov "$COVERAGE_LCOV" \
            --source-root "$GITHUB_WORKSPACE/swift_module/CommonDI" \
            --summary "$COVERAGE_SUMMARY"
          cat "$COVERAGE_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Swift lifecycle-core coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: swift-lifecycle-core-coverage
          path: |
            ${{ runner.temp }}/swift-lifecycle-core.lcov
            ${{ runner.temp }}/swift-lifecycle-core-coverage.md
          if-no-files-found: error

  ios_simulator_metal:
    name: iOS Simulator Go/Fyne app startup check
    needs: ios_libraries
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Download iOS native dependencies
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: DobbyVPNRuntime.xcframework
          path: swift_module/DobbyVPNRuntime.xcframework
          merge-multiple: true

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Install pinned Go mobile runtime tools
        run: |
          set -euo pipefail
          mobile_version='v0.0.0-20260520154334-0e4426e1883d'
          go install golang.org/x/mobile/cmd/gomobile@"$mobile_version"
          go install golang.org/x/mobile/cmd/gobind@"$mobile_version"
          gopath="$(go env GOPATH)"
          echo "$gopath/bin" >> "$GITHUB_PATH"
          for tool in gomobile gobind; do
            test -x "$gopath/bin/$tool"
            go version -m "$gopath/bin/$tool" | grep -F "$mobile_version" >/dev/null
          done

      - name: Download Go modules
        working-directory: go_module
        run: go mod download

      - name: Build and launch the Go/Fyne app on Simulator
        env:
          PYTHONPATH: torturer
        run: |
          set -euo pipefail
          python3 torturer/tests/ios_simulator/run_app_contract.py \
            --candidate-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/ios-simulator-metal-contract"

      - name: Upload Simulator launch diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-simulator-go-ui-diagnostics
          path: ${{ runner.temp }}/ios-simulator-metal-contract/diagnostics
          if-no-files-found: ignore
