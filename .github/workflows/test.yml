name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Stage pinned Linux native dependencies for Go tests
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_build.py prepare-go-test-deps --go-mod-tidy
          test -f go_module/libdobby_bridge.so
          test -f go_module/libc++.so.1
          test -f go_module/libc++abi.so.1

      - name: Run Go test suite
        working-directory: go_module
        run: |
          # The Go backend protocol and session behavior are exercised in package tests.
          mkdir -p "$RUNNER_TEMP/dobbyvpn-go-coverage"
          go test -v -tags=ci -covermode=atomic -coverpkg=./... \
            -coverprofile="$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.out" ./...
          go tool cover -func="$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.out" \
            | tee "$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.txt"
          {
            echo '## Unified Go coverage'
            echo '```text'
            cat "$RUNNER_TEMP/dobbyvpn-go-coverage/coverage.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Race-check session lifecycle and routing
        working-directory: go_module
        run: |
          go test -v -race ./routing/... ./sessionapi/... ./tunnel/...

      - name: Retain complete Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-go-coverage
          path: ${{ runner.temp }}/dobbyvpn-go-coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  hosted_adapters:
    name: Hosted adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test hosted Linux process checks
        env:
          PYTHONPATH: ${{ github.workspace }}/torturer
        run: python3 -m unittest discover -s torturer/tests -p 'test_*.py' -v

  android:
    name: Android native Compose UI and Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify pinned Go installation
        run: |
          set -euo pipefail
          expected="go$(tr -d '[:space:]' < .go-version)"
          test "$(go env GOVERSION)" = "$expected"
          go_root="$(go env GOROOT)"
          test "$(readlink -f "$(command -v go)")" = "$(readlink -f "$go_root/bin/go")"
          echo "GOROOT=$go_root" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_dobbyGoBinary=$go_root/bin/go" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >
            platforms;android-35
            build-tools;36.0.0
            ndk;28.1.13356709

      - name: Download Go modules for the Android backend
        working-directory: go_module
        run: go mod download

      - name: Run Android shell tests and build both Go ABIs
        working-directory: android_module
        run: ./gradlew :app:testReleaseUnitTest :app:assembleReleaseAndroidTest :app:assembleRelease --info --stacktrace

      - name: Verify Android ABI bridge symbols and runtime dependencies
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_verify_android_native_payloads.py' -v
          ndk="$ANDROID_HOME/ndk/28.1.13356709"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 .github/scripts/verify_android_native_payloads.py \
            --apk android_module/app/build/outputs/apk/release/app-release-unsigned.apk \
            --readelf "$toolchain/llvm-readelf"

  android_arm64_go:
    name: Native ARM64 Go runtime tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify native ARM64 runner and pinned Go
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          expected="go$(tr -d '[:space:]' < .go-version)"
          test "$(go env GOVERSION)" = "$expected"

      - name: Run Go runtime tests on ARM64
        working-directory: go_module
        run: go test -v -race ./probe ./sessionapi/runtime ./tunnel/protected_dialer

  swift:
    name: iOS production lifecycle policy tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run and ratchet production-source iOS lifecycle policy coverage
        run: |
          set -euo pipefail
          swift test -v --enable-code-coverage --package-path swift_module
          BUILD_PATH="$(swift build --show-bin-path --package-path swift_module)"
          COVERAGE_PROFILES=()
          while IFS= read -r path; do COVERAGE_PROFILES+=("$path"); done < <(
            find "$BUILD_PATH" -type f -path '*/codecov/default.profdata' -print
          )
          TEST_EXECUTABLES=()
          while IFS= read -r path; do TEST_EXECUTABLES+=("$path"); done < <(
            find "$BUILD_PATH" -type f -path '*.xctest/Contents/MacOS/*PackageTests' -perm -111 -print
          )
          printf '%s\n' "${COVERAGE_PROFILES[@]}" >&2
          printf '%s\n' "${TEST_EXECUTABLES[@]}" >&2
          test "${#COVERAGE_PROFILES[@]}" -eq 1
          test "${#TEST_EXECUTABLES[@]}" -eq 1
          COVERAGE_PROFILE="${COVERAGE_PROFILES[0]}"
          TEST_EXECUTABLE="${TEST_EXECUTABLES[0]}"
          test -f "$COVERAGE_PROFILE"
          test -x "$TEST_EXECUTABLE"

          COVERAGE_DIR="$RUNNER_TEMP/dobbyvpn-swift-coverage"
          mkdir -p "$COVERAGE_DIR"
          COVERAGE_LCOV="$COVERAGE_DIR/swift-lifecycle-core.lcov"
          COVERAGE_SUMMARY="$COVERAGE_DIR/swift-lifecycle-core-coverage.md"
          cp "$COVERAGE_PROFILE" "$COVERAGE_DIR/swift-lifecycle-core.profdata"
          xcrun llvm-cov export \
            "$TEST_EXECUTABLE" \
            -instr-profile="$COVERAGE_PROFILE" \
            -format=lcov > "$COVERAGE_LCOV"
          python3 .github/scripts/check_swift_coverage.py \
            --lcov "$COVERAGE_LCOV" \
            --source-root "$GITHUB_WORKSPACE/swift_module/CommonDI" \
            --summary "$COVERAGE_SUMMARY"
          cat "$COVERAGE_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain complete Swift coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-swift-coverage
          path: ${{ runner.temp }}/dobbyvpn-swift-coverage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  ios_simulator_mini:
    name: iOS Simulator SwiftUI mini suite
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Build TrustTunnel-enabled Go runtime for iOS Simulator
        working-directory: go_module
        run: |
          set -euo pipefail
          mobile_version='v0.0.0-20260520154334-0e4426e1883d'
          go install golang.org/x/mobile/cmd/gomobile@"$mobile_version"
          go install golang.org/x/mobile/cmd/gobind@"$mobile_version"
          go mod download
          ./scripts/build_ios_xcframework.sh --simulator-architecture arm64
          runtime_binary="$(find DobbyVPNRuntime.xcframework -type f -path '*/DobbyVPNRuntime.framework/DobbyVPNRuntime' -print -quit)"
          test -n "$runtime_binary"
          runtime_arches="$(xcrun lipo -archs "$runtime_binary" | tee /dev/stderr)"
          [[ " $runtime_arches " == *" arm64 "* ]]

      - name: Build and launch the native SwiftUI app on Simulator
        env:
          PYTHONPATH: torturer
        run: |
          set -euo pipefail
          python3 torturer/tests/ios_simulator/run_app_contract.py \
            --candidate-root "$GITHUB_WORKSPACE" \
            --work-dir "$RUNNER_TEMP/ios-simulator-mini-contract"

      - name: Retain complete iOS Simulator mini diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-ios-simulator-mini
          path: ${{ runner.temp }}/ios-simulator-mini-contract/diagnostics
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
