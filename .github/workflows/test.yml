name: Test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version_metadata:
    name: Release-version metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Match the PR release label to VERSION
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(printf '%s' "$PR_TITLE" | sed -nE 's/.*v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          test -n "$actual" || {
            echo "PR title must contain a release label such as v${expected}." >&2
            exit 1
          }
          test "$actual" = "$expected" || {
            echo "PR title declares v${actual}, but VERSION declares v${expected}." >&2
            exit 1
          }

  workflow-policy:
    name: Workflow secret-isolation policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Enforce secretless PR workflow policy
        run: |
          python3 .github/scripts/check_workflow_policy.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  go:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      - name: Stage pinned Linux native dependencies for Go tests
        run: |
          set -euo pipefail
          python3 .github/scripts/desktop_build.py prepare-go-test-deps --go-mod-tidy
          test -f go_module/libdobby_bridge.so
          test -f go_module/libc++.so.1
          test -f go_module/libc++abi.so.1

      - name: Run Go test suite
        working-directory: go_module
        run: |
          go test ./...

      - name: Race-check lifecycle and routing
        working-directory: go_module
        run: |
          go test -race ./core ./routing ./tunnel/...

  kotlin:
    name: Kotlin and Android service tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      # gomobile currently needs a bootstrap toolchain to build the configured
      # Android Go toolchain from source. Keep this aligned with android_build.
      - name: Set up bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.4'
          # This Go only bootstraps make.bash; module downloads use the
          # separately built Android toolchain from go_module below.
          cache: false

      - name: Read Android Go version
        id: android_go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Cache Android Go toolchain
        uses: actions/cache@v5
        with:
          path: .ci-cache/go-android
          key: ${{ runner.os }}-android-go-${{ steps.android_go.outputs.version }}

      - name: Build Go from source for Android
        run: |
          set -euo pipefail
          GO_VERSION="${{ steps.android_go.outputs.version }}"
          GO_SRC="$GITHUB_WORKSPACE/.ci-cache/go-android"

          if [ ! -x "$GO_SRC/bin/go" ]; then
            rm -rf "$GO_SRC"
            git clone --depth 1 --branch "go${GO_VERSION}" https://github.com/golang/go.git "$GO_SRC"
            pushd "$GO_SRC/src"
            ./make.bash
            popd
          fi

          echo "GOROOT=$GO_SRC" >> "$GITHUB_ENV"
          echo "$GO_SRC/bin" >> "$GITHUB_PATH"
          "$GO_SRC/bin/go" env GOROOT GOVERSION

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            kmp_module/**/*.gradle.kts
            kmp_module/gradle/libs.versions.toml
            kmp_module/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-35
            build-tools;36.0.0
            ndk;27.3.13750724

      - name: Install gomobile
        working-directory: go_module
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260520154334-0e4426e1883d
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260520154334-0e4426e1883d
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run KMP and Android service tests
        working-directory: kmp_module
        run: ./gradlew :grpcstub:test :app:jvmTest :app:testDebugUnitTest :app:verifyDebugNativeAbiPayloads --stacktrace

  ios_libraries:
    name: iOS native dependencies
    uses: ./.github/workflows/ios_libs_generate.yml
    with:
      source_sha: ${{ github.sha }}
      app_major_version: "0"
      app_minor_version: "0"
      app_maintenance_version: "0"

  ios:
    name: iOS unsigned build
    needs: ios_libraries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Download iOS native dependencies
        uses: actions/download-artifact@v7
        with:
          pattern: DobbyVPNRuntime.xcframework
          path: swift_module/DobbyVPNRuntime.xcframework
          merge-multiple: true

      - name: Download Kotlin framework
        uses: actions/download-artifact@v7
        with:
          pattern: app.framework
          path: swift_module/app.framework
          merge-multiple: true

      - name: Build iOS app without signing
        run: |
          xcodebuild build \
            -project swift_module/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  swift:
    name: iOS production lifecycle policy tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Run and ratchet production-source iOS lifecycle policy coverage
        run: |
          set -euo pipefail
          swift test --enable-code-coverage --package-path swift_module
          BUILD_PATH="$(swift build --show-bin-path --package-path swift_module)"
          COVERAGE_PROFILE="$(find "$BUILD_PATH" -type f -path '*/codecov/default.profdata' -print -quit)"
          TEST_EXECUTABLE="$(find "$BUILD_PATH" -type f -path '*.xctest/Contents/MacOS/*PackageTests' -perm -111 -print -quit)"
          test -f "$COVERAGE_PROFILE"
          test -x "$TEST_EXECUTABLE"

          COVERAGE_LCOV="$RUNNER_TEMP/swift-lifecycle-core.lcov"
          COVERAGE_SUMMARY="$RUNNER_TEMP/swift-lifecycle-core-coverage.md"
          xcrun llvm-cov export \
            "$TEST_EXECUTABLE" \
            -instr-profile="$COVERAGE_PROFILE" \
            -format=lcov > "$COVERAGE_LCOV"
          set +e
          python3 .github/scripts/check_swift_coverage.py \
            --lcov "$COVERAGE_LCOV" \
            --source-root "$GITHUB_WORKSPACE/swift_module/CommonDI" \
            --baseline .github/swift-lifecycle-coverage-baseline.json \
            --summary "$COVERAGE_SUMMARY"
          coverage_status=$?
          set -e
          cat "$COVERAGE_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          exit "$coverage_status"

      - name: Upload Swift lifecycle-core coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: swift-lifecycle-core-coverage
          path: |
            ${{ runner.temp }}/swift-lifecycle-core.lcov
            ${{ runner.temp }}/swift-lifecycle-core-coverage.md
          if-no-files-found: error

  ios_simulator_core:
    name: iOS Simulator shared-core and unsigned app checks
    needs: ios_libraries
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Download iOS native dependencies
        uses: actions/download-artifact@v7
        with:
          pattern: DobbyVPNRuntime.xcframework
          path: swift_module/DobbyVPNRuntime.xcframework
          merge-multiple: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            kmp_module/**/*.gradle.kts
            kmp_module/gradle/libs.versions.toml
            kmp_module/gradle/wrapper/gradle-wrapper.properties

      - name: Compile and run the KMP tests on an iOS Simulator
        working-directory: kmp_module
        run: |
          ./gradlew \
            :app:linkDebugFrameworkIosSimulatorArm64 \
            :app:iosSimulatorArm64Test \
            --stacktrace

      - name: Build and install unsigned iOS Simulator app
        run: |
          rm -rf swift_module/app.framework
          ditto \
            kmp_module/app/build/bin/iosSimulatorArm64/debugFramework/app.framework \
            swift_module/app.framework

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 .github/scripts/select_ios_simulator.py)"
          test -n "$SIMULATOR_UDID"
          test "$SIMULATOR_UDID" != "null"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          DERIVED_DATA="$RUNNER_TEMP/dobbyvpn-ios-simulator"
          xcodebuild build \
            -project swift_module/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          python3 .github/scripts/run_ios_simulator_app_lifecycle.py \
            --device "$SIMULATOR_UDID" \
            --app "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/doBBYVPN.app" \
            --result "$RUNNER_TEMP/dobbyvpn-ios-simulator-lifecycle.json"
