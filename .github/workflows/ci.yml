name: CI
run-name: Direct simctl device-listing diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simctl:
    name: Run simctl device listing directly
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Run the exact command and measure its duration
        shell: bash
        run: /usr/bin/time -p xcrun simctl list devices available -j
