name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Run development CI or a product package check.
        required: true
        type: choice
        default: ci
        options:
          - ci
          - debug-packages
          - fdroid-preflight

permissions:
  contents: read

jobs:
  go_build:
    name: Go source build (${{ matrix.name }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            python: python3
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python: python3
          - name: Windows
            runner: windows-2022
            python: python
          - name: macOS
            runner: macos-15
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Build Go product packages
        run: ${{ matrix.python }} .github/scripts/source_checks.py go-build

  android_lint:
    name: Android lint
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read Android dependency versions
        id: pins
        run: |
          set -euo pipefail
          for pin in java_major android_sdk_platform android_build_tools android_ndk; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.java_major }}

      - name: Set up Android SDK used by lint
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: >
            platforms;${{ steps.pins.outputs.android_sdk_platform }}
            build-tools;${{ steps.pins.outputs.android_build_tools }}
            ndk;${{ steps.pins.outputs.android_ndk }}

      - name: Run Android lint and dependency scan
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${{ steps.pins.outputs.android_ndk }}"
          python3 .github/scripts/source_checks.py lint-android

  lint_go:
    name: Go source analysis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Go source analysis
        run: python3 .github/scripts/source_checks.py lint-go

  lint_swift:
    name: Swift source analysis
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run Swift source analysis
        run: python3 .github/scripts/source_checks.py lint-swift

  security:
    name: Dependency and credential scans
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan dependencies and Git history
        run: python3 .github/scripts/source_checks.py security

  actionlint:
    name: GitHub workflow validation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate all GitHub workflow files
        run: python3 .github/scripts/source_checks.py actionlint

  android_build:
    name: Android product build and native library checks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' || inputs.platform == 'debug-packages' || inputs.platform == 'fdroid-preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read Android dependency versions
        id: pins
        run: |
          set -euo pipefail
          for pin in java_major android_sdk_platform android_build_tools android_ndk; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify pinned Go installation
        run: |
          set -euo pipefail
          expected="go$(tr -d '[:space:]' < .go-version)"
          test "$(go env GOVERSION)" = "$expected"
          go_root="$(go env GOROOT)"
          test "$(readlink -f "$(command -v go)")" = "$(readlink -f "$go_root/bin/go")"
          echo "GOROOT=$go_root" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.java_major }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: >
            platforms;${{ steps.pins.outputs.android_sdk_platform }}
            build-tools;${{ steps.pins.outputs.android_build_tools }}
            ndk;${{ steps.pins.outputs.android_ndk }}

      - name: Build Android app without test companion, then verify native ABI
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${{ steps.pins.outputs.android_ndk }}"
          tools_version="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin android_cmdline_tools)"
          # setup-android leaves an older preinstalled cmdline-tools/latest intact.
          export APKANALYZER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/$tools_version/bin/apkanalyzer"
          test -x "$APKANALYZER"
          printf 'APKANALYZER=%s\n' "$APKANALYZER"
          export GO_BIN="$GOROOT/bin/go"
          export GOPATH="$RUNNER_TEMP/dobbyvpn-android-gopath"
          mkdir -p "$GOPATH"
          build_root="$RUNNER_TEMP/dobbyvpn-android-ci"
          version="$(python3 .github/scripts/release/version_metadata.py --version-file VERSION --field version_name)"
          apk="$build_root/DobbyVPN-v${version}-unsign.apk"
          mkdir -p "$build_root"
          .github/scripts/android/android_build_driver.sh \
            --source-root "$GITHUB_WORKSPACE" \
            --source-sha "$GITHUB_SHA" \
            --output "$apk" --local
          mapfile -t ndk_toolchains < <(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#ndk_toolchains[@]}" = 1
          readelf="${ndk_toolchains[0]}/bin/llvm-readelf"
          test -x "$readelf"
          python3 .github/scripts/android/verify_android_native_payloads.py --apk "$apk" --readelf "$readelf"
          python3 .github/scripts/android/android_debug_build.py \
            --source-sha "$GITHUB_SHA" --go-binary "$GOROOT/bin/go" \
            --output "$build_root/DobbyVPN-v${version}-debug.apk"

      - name: Upload APK for F-Droid preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'fdroid-preflight' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dobbyvpn-android-unsign.apk
          path: ${{ runner.temp }}/dobbyvpn-android-ci/DobbyVPN-v*-unsign.apk
          if-no-files-found: error
          retention-days: 1

  ios_production:
    name: iOS production analysis and archive
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Check production iOS source
        run: python3 .github/scripts/ios/ios_production_check.py --source-sha "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/ios-production"

  ci_selected_version:
    name: Read selected build version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'ci' }}
    runs-on: ubuntu-24.04
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      maintenance: ${{ steps.version.outputs.maintenance }}
      version_name: ${{ steps.version.outputs.version_name }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release/version_metadata.py \
            --version-file VERSION --github-output "$GITHUB_OUTPUT"

  fdroid_preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'fdroid-preflight' }}
    needs: [ci_selected_version, android_build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fdroid_preflight.yml
    with:
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.ci_selected_version.outputs.version_name }}
      version_code: ${{ needs.ci_selected_version.outputs.android_version_code }}
      build_run_id: ${{ github.run_id }}

  selected_package_result:
    name: Require selected package check success
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.platform != 'ci' }}
    needs: [ci_selected_version, fdroid_preflight, debug_packages, android_build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check selected package result
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION_RESULT: ${{ needs.ci_selected_version.result }}
          FDROID_RESULT: ${{ needs.fdroid_preflight.result }}
          DEBUG_RESULT: ${{ needs.debug_packages.result }}
          ANDROID_RESULT: ${{ needs.android_build.result }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            fdroid-preflight)
              test "$VERSION_RESULT" = success
              test "$ANDROID_RESULT" = success
              test "$FDROID_RESULT" = success
              ;;
            debug-packages)
              test "$VERSION_RESULT" = success
              test "$DEBUG_RESULT" = success
              test "$ANDROID_RESULT" = success
              ;;
            *) echo "unsupported package check: $PLATFORM" >&2; exit 1 ;;
          esac
          echo "Selected package check passed: $PLATFORM"

  complete_ci:
    name: Complete CI
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') }}
    needs:
      - go_build
      - android_lint
      - lint_go
      - lint_swift
      - security
      - actionlint
      - android_build
      - ios_production
    runs-on: ubuntu-24.04
    steps:
      - name: Require every full CI job
        env:
          GO_BUILD_RESULT: ${{ needs.go_build.result }}
          ANDROID_LINT_RESULT: ${{ needs.android_lint.result }}
          LINT_GO_RESULT: ${{ needs.lint_go.result }}
          LINT_SWIFT_RESULT: ${{ needs.lint_swift.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android_build.result }}
          IOS_PRODUCTION_RESULT: ${{ needs.ios_production.result }}
        run: |
          set -euo pipefail
          for result in \
            "$GO_BUILD_RESULT" \
            "$ANDROID_LINT_RESULT" \
            "$LINT_GO_RESULT" \
            "$LINT_SWIFT_RESULT" \
            "$SECURITY_RESULT" \
            "$ACTIONLINT_RESULT" \
            "$ANDROID_BUILD_RESULT" \
            "$IOS_PRODUCTION_RESULT"; do
            test "$result" = success
          done
          echo "Complete CI passed"

  debug_packages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'debug-packages' }}
    needs: ci_selected_version
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/debug_packages.yml
    with:
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.ci_selected_version.outputs.version_name }}
      major: ${{ needs.ci_selected_version.outputs.major }}
      minor: ${{ needs.ci_selected_version.outputs.minor }}
      maintenance: ${{ needs.ci_selected_version.outputs.maintenance }}
      build_number: ${{ needs.ci_selected_version.outputs.android_version_code }}
