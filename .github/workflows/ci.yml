name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Run development CI or a product package check.
        required: true
        type: choice
        default: ci
        options:
          - ci
          - debug-packages
          - fdroid-preflight

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci_scope:
    name: Select CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      scope: ${{ steps.classify.outputs.scope || 'full' }}
      reason: ${{ steps.classify.outputs.reason || 'classification-unavailable' }}
      reused_run_id: ${{ steps.classify.outputs.reused_run_id || '' }}
    steps:
      - name: Check out trusted CI helpers
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          REPOSITORY: ${{ github.repository }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          SOURCE_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            reuse_output="$RUNNER_TEMP/ci-reuse-output"
            if python3 .github/scripts/ci_reuse.py \
              --repository "$REPOSITORY" \
              --source-sha "$SOURCE_SHA" \
              --current-run-id "$CURRENT_RUN_ID" > "$reuse_output" && grep -qx 'scope=reused' "$reuse_output"; then
              cat "$reuse_output" >> "$GITHUB_OUTPUT"
            else
              classifier_output="$RUNNER_TEMP/ci-push-scope-output"
              if python3 .github/scripts/ci_push_scope.py \
                --before "$EVENT_BEFORE_SHA" --after "$SOURCE_SHA" > "$classifier_output"; then
                cat "$classifier_output" >> "$GITHUB_OUTPUT"
              else
                cat "$classifier_output" >&2 || true
                echo "scope=full" >> "$GITHUB_OUTPUT"
                echo "reason=push-classification-failed" >> "$GITHUB_OUTPUT"
                echo "reused_run_id=" >> "$GITHUB_OUTPUT"
              fi
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "reason=non-pull-request-event" >> "$GITHUB_OUTPUT"
            echo "reused_run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          classifier_output="$RUNNER_TEMP/ci-scope-output"
          if python3 .github/scripts/ci_scope.py \
            --repository "$REPOSITORY" \
            --pull-request "$PULL_REQUEST" \
            --token "$GITHUB_TOKEN" \
            --expected-head-sha "$EVENT_HEAD_SHA" \
            --expected-base-sha "$EVENT_BASE_SHA" \
            --expected-changed-files "$EVENT_CHANGED_FILES" > "$classifier_output"; then
            cat "$classifier_output" >> "$GITHUB_OUTPUT"
          else
            cat "$classifier_output" >&2 || true
            echo "CI scope classifier failed; selecting full CI." >&2
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "reason=classifier-failed" >> "$GITHUB_OUTPUT"
          fi

  go_build:
    name: Go source build (${{ matrix.name }})
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' && needs.ci_scope.outputs.scope == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            python: python3
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            python: python3
          - name: Windows
            runner: windows-2022
            python: python
          - name: macOS
            runner: macos-15
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache
        with:
          pinned-tools: 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Build Go product packages
        run: ${{ matrix.python }} .github/scripts/source_checks.py go-build

  android_lint:
    name: Android lint
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' && (needs.ci_scope.outputs.scope == 'full' || needs.ci_scope.outputs.scope == 'android') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache
        with:
          gradle: 'true'
          pinned-tools: 'true'

      - name: Read Android dependency versions
        id: pins
        run: |
          set -euo pipefail
          for pin in java_major android_sdk_platform android_build_tools android_ndk; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.pins.outputs.java_major }}

      - name: Set up Android SDK used by lint
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: >
            platforms;${{ steps.pins.outputs.android_sdk_platform }}
            build-tools;${{ steps.pins.outputs.android_build_tools }}
            ndk;${{ steps.pins.outputs.android_ndk }}

      - name: Run Android lint and dependency scan
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/${{ steps.pins.outputs.android_ndk }}"
          python3 .github/scripts/source_checks.py lint-android

  lint_go:
    name: Go source analysis
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' && (needs.ci_scope.outputs.scope == 'full' || needs.ci_scope.outputs.scope == 'android' || needs.ci_scope.outputs.scope == 'apple') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache
        with:
          pinned-tools: 'true'

      - name: Run Go source analysis
        run: python3 .github/scripts/source_checks.py lint-go

  lint_swift:
    name: Swift source analysis
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' && (needs.ci_scope.outputs.scope == 'full' || needs.ci_scope.outputs.scope == 'apple') }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache
        with:
          go-modules: 'false'
          pinned-tools: 'true'

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run Swift source analysis
        run: python3 .github/scripts/source_checks.py lint-swift

  security:
    name: Dependency and credential scans
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release tooling syntax and safe imports
        if: ${{ needs.ci_scope.outputs.scope == 'full' || needs.ci_scope.outputs.scope == 'release' }}
        run: |
          set -euo pipefail
          python3 -m compileall -q .github/scripts/release
          PYTHONPATH=.github/scripts:.github/scripts/release python3 - <<'PY'
          import artifact_attempts
          import build_manifest
          import download_artifact
          import publish_selection
          import release_guard
          import release_provenance
          import require_ci
          import test_manifest
          import version_metadata
          PY

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache
        with:
          go-modules: 'false'
          pinned-tools: 'true'

      - name: Scan dependencies and Git history
        run: python3 .github/scripts/source_checks.py security

  actionlint:
    name: GitHub workflow validation
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache
        with:
          go-modules: 'false'
          pinned-tools: 'true'

      - name: Validate all GitHub workflow files
        run: python3 .github/scripts/source_checks.py actionlint

  android_build:
    name: Android product build and native library checks
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci' || inputs.platform == 'debug-packages' || inputs.platform == 'fdroid-preflight') && needs.ci_scope.outputs.scope != 'light' && needs.ci_scope.outputs.scope != 'release' && needs.ci_scope.outputs.scope != 'apple' && needs.ci_scope.outputs.scope != 'reused' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci_android.yml
    with:
      source_sha: ${{ github.sha }}

  ios_production:
    name: iOS production analysis and archive
    needs: ci_scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') && needs.ci_scope.outputs.scope != 'reused' && (needs.ci_scope.outputs.scope == 'full' || needs.ci_scope.outputs.scope == 'apple') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Restore dependency archives
        uses: ./.github/actions/dependency-cache

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Check production iOS source
        run: python3 .github/scripts/ios/ios_production_check.py --source-sha "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/ios-production"

  ci_selected_version:
    name: Read selected build version
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform != 'ci' }}
    runs-on: ubuntu-24.04
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      maintenance: ${{ steps.version.outputs.maintenance }}
      version_name: ${{ steps.version.outputs.version_name }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/scripts/release/version_metadata.py \
            --version-file VERSION --github-output "$GITHUB_OUTPUT"

  fdroid_preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'fdroid-preflight' }}
    needs: [ci_selected_version, android_build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fdroid_preflight.yml
    with:
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.ci_selected_version.outputs.version_name }}
      version_code: ${{ needs.ci_selected_version.outputs.android_version_code }}
      build_run_id: ${{ github.run_id }}

  selected_package_result:
    name: Require selected package check success
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.platform != 'ci' }}
    needs: [ci_selected_version, fdroid_preflight, debug_packages, android_build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check selected package result
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION_RESULT: ${{ needs.ci_selected_version.result }}
          FDROID_RESULT: ${{ needs.fdroid_preflight.result }}
          DEBUG_RESULT: ${{ needs.debug_packages.result }}
          ANDROID_RESULT: ${{ needs.android_build.result }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            fdroid-preflight)
              test "$VERSION_RESULT" = success
              test "$ANDROID_RESULT" = success
              test "$FDROID_RESULT" = success
              ;;
            debug-packages)
              test "$VERSION_RESULT" = success
              test "$DEBUG_RESULT" = success
              test "$ANDROID_RESULT" = success
              ;;
            *) echo "unsupported package check: $PLATFORM" >&2; exit 1 ;;
          esac
          echo "Selected package check passed: $PLATFORM"

  complete_ci:
    name: Complete CI
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.platform == 'ci') }}
    needs:
      - ci_scope
      - go_build
      - android_lint
      - lint_go
      - lint_swift
      - security
      - actionlint
      - android_build
      - ios_production
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected CI job
        env:
          CI_SCOPE: ${{ needs.ci_scope.outputs.scope || 'full' }}
          CI_SCOPE_REASON: ${{ needs.ci_scope.outputs.reason || 'classification-unavailable' }}
          REUSED_RUN_ID: ${{ needs.ci_scope.outputs.reused_run_id || '' }}
          CI_SCOPE_RESULT: ${{ needs.ci_scope.result }}
          GO_BUILD_RESULT: ${{ needs.go_build.result }}
          ANDROID_LINT_RESULT: ${{ needs.android_lint.result }}
          LINT_GO_RESULT: ${{ needs.lint_go.result }}
          LINT_SWIFT_RESULT: ${{ needs.lint_swift.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android_build.result }}
          IOS_PRODUCTION_RESULT: ${{ needs.ios_production.result }}
        run: |
          set -euo pipefail
          echo "CI scope: $CI_SCOPE ($CI_SCOPE_REASON)"
          test "$CI_SCOPE_RESULT" = success
          if [ "$CI_SCOPE" = reused ]; then
            test -n "$REUSED_RUN_ID"
            echo "Full CI reused from verified workflow run $REUSED_RUN_ID."
            exit 0
          fi
          require_result() {
            local job="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "Required CI job '$job' result=$actual; expected $expected." >&2
              exit 1
            fi
          }
          require_common() {
            require_result 'Dependency and credential scans' success "$SECURITY_RESULT"
            require_result 'GitHub workflow validation' success "$ACTIONLINT_RESULT"
          }
          require_unselected_platform_jobs() {
            require_result 'Go source build' skipped "$GO_BUILD_RESULT"
            require_result 'Android lint' skipped "$ANDROID_LINT_RESULT"
            require_result 'Go source analysis' skipped "$LINT_GO_RESULT"
            require_result 'Swift source analysis' skipped "$LINT_SWIFT_RESULT"
            require_result 'Android product build' skipped "$ANDROID_BUILD_RESULT"
            require_result 'iOS production analysis and archive' skipped "$IOS_PRODUCTION_RESULT"
          }
          case "$CI_SCOPE" in
            full)
              require_common
              require_result 'Go source build' success "$GO_BUILD_RESULT"
              require_result 'Android lint' success "$ANDROID_LINT_RESULT"
              require_result 'Go source analysis' success "$LINT_GO_RESULT"
              require_result 'Swift source analysis' success "$LINT_SWIFT_RESULT"
              require_result 'Android product build' success "$ANDROID_BUILD_RESULT"
              require_result 'iOS production analysis and archive' success "$IOS_PRODUCTION_RESULT"
              echo "Full CI passed; every qualification job succeeded."
              ;;
            release)
              require_common
              require_unselected_platform_jobs
              echo "Reduced CI passed: release tooling syntax/import checks, security, and actionlint; app compilation was not selected."
              ;;
            android)
              require_common
              require_result 'Android lint' success "$ANDROID_LINT_RESULT"
              require_result 'Go source analysis' success "$LINT_GO_RESULT"
              require_result 'Android product build' success "$ANDROID_BUILD_RESULT"
              require_result 'Go source build' skipped "$GO_BUILD_RESULT"
              require_result 'Swift source analysis' skipped "$LINT_SWIFT_RESULT"
              require_result 'iOS production analysis and archive' skipped "$IOS_PRODUCTION_RESULT"
              echo "Reduced CI passed: Android build, Android lint, Go analysis, security, and actionlint."
              ;;
            apple)
              require_common
              require_result 'Go source analysis' success "$LINT_GO_RESULT"
              require_result 'Swift source analysis' success "$LINT_SWIFT_RESULT"
              require_result 'iOS production analysis and archive' success "$IOS_PRODUCTION_RESULT"
              require_result 'Go source build' skipped "$GO_BUILD_RESULT"
              require_result 'Android lint' skipped "$ANDROID_LINT_RESULT"
              require_result 'Android product build' skipped "$ANDROID_BUILD_RESULT"
              echo "Reduced CI passed: Apple production analysis, Swift and Go analysis, security, and actionlint."
              ;;
            light)
              require_common
              require_unselected_platform_jobs
              echo "Reduced CI passed: documentation security and workflow validation; app compilation was not selected."
              ;;
            *)
              echo "Unsupported CI scope: $CI_SCOPE" >&2
              exit 1
              ;;
          esac

  debug_packages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.platform == 'debug-packages' }}
    needs: ci_selected_version
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/debug_packages.yml
    with:
      source_sha: ${{ github.sha }}
      version_name: ${{ needs.ci_selected_version.outputs.version_name }}
      major: ${{ needs.ci_selected_version.outputs.major }}
      minor: ${{ needs.ci_selected_version.outputs.minor }}
      maintenance: ${{ needs.ci_selected_version.outputs.maintenance }}
      build_number: ${{ needs.ci_selected_version.outputs.android_version_code }}
