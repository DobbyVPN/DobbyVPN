name: Diagnostic emulator CLI probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator_cli_probe:
    name: Diagnostic emulator CLI probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install only emulator and ADB command-line packages
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: emulator platform-tools
      - name: Inspect installed Android emulator CLI
        shell: bash
        run: |
          set +e; set -uo pipefail
          printf 'Host OS: '; uname -a
          host_status=$?
          printf 'Host OS exit status: %s\n' "$host_status"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          printf 'Android SDK path: %s\n' "${sdk:-<unset>}"
          if [[ -z "$sdk" ]]; then
            echo 'Neither ANDROID_SDK_ROOT nor ANDROID_HOME is set.' >&2
            exit 1
          fi
          emulator="$sdk/emulator/emulator"
          if [[ ! -x "$emulator" ]]; then
            echo "Installed emulator binary missing or not executable: $emulator" >&2
            exit 1
          fi
          printf 'Emulator binary: %s\n' "$emulator"
          "$emulator" -version; version_status=$?
          tags_file="${RUNNER_TEMP:-/tmp}/emulator-debug-tags.$$"
          "$emulator" -help-debug-tags 2>&1 | tee "$tags_file"
          tag_statuses=("${PIPESTATUS[@]}"); help_status=${tag_statuses[0]}; tee_status=${tag_statuses[1]}
          for tag in adb adbserver adbclient; do
            if awk -v tag="$tag" '$1 == tag { found = 1 } END { exit !found }' "$tags_file"; then
              printf 'Tag %s: present\n' "$tag"
            else
              printf 'Tag %s: absent\n' "$tag"
            fi
          done
          adb="$sdk/platform-tools/adb"
          if [[ -x "$adb" ]]; then
            printf 'ADB binary: %s\n' "$adb"
            "$adb" version; adb_status=$?
          else
            echo "Installed adb binary missing or not executable: $adb" >&2
            adb_status=127
          fi
          printf 'Exit statuses: host=%s emulator-version=%s help-debug-tags=%s output-capture=%s adb-version=%s\n' \
            "$host_status" "$version_status" "$help_status" "$tee_status" "$adb_status"
          if (( host_status != 0 || version_status != 0 || help_status != 0 || tee_status != 0 || adb_status != 0 )); then
            exit 1
          fi
