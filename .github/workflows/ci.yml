name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dobbyvpn-actions-retention
  cancel-in-progress: false

jobs:
  go:
    name: Go unit and race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Go unit and race tests
        run: python3 .github/scripts/source_checks.py go-tests --output-dir "$RUNNER_TEMP/dobbyvpn-go-coverage"

      - name: Retain complete Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-go-coverage
          path: ${{ runner.temp }}/dobbyvpn-go-coverage
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

  go_native_runtime:
    name: Selected Go runtime tests on ARM64 Linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64

      - name: Run selected Go runtime tests
        run: python3 .github/scripts/source_checks.py go-native-runtime

  go_native_windows:
    name: Selected Go runtime tests on Windows
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run selected Go runtime tests
        run: python .github/scripts/source_checks.py go-native-runtime

  go_native_macos:
    name: Selected Go runtime tests on macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run selected Go runtime tests
        run: python3 .github/scripts/source_checks.py go-native-runtime

  swift:
    name: Swift lifecycle unit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run Swift unit tests and retain coverage
        run: python3 .github/scripts/source_checks.py swift-unit --output-dir "$RUNNER_TEMP/dobbyvpn-swift-coverage"

      - name: Retain complete Swift coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-swift-coverage
          path: ${{ runner.temp }}/dobbyvpn-swift-coverage
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1

  android_lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK used by lint
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >
            platforms;android-35
            build-tools;36.0.0
            ndk;28.1.13356709

      - name: Run Android lint
        run: python3 .github/scripts/source_checks.py lint-android

  lint_go:
    name: Go source analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run Go source analysis
        run: python3 .github/scripts/source_checks.py lint-go

  lint_swift:
    name: Swift source analysis
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Run Swift source analysis
        run: python3 .github/scripts/source_checks.py lint-swift

  security:
    name: Dependency and credential scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan dependencies and Git history
        run: python3 .github/scripts/source_checks.py security

  actionlint:
    name: GitHub workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate all GitHub workflow files
        run: python3 .github/scripts/source_checks.py actionlint

  platform_checks:
    name: Android build and iOS Simulator checks
    uses: ./.github/workflows/test.yml

  retain:
    name: Retain newest trusted run
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - go
      - go_native_runtime
      - go_native_windows
      - go_native_macos
      - swift
      - android_lint
      - lint_go
      - lint_swift
      - security
      - actionlint
      - platform_checks
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Remove older workflow runs and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/actions_retention.py \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --delete-caches \
            --delete-intermediate-artifacts \
            --keep-artifact dobbyvpn-go-coverage \
            --keep-artifact dobbyvpn-swift-coverage \
            --keep-artifact dobbyvpn-ios-simulator-mini
