name: Delete disposable functional VPN

on:
  workflow_call:
    inputs:
      torturer_sha:
        required: true
        type: string
      torturer_tree_sha256:
        required: true
        type: string
      fixture_key:
        description: Platform owning the Render services to delete.
        required: false
        default: ''
        type: string

jobs:
  cleanup:
    name: Delete disposable Render VPN
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: render-functional
    permissions:
      contents: read
    steps:
      - name: Require main before accessing private tests
        env:
          FIXTURE_KEY: ${{ inputs.fixture_key }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          case "$FIXTURE_KEY" in
            ''|linux|windows|macos|android) ;;
            *) echo "invalid Render fixture key" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact private tests
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.torturer_sha }}
          path: torturer
          ssh-key: ${{ secrets.TORTURER_READ_KEY }}
          persist-credentials: false
      - name: Verify private tests identity
        shell: bash
        env:
          TORTURER_SHA: ${{ inputs.torturer_sha }}
          TORTURER_TREE_SHA256: ${{ inputs.torturer_tree_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          actual = subprocess.check_output(["git", "-C", "torturer", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["TORTURER_SHA"] or release_guard.tests_tree_sha256(Path("torturer")) != os.environ["TORTURER_TREE_SHA256"]:
              raise SystemExit("private test identity differs from reserved candidate")
          PYTHON
      - name: Delete Render VPN
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          FIXTURE_KEY: ${{ inputs.fixture_key }}
        run: |
          set -euo pipefail
          failed=0
          for attempt in $(seq 1 "$GITHUB_RUN_ATTEMPT"); do
            if ! PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m disposable_vpn_server.render_service stop \
              --run-id "$GITHUB_RUN_ID" --attempt "$attempt" \
              --fixture-key "$FIXTURE_KEY" \
              --owner-id "$RENDER_OWNER_ID"; then
              failed=1
            fi
          done
          exit "$failed"
