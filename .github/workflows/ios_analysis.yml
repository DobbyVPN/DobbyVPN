name: Analyze selected iOS build

on:
  workflow_call:
    inputs:
      build_packages:
        description: Exact readiness-selected Build artifacts, when overlapping Build.
        type: string
        required: false
        default: ''
      build_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  DOBBY_BUILD_PACKAGES: ${{ inputs.build_packages }}

jobs:
  analysis:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Require a valid Test attempt
        run: test "$GITHUB_RUN_ATTEMPT" -ge 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify selected source
        run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Download selected iOS runtime framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release/download_artifact.py \
            "${{ inputs.build_run_id }}" DobbyVPNRuntime.xcframework ui/apple/DobbyVPNRuntime.xcframework
      - name: Analyze production iOS app and tunnel without signing
        run: |
          set -euo pipefail
          bash core/scripts/package_ios_app.sh \
            iosanalyze "$RUNNER_TEMP/dobbyvpn-ios-analysis" \
            ui/apple/DobbyVPNRuntime.xcframework
