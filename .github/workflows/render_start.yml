name: Start disposable functional VPN

on:
  workflow_call:
    inputs:
      torturer_sha:
        required: true
        type: string
      torturer_tree_sha256:
        required: true
        type: string
      retention_days:
        default: 1
        type: number

jobs:
  start:
    name: Start disposable Render VPN
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: render-functional
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject reruns before creating a Render service
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Workflow reruns are unsupported; dispatch a fresh workflow." >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact private tests
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.torturer_sha }}
          path: torturer
          ssh-key: ${{ secrets.TORTURER_READ_KEY }}
          persist-credentials: false
      - name: Verify private tests identity
        shell: bash
        env:
          TORTURER_SHA: ${{ inputs.torturer_sha }}
          TORTURER_TREE_SHA256: ${{ inputs.torturer_tree_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          actual = subprocess.check_output(["git", "-C", "torturer", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["TORTURER_SHA"] or release_guard.tests_tree_sha256(Path("torturer")) != os.environ["TORTURER_TREE_SHA256"]:
              raise SystemExit("private test identity differs from reserved candidate")
          PYTHON

      - name: Start Render VPN
        working-directory: torturer
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_IMAGE_OWNER_ID: ${{ vars.RENDER_IMAGE_OWNER_ID }}
          RENDER_IMAGE_PATH: ${{ vars.RENDER_IMAGE_PATH }}
          RENDER_IMAGE_DIGEST: ${{ vars.RENDER_IMAGE_DIGEST }}
          RENDER_REGION: ${{ vars.RENDER_REGION }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_TOKEN"
          test -n "$RENDER_OWNER_ID"
          test -n "$RENDER_IMAGE_OWNER_ID"
          test -n "$RENDER_IMAGE_PATH"
          test -n "$RENDER_IMAGE_DIGEST"
          test -n "$RENDER_REGION"
          PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m disposable_vpn_server.render_service start \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --owner-id "$RENDER_OWNER_ID" \
            --image-owner-id "$RENDER_IMAGE_OWNER_ID" \
            --image-path "$RENDER_IMAGE_PATH" \
            --image-digest "$RENDER_IMAGE_DIGEST" \
            --region "$RENDER_REGION" \
            --output "$RUNNER_TEMP/render"

      - name: Upload shared Render profile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: render-vpn-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/render/profile.toml
            ${{ runner.temp }}/render/deadline_epoch.txt
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
