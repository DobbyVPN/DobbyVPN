name: Debug packages

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version_name:
        type: string
        required: true
      retention_days:
        default: 1
        type: number

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: amd64
          - platform: windows
            architecture: amd64
    uses: ./.github/workflows/desktop_package.yml
    with:
      debug: true
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}
      source_sha: ${{ inputs.source_sha }}
      version_name: ${{ inputs.version_name }}
      retention_days: ${{ inputs.retention_days }}
