name: Android Build

on:
  workflow_call:
    inputs:
      build_only:
        type: boolean
        default: false
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true
      android_version_code:
        type: string
        required: true
      source_sha:
        type: string
        required: true

jobs:
  android_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
      APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
      APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      APP_SOURCE_SHA: ${{ inputs.source_sha }}
      APP_SOURCE_REPOSITORY: ${{ github.repository }}
      ANDROID_REPRO_SOURCE_ROOT: /home/vagrant/build/com.dobby.vpn
      ANDROID_REPRO_GO_ROOT: /home/vagrant/build/srclib/go
      GOPATH: /home/vagrant/go
      GOFLAGS: -trimpath -buildvcs=false
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      # setup-go consults the job-level GOPATH. Create the reproducible
      # owner-controlled build paths before the action attempts to use them.
      - name: Prepare reproducible Android build paths
        run: |
          sudo mkdir -p \
            "$(dirname "$ANDROID_REPRO_SOURCE_ROOT")" \
            "$(dirname "$ANDROID_REPRO_GO_ROOT")" \
            "$GOPATH"
          sudo chown -R "$USER:$USER" /home/vagrant

      # Go 1.24.6 is only the minimum bootstrap compiler used by make.bash to
      # build the pinned Go 1.26.9 toolchain from source. It never compiles the
      # application; the version and binary used for that are verified below.
      - name: Set up bootstrap Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.6'
          # This Go only bootstraps make.bash; there is no root go.mod to cache.
          cache: false

      - name: Read Android Go version
        id: android_go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Download trusted Gradle distribution
        run: |
          set -euo pipefail
          gradle_version="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin gradle_version)"
          download_root="$(mktemp -d "$RUNNER_TEMP/dobbyvpn-gradle.XXXXXX")"
          archive="$download_root/gradle-$gradle_version-bin.zip"
          gradle_url="$(python3 .github/scripts/android/android_dependency_provenance.py \
            --print-pin gradle_url)"
          curl --fail --show-error --location --output "$archive" "$gradle_url"
          extraction_root="$(mktemp -d "$RUNNER_TEMP/dobbyvpn-gradle-root.XXXXXX")"
          unzip "$archive" -d "$extraction_root"
          gradle_root="$extraction_root/gradle-$gradle_version"
          {
            echo "GRADLE_ARCHIVE=$archive"
            echo "GRADLE_ROOT=$gradle_root"
            echo "GRADLE_BIN=$gradle_root/bin/gradle"
          } >> "$GITHUB_ENV"

      - name: Build Go from source for Android
        env:
          ANDROID_GO_VERSION: ${{ steps.android_go.outputs.version }}
        run: |
          set -euo pipefail
          GO_VERSION="$ANDROID_GO_VERSION"
          [[ "$GO_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          SPEC_GO_VERSION="$(python3 .github/scripts/android/android_dependency_provenance.py \
            --spec .github/scripts/android/dependency-spec.json \
            --print-pin go_version)"
          test "$GO_VERSION" = "$SPEC_GO_VERSION"
          GO_SRC="$ANDROID_REPRO_GO_ROOT"
          GO_COMMIT="$(python3 .github/scripts/android/android_dependency_provenance.py \
            --spec .github/scripts/android/dependency-spec.json \
            --print-pin go_source_commit)"
          [[ "$GO_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          test ! -e "$GO_SRC"
          git clone --depth 1 --branch "go${GO_VERSION}" https://github.com/golang/go.git "$GO_SRC"
          test "$(git -C "$GO_SRC" rev-parse HEAD)" = "$GO_COMMIT"
          pushd "$GO_SRC/src"
          ./make.bash
          popd

          echo "GOROOT=$GO_SRC" >> "$GITHUB_ENV"
          echo "$GO_SRC/bin" >> "$GITHUB_PATH"
          test "$("$GO_SRC/bin/go" env GOVERSION)" = "go${GO_VERSION}"
          test "$("$GO_SRC/bin/go" env GOTOOLCHAIN)" = "local"

      - name: Read Android dependency versions
        id: pins
        run: |
          set -euo pipefail
          for pin in java_major android_compile_sdk android_build_tools android_ndk; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Set up pinned JDK (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ steps.pins.outputs.java_major }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >
            platforms;android-${{ steps.pins.outputs.android_compile_sdk }}
            build-tools;${{ steps.pins.outputs.android_build_tools }}
            ndk;${{ steps.pins.outputs.android_ndk }}

      - name: Select and verify pinned Android NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          ndk_home="$sdk_root/ndk/${{ steps.pins.outputs.android_ndk }}"
          test -f "$ndk_home/source.properties"
          grep -Fqx 'Pkg.Revision = ${{ steps.pins.outputs.android_ndk }}' "$ndk_home/source.properties"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk_home" >> "$GITHUB_ENV"

      - name: Prepare reproducible Android source path
        run: |
          # Keep the exact detached Git objects with the source copy.  The
          # shared public driver proves that the checkout bytes still equal
          # HEAD^{tree} before it creates any build output.
          rsync -a --delete "$GITHUB_WORKSPACE/" "$ANDROID_REPRO_SOURCE_ROOT/"

      - name: Build and verify isolated unsigned APKs through the public driver
        if: ${{ !inputs.build_only }}
        working-directory: /home/vagrant/build/com.dobby.vpn
        env:
          DOBBYVPN_ANDROID_GO_CACHE: ${{ runner.temp }}/dobbyvpn-android-repro/first/go-cache
          DOBBYVPN_ANDROID_GO_TMPDIR: ${{ runner.temp }}/dobbyvpn-android-repro/first/go-tmp
        run: |
          set -euo pipefail
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          "$GITHUB_WORKSPACE/.github/scripts/android/android_build_driver.sh" \
            --source-root "$ANDROID_REPRO_SOURCE_ROOT" \
            --source-sha "$APP_SOURCE_SHA" \
            --output "$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v${version}-unsign.apk" \
            --test-companion-output "$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v${version}-android-test-companion-unsigned.apk" \
            --manifest "$ANDROID_REPRO_SOURCE_ROOT/runtime/android-build-driver-manifest.json" \
            --first-output "$ANDROID_REPRO_SOURCE_ROOT/runtime/android-repro-first.apk" \
            --reproducibility "$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v${version}-android-reproducibility.json" \
            --gradle-archive "$GRADLE_ARCHIVE" \
            --gradle-root "$GRADLE_ROOT" \
            --go-binary "$GOROOT/bin/go" \
            --source-repository "$APP_SOURCE_REPOSITORY"

      - name: Build release and Debug APKs without checks
        if: ${{ inputs.build_only }}
        working-directory: /home/vagrant/build/com.dobby.vpn
        run: |
          set -euo pipefail
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          "$GRADLE_ROOT/bin/gradle" -p ui/android :app:assembleRelease :app:assembleDebug \
            --no-daemon --console=plain --stacktrace \
            -PdobbyGoBinary="$GOROOT/bin/go" \
            -PprojectRepositoryCommit="$APP_SOURCE_SHA" \
            -PprojectRepositoryCommitLink="https://github.com/$APP_SOURCE_REPOSITORY/commit/$APP_SOURCE_SHA" \
            -Pandroid.injected.version.code="$ANDROID_VERSION_CODE" \
            -Pandroid.injected.version.name="$version"
          mkdir -p runtime/android-release
          cp ui/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "runtime/android-release/DobbyVPN-v${version}-unsign.apk"
          cp ui/android/app/build/outputs/apk/debug/app-debug.apk \
            "runtime/android-release/DobbyVPN-v${version}-debug.apk"

      - name: Create Android source and digest provenance
        if: ${{ !inputs.build_only }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_NAME: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
          VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          unsigned="$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v$VERSION_NAME-unsign.apk"
          companion="$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v$VERSION_NAME-android-test-companion-unsigned.apk"
          reproducibility="$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v$VERSION_NAME-android-reproducibility.json"
          driver_manifest="$ANDROID_REPRO_SOURCE_ROOT/runtime/android-build-driver-manifest.json"
          manifest="$ANDROID_REPRO_SOURCE_ROOT/runtime/android-release/DobbyVPN-v$VERSION_NAME-android-provenance.json"
          test -f "$unsigned"; test -f "$companion"
          source_tree="$(git -C "$ANDROID_REPRO_SOURCE_ROOT" rev-parse --verify 'HEAD^{tree}')"
          python3 .github/scripts/android/android_apk_signing.py create-provenance \
            --output "$manifest" \
            --unsigned-apk "$unsigned" \
            --test-companion "$companion" \
            --build-driver-manifest "$driver_manifest" \
            --reproducibility "$reproducibility" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$source_tree" \
            --source-repository "$APP_SOURCE_REPOSITORY" \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-unsign.apk
          path: ${{ env.ANDROID_REPRO_SOURCE_ROOT }}/runtime/android-release/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-unsign.apk
          if-no-files-found: error
          retention-days: ${{ github.workflow == 'Release' && 7 || 1 }}

      - name: Upload Android test companion
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-test-companion-unsigned.apk
          path: ${{ env.ANDROID_REPRO_SOURCE_ROOT }}/runtime/android-release/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-android-test-companion-unsigned.apk
          if-no-files-found: error
          retention-days: ${{ github.workflow == 'Release' && 7 || 1 }}

      - name: Upload Android provenance
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-provenance
          path: ${{ env.ANDROID_REPRO_SOURCE_ROOT }}/runtime/android-release/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-android-provenance.json
          if-no-files-found: error
          retention-days: ${{ github.workflow == 'Release' && 7 || 1 }}

      - name: Build and inspect native Debug APK
        if: ${{ !inputs.build_only }}
        working-directory: /home/vagrant/build/com.dobby.vpn
        run: |
          python3 .github/scripts/android/android_debug_build.py \
            --source-sha "$APP_SOURCE_SHA" --go-binary "$GOROOT/bin/go" \
            --output "runtime/android-release/DobbyVPN-v${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}-debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-debug.apk
          path: ${{ env.ANDROID_REPRO_SOURCE_ROOT }}/runtime/android-release/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.workflow == 'Release' && 7 || 1 }}
