name: Android Build

on:
  workflow_call:
    secrets:
      KEY_ALIAS:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      KEYSTORE_FILE:
        required: true
    inputs:
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true
      android_version_code:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      legacy_android_version_code:
        description: Compatibility override for tagged sources that used APPLE_BUILD_NUMBER as Android versionCode
        type: string
        required: false
        default: ''

jobs:
  android_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
      APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
      APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
      APPLE_BUILD_NUMBER: ${{ inputs.legacy_android_version_code || github.run_number }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      APP_SOURCE_SHA: ${{ inputs.source_sha }}
      APP_SOURCE_REPOSITORY: ${{ github.repository }}
      FDROID_COMPAT_SOURCE_ROOT: /home/vagrant/build/com.dobby.vpn
      FDROID_COMPAT_GO_ROOT: /home/vagrant/build/srclib/go
      GOPATH: /home/vagrant/go
      GOMOBILE: /home/vagrant/go/bin/gomobile
      TRUSTED_HELPER_ROOT: ${{ github.workspace }}/.trusted-workflow
      TRUSTED_HELPER_SHA: ${{ github.workflow_sha }}
      GOFLAGS: -trimpath -buildvcs=false
      EXPECTED_ANDROID_SIGNER_SHA256: c3f0414a74012060d7c6aa3a3d9dac0aa13c1bd23b7512eefd860fb865e67933

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      # setup-go consults the job-level GOPATH. Create the F-Droid-compatible
      # owner-controlled path before the action attempts to use it.
      - name: Prepare F-Droid-compatible tool paths
        run: |
          sudo mkdir -p \
            "$(dirname "$FDROID_COMPAT_SOURCE_ROOT")" \
            "$(dirname "$FDROID_COMPAT_GO_ROOT")" \
            "$GOPATH"
          sudo chown -R "$USER:$USER" /home/vagrant

      - name: Set up bootstrap Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.4'
          # This Go only bootstraps make.bash; there is no root go.mod to cache.
          cache: false

      - name: Read Android Go version
        id: android_go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      # The selected release tag may predate the current build driver and
      # dependency specification. Keep those helpers in a separate exact
      # checkout bound to this workflow revision; never copy them into the
      # selected source tree.
      - name: Check out trusted Android build helpers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .trusted-workflow
          sparse-checkout: |
            .github/android/dependency-spec.json
            .github/scripts/android_build_driver.sh
            .github/scripts/android_dependency_provenance.py
            .github/scripts/public_output.py
            .github/scripts/verify_android_apk_source.py
            .github/scripts/verify_android_reproducibility.py
          persist-credentials: false

      - name: Verify trusted Android helper checkout before any trusted helper use
        run: |
          set -euo pipefail
          [[ "$TRUSTED_HELPER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "trusted helper SHA is not a full lowercase commit identity: $TRUSTED_HELPER_SHA" >&2
            exit 2
          }
          [[ -d "$TRUSTED_HELPER_ROOT" && ! -L "$TRUSTED_HELPER_ROOT" ]] || {
            echo "trusted helper root is not a real directory: $TRUSTED_HELPER_ROOT" >&2
            exit 2
          }
          observed_sha="$(git -C "$TRUSTED_HELPER_ROOT" rev-parse --verify HEAD^{commit})"
          echo "trusted helper observed SHA: $observed_sha"
          test "$observed_sha" = "$TRUSTED_HELPER_SHA" || {
            echo "trusted helper checkout SHA mismatch: expected $TRUSTED_HELPER_SHA got $observed_sha" >&2
            exit 2
          }
          status_output="$(git -C "$TRUSTED_HELPER_ROOT" status --porcelain=v2 --untracked-files=all --ignored)"
          if [[ -n "$status_output" ]]; then
            echo "trusted helper checkout is not clean; complete status follows:" >&2
            printf '%s\n' "$status_output" >&2
            exit 2
          fi
          while IFS= read -r -d '' path; do
            if [[ -L "$path" ]]; then
              echo "trusted helper checkout contains a symlink: $path" >&2
              exit 2
            fi
          done < <(find "$TRUSTED_HELPER_ROOT" -mindepth 1 -print0)
          for relative in \
            .github/android/dependency-spec.json \
            .github/scripts/android_build_driver.sh \
            .github/scripts/android_dependency_provenance.py \
            .github/scripts/public_output.py \
            .github/scripts/verify_android_apk_source.py \
            .github/scripts/verify_android_reproducibility.py; do
            path="$TRUSTED_HELPER_ROOT/$relative"
            [[ -f "$path" && ! -L "$path" ]] || {
              echo "trusted helper file is missing or not a regular non-symlink file: $path" >&2
              exit 2
            }
          done
          test -x "$TRUSTED_HELPER_ROOT/.github/scripts/android_build_driver.sh" || {
            echo "trusted Android build driver is not executable" >&2
            exit 2
          }
          echo 'trusted Android helper checkout passed exact SHA, cleanliness, symlink, and file contract'

      - name: Cache trusted Gradle distribution archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/dobbyvpn-gradle-cache
          key: android-gradle-8.13-${{ hashFiles('.trusted-workflow/.github/android/dependency-spec.json') }}

      - name: Download and verify trusted Gradle distribution
        run: |
          set -euo pipefail
          cache_root="$RUNNER_TEMP/dobbyvpn-gradle-cache"
          mkdir -p "$cache_root"
          archive="$cache_root/gradle-8.13-bin.zip"
          gradle_url="$(python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" --print-gradle-url)"
          gradle_sha="$(python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" --print-gradle-sha256)"
          test "$gradle_url" = 'https://services.gradle.org/distributions/gradle-8.13-bin.zip'
          [[ "$gradle_sha" =~ ^[0-9a-f]{64}$ ]]
          if [[ -e "$archive" || -L "$archive" ]]; then
            [[ -f "$archive" && ! -L "$archive" ]] || {
              echo "cached Gradle archive is not a regular non-symlink file: $archive" >&2
              exit 2
            }
          else
            temporary_archive="$(mktemp "$cache_root/gradle-8.13-bin.zip.XXXXXX")"
            curl --fail --show-error --location --retry 3 --output "$temporary_archive" "$gradle_url"
            chmod 600 "$temporary_archive"
            mv "$temporary_archive" "$archive"
          fi
          observed_sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "trusted Gradle archive SHA-256: $observed_sha"
          test "$observed_sha" = "$gradle_sha" || {
            echo "trusted Gradle archive SHA-256 mismatch: expected $gradle_sha got $observed_sha" >&2
            exit 2
          }
          extraction_root="$(mktemp -d "$RUNNER_TEMP/dobbyvpn-gradle-root.XXXXXX")"
          unzip "$archive" -d "$extraction_root"
          gradle_root="$extraction_root/gradle-8.13"
          [[ -d "$gradle_root" && ! -L "$gradle_root" ]] || {
            echo "verified Gradle archive did not produce gradle-8.13 root" >&2
            exit 2
          }
          python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" \
            --verify-gradle-distribution --gradle-archive "$archive" --gradle-root "$gradle_root"
          gradle_version="$("$gradle_root/bin/gradle" --version | tee /dev/stderr | awk '/^Gradle / {print $2; exit}')"
          test "$gradle_version" = '8.13'
          {
            echo "GRADLE_ARCHIVE=$archive"
            echo "GRADLE_ROOT=$gradle_root"
            echo "GRADLE_BIN=$gradle_root/bin/gradle"
          } >> "$GITHUB_ENV"

      - name: Build Go from source for Android
        env:
          ANDROID_GO_VERSION: ${{ steps.android_go.outputs.version }}
        run: |
          set -euo pipefail
          GO_VERSION="$ANDROID_GO_VERSION"
          [[ "$GO_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          SPEC_GO_VERSION="$(python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" \
            --print-go-version)"
          test "$GO_VERSION" = "$SPEC_GO_VERSION"
          GO_SRC="$FDROID_COMPAT_GO_ROOT"
          GO_COMMIT="$(python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" \
            --print-go-source-commit)"
          [[ "$GO_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          test ! -e "$GO_SRC"
          git clone --depth 1 --branch "go${GO_VERSION}" https://github.com/golang/go.git "$GO_SRC"
          test "$(git -C "$GO_SRC" rev-parse HEAD)" = "$GO_COMMIT"
          pushd "$GO_SRC/src"
          ./make.bash
          popd

          echo "GOROOT=$GO_SRC" >> "$GITHUB_ENV"
          echo "$GO_SRC/bin" >> "$GITHUB_PATH"
          test "$("$GO_SRC/bin/go" env GOVERSION)" = "go${GO_VERSION}"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            kmp_module/**/*.gradle.kts
            kmp_module/gradle/libs.versions.toml
            kmp_module/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >
            platforms;android-35
            platforms;android-36
            build-tools;36.0.0
            ndk;27.3.13750724

      - name: Install gomobile
        run: |
          set -euo pipefail
          mobile_pin="$(python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" --print-mobile-version)"
          mobile_module="${mobile_pin%@*}"
          mobile_version="${mobile_pin#*@}"
          test "$mobile_module" = 'golang.org/x/mobile'
          test "$mobile_version" = 'v0.0.0-20260520154334-0e4426e1883d'
          GOBIN="$GOPATH/bin" go install "$mobile_module/cmd/gomobile@$mobile_version"
          GOBIN="$GOPATH/bin" go install "$mobile_module/cmd/gobind@$mobile_version"
          echo "$GOPATH/bin" >> "$GITHUB_PATH"
          go env GOROOT GOVERSION GOFLAGS

      - name: Verify reproducible Android toolchain
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(cat .go-version)"
          test "$(go env GOROOT)" = "$FDROID_COMPAT_GO_ROOT"
          test "$(go env GOPATH)" = "$GOPATH"
          test "$(go env GOFLAGS)" = '-trimpath -buildvcs=false'
          test "$(readlink -f "$GOMOBILE")" = "$GOPATH/bin/gomobile"
          test -x "$GOMOBILE"
          mobile_pin="$(python3 "$TRUSTED_HELPER_ROOT/.github/scripts/android_dependency_provenance.py" \
            --spec "$TRUSTED_HELPER_ROOT/.github/android/dependency-spec.json" --print-mobile-version)"
          mobile_module="${mobile_pin%@*}"
          mobile_version="${mobile_pin#*@}"
          for tool in gomobile gobind; do
            go version -m "$GOPATH/bin/$tool" | tee /dev/stderr | \
              grep -F "$mobile_module" | grep -F "$mobile_version"
          done
          java_version="$(java -version 2>&1 | tee /dev/stderr)"
          grep -F 'version "17.' <<<"$java_version"
          ndk_revision="$(sed -n 's/^Pkg.Revision *= *//p' \
            "$ANDROID_SDK_ROOT/ndk/27.3.13750724/source.properties")"
          test "$ndk_revision" = "27.3.13750724"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test "$GRADLE_BIN" = "$GRADLE_ROOT/bin/gradle"
          test -x "$GRADLE_BIN"
          gradle_version="$("$GRADLE_BIN" -p kmp_module --version --no-daemon | \
            tee /dev/stderr | awk '/^Gradle / {print $2}')"
          test "$gradle_version" = "8.13"

      - name: Prepare F-Droid-compatible source path
        run: |
          # Keep the exact detached Git objects with the source copy.  The
          # shared public driver proves that the checkout bytes still equal
          # HEAD^{tree} before it creates any build output.
          rsync -a --delete --delete-excluded --exclude='.trusted-workflow' "$GITHUB_WORKSPACE/" "$FDROID_COMPAT_SOURCE_ROOT/"

      - name: Build and verify isolated unsigned APKs through the public driver
        working-directory: /home/vagrant/build/com.dobby.vpn
        env:
          DOBBYVPN_GOMOBILE_GOCACHE: ${{ runner.temp }}/dobbyvpn-android-repro/first/go-cache
          DOBBYVPN_GOMOBILE_GOTMPDIR: ${{ runner.temp }}/dobbyvpn-android-repro/first/go-tmp
        run: |
          set -euo pipefail
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          "$TRUSTED_HELPER_ROOT/.github/scripts/android_build_driver.sh" \
            --source-root "$FDROID_COMPAT_SOURCE_ROOT" \
            --trusted-helper-root "$TRUSTED_HELPER_ROOT" \
            --trusted-helper-sha "$TRUSTED_HELPER_SHA" \
            --output "$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v${version}-unsign.apk" \
            --manifest "$FDROID_COMPAT_SOURCE_ROOT/runtime/android-build-driver-manifest.json" \
            --first-output "$FDROID_COMPAT_SOURCE_ROOT/runtime/android-repro-first.apk" \
            --reproducibility "$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v${version}-android-reproducibility.json" \
            --gradle-archive "$GRADLE_ARCHIVE" \
            --gradle-root "$GRADLE_ROOT" \
            --source-repository "$APP_SOURCE_REPOSITORY"

      - name: Sign the verified unsigned APK
        working-directory: /home/vagrant/build/com.dobby.vpn
        run: |
          set -euo pipefail
          umask 077
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          unsigned="fastlane/DobbyVPN-v${version}-unsign.apk"
          signed="fastlane/DobbyVPN-v${version}-sign.apk"
          signing_dir="$(mktemp -d)"
          trap 'rm -f "$signing_dir/keystore.jks"; rmdir "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$signing_dir/keystore.jks"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$signing_dir/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed" \
            "$unsigned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify "$signed"
          mapfile -t signer_digests < <(
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$signed" | \
              sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p'
          )
          test "${#signer_digests[@]}" -eq 1
          test "${signer_digests[0]}" = "$EXPECTED_ANDROID_SIGNER_SHA256"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

      - name: Verify signed APK payload binding
        working-directory: /home/vagrant/build/com.dobby.vpn
        run: |
          set -euo pipefail
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          python3 "$GITHUB_WORKSPACE/.trusted-workflow/.github/scripts/verify_android_reproducibility.py" verify-signed-payload \
            --unsigned-apk "fastlane/DobbyVPN-v${version}-unsign.apk" \
            --signed-apk "fastlane/DobbyVPN-v${version}-sign.apk"

      - name: Create Android source and digest provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_NAME: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
          VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          signed="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-sign.apk"
          unsigned="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-unsign.apk"
          reproducibility="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-android-reproducibility.json"
          driver_manifest="$FDROID_COMPAT_SOURCE_ROOT/runtime/android-build-driver-manifest.json"
          manifest="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-android-provenance.json"

          for apk in "$signed" "$unsigned"; do
            test "$(apkanalyzer manifest application-id "$apk")" = "com.dobby.vpn"
            test "$(apkanalyzer manifest version-name "$apk")" = "$VERSION_NAME"
            test "$(apkanalyzer manifest version-code "$apk")" = "$VERSION_CODE"
          done

          python3 "$GITHUB_WORKSPACE/.trusted-workflow/.github/scripts/verify_android_apk_source.py" \
            --apk "$signed" --apk "$unsigned" \
            --source-sha "$SOURCE_SHA" --repository "$APP_SOURCE_REPOSITORY"

          SIGNED_APK="$signed" UNSIGNED_APK="$unsigned" REPRODUCIBILITY="$reproducibility" DRIVER_MANIFEST="$driver_manifest" MANIFEST="$manifest" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def artifact(kind: str, variable: str) -> dict[str, str]:
              path = Path(os.environ[variable])
              return {
                  "kind": kind,
                  "name": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          document = {
              "schema": 1,
              "source_sha": os.environ["SOURCE_SHA"],
              "version_name": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "application_id": "com.dobby.vpn",
              "signer_certificate_sha256": os.environ["EXPECTED_ANDROID_SIGNER_SHA256"],
              "signed_payload_matches_unsigned": True,
              "build_driver": json.loads(
                  Path(os.environ["DRIVER_MANIFEST"]).read_text(encoding="utf-8")
              ),
              "reproducibility": json.loads(
                  Path(os.environ["REPRODUCIBILITY"]).read_text(encoding="utf-8")
              ),
              "artifacts": [
                  artifact("signed", "SIGNED_APK"),
                  artifact("unsigned", "UNSIGNED_APK"),
              ],
          }
          Path(os.environ["MANIFEST"]).write_text(
              json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-sign.apk
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-sign.apk
          if-no-files-found: error

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-unsign.apk
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-unsign.apk
          if-no-files-found: error

      - name: Upload Android provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-provenance
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-android-provenance.json
          if-no-files-found: error
