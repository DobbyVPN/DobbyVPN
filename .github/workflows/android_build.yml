name: Android Build

on:
  workflow_call:
    secrets:
      KEY_ALIAS:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      KEYSTORE_FILE:
        required: true
    inputs:
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true
      android_version_code:
        type: string
        required: true
      source_sha:
        type: string
        required: true

jobs:
  android_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
      APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
      APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
      APPLE_BUILD_NUMBER: ${{ inputs.android_version_code }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      APP_SOURCE_SHA: ${{ inputs.source_sha }}
      APP_SOURCE_REPOSITORY: ${{ github.repository }}
      FDROID_COMPAT_SOURCE_ROOT: /home/vagrant/build/com.dobby.vpn
      FDROID_COMPAT_GO_ROOT: /home/vagrant/build/srclib/go
      GOPATH: /home/vagrant/go
      GOFLAGS: -trimpath -buildvcs=false
      GOTOOLCHAIN: local
      EXPECTED_ANDROID_SIGNER_SHA256: c3f0414a74012060d7c6aa3a3d9dac0aa13c1bd23b7512eefd860fb865e67933

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      # setup-go consults the job-level GOPATH. Create the F-Droid-compatible
      # owner-controlled path before the action attempts to use it.
      - name: Prepare F-Droid-compatible tool paths
        run: |
          sudo mkdir -p \
            "$(dirname "$FDROID_COMPAT_SOURCE_ROOT")" \
            "$(dirname "$FDROID_COMPAT_GO_ROOT")" \
            "$GOPATH"
          sudo chown -R "$USER:$USER" /home/vagrant

      # Go 1.24.6 is only the minimum bootstrap compiler used by make.bash to
      # build the pinned Go 1.26.8 toolchain from source. It never compiles the
      # application; the version and binary used for that are verified below.
      - name: Set up bootstrap Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.6'
          # This Go only bootstraps make.bash; there is no root go.mod to cache.
          cache: false

      - name: Read Android Go version
        id: android_go
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Download trusted Gradle distribution
        run: |
          set -euo pipefail
          download_root="$(mktemp -d "$RUNNER_TEMP/dobbyvpn-gradle.XXXXXX")"
          archive="$download_root/gradle-8.13-bin.zip"
          gradle_url="$(python3 .github/scripts/android_dependency_provenance.py \
            --spec .github/android/dependency-spec.json --print-gradle-url)"
          curl --fail --show-error --location --output "$archive" "$gradle_url"
          extraction_root="$(mktemp -d "$RUNNER_TEMP/dobbyvpn-gradle-root.XXXXXX")"
          unzip "$archive" -d "$extraction_root"
          gradle_root="$extraction_root/gradle-8.13"
          {
            echo "GRADLE_ARCHIVE=$archive"
            echo "GRADLE_ROOT=$gradle_root"
            echo "GRADLE_BIN=$gradle_root/bin/gradle"
          } >> "$GITHUB_ENV"

      - name: Build Go from source for Android
        env:
          ANDROID_GO_VERSION: ${{ steps.android_go.outputs.version }}
        run: |
          set -euo pipefail
          GO_VERSION="$ANDROID_GO_VERSION"
          [[ "$GO_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          SPEC_GO_VERSION="$(python3 .github/scripts/android_dependency_provenance.py \
            --spec .github/android/dependency-spec.json \
            --print-go-version)"
          test "$GO_VERSION" = "$SPEC_GO_VERSION"
          GO_SRC="$FDROID_COMPAT_GO_ROOT"
          GO_COMMIT="$(python3 .github/scripts/android_dependency_provenance.py \
            --spec .github/android/dependency-spec.json \
            --print-go-source-commit)"
          [[ "$GO_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          test ! -e "$GO_SRC"
          git clone --depth 1 --branch "go${GO_VERSION}" https://github.com/golang/go.git "$GO_SRC"
          test "$(git -C "$GO_SRC" rev-parse HEAD)" = "$GO_COMMIT"
          pushd "$GO_SRC/src"
          ./make.bash
          popd

          echo "GOROOT=$GO_SRC" >> "$GITHUB_ENV"
          echo "$GO_SRC/bin" >> "$GITHUB_PATH"
          test "$("$GO_SRC/bin/go" env GOVERSION)" = "go${GO_VERSION}"
          test "$("$GO_SRC/bin/go" env GOTOOLCHAIN)" = "local"

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: >
            platforms;android-35
            platforms;android-36
            build-tools;36.0.0
            ndk;28.1.13356709

      - name: Prepare F-Droid-compatible source path
        run: |
          # Keep the exact detached Git objects with the source copy.  The
          # shared public driver proves that the checkout bytes still equal
          # HEAD^{tree} before it creates any build output.
          rsync -a --delete "$GITHUB_WORKSPACE/" "$FDROID_COMPAT_SOURCE_ROOT/"

      - name: Build and verify isolated unsigned APKs through the public driver
        working-directory: /home/vagrant/build/com.dobby.vpn
        env:
          DOBBYVPN_ANDROID_GO_CACHE: ${{ runner.temp }}/dobbyvpn-android-repro/first/go-cache
          DOBBYVPN_ANDROID_GO_TMPDIR: ${{ runner.temp }}/dobbyvpn-android-repro/first/go-tmp
        run: |
          set -euo pipefail
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          "$GITHUB_WORKSPACE/.github/scripts/android_build_driver.sh" \
            --source-root "$FDROID_COMPAT_SOURCE_ROOT" \
            --source-sha "$APP_SOURCE_SHA" \
            --output "$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v${version}-unsign.apk" \
            --test-companion-output "$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v${version}-android-test-companion-unsigned.apk" \
            --manifest "$FDROID_COMPAT_SOURCE_ROOT/runtime/android-build-driver-manifest.json" \
            --first-output "$FDROID_COMPAT_SOURCE_ROOT/runtime/android-repro-first.apk" \
            --reproducibility "$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v${version}-android-reproducibility.json" \
            --gradle-archive "$GRADLE_ARCHIVE" \
            --gradle-root "$GRADLE_ROOT" \
            --go-binary "$GOROOT/bin/go" \
            --source-repository "$APP_SOURCE_REPOSITORY"

      - name: Sign the verified unsigned APK
        working-directory: /home/vagrant/build/com.dobby.vpn
        run: |
          set -euo pipefail
          umask 077
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          unsigned="fastlane/DobbyVPN-v${version}-unsign.apk"
          signed="fastlane/DobbyVPN-v${version}-sign.apk"
          companion_unsigned="fastlane/DobbyVPN-v${version}-android-test-companion-unsigned.apk"
          companion_signed="fastlane/DobbyVPN-v${version}-android-test-companion.apk"
          test -f "$unsigned"
          test -f "$companion_unsigned"
          signing_dir="$(mktemp -d)"
          trap 'rm -f "$signing_dir/keystore.jks"; rmdir "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_FILE" | base64 --decode > "$signing_dir/keystore.jks"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$signing_dir/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed" \
            "$unsigned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$signing_dir/keystore.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$companion_signed" \
            "$companion_unsigned"
          verify_signer() {
            local apk=$1 label=$2 stdout_file stderr_file status
            stdout_file="$RUNNER_TEMP/${label}.apksigner.stdout"
            stderr_file="$RUNNER_TEMP/${label}.apksigner.stderr"
            set +e
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
              >"$stdout_file" 2>"$stderr_file"
            status=$?
            set -e
            cat "$stdout_file"
            cat "$stderr_file" >&2
            test "$status" -eq 0
          }
          verify_signer "$signed" signed
          verify_signer "$companion_signed" companion
          mapfile -t signer_digests < <(
            sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
              "$RUNNER_TEMP/signed.apksigner.stdout"
          )
          mapfile -t companion_signer_digests < <(
            sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' \
              "$RUNNER_TEMP/companion.apksigner.stdout"
          )
          test "${#signer_digests[@]}" -eq 1
          test "${signer_digests[0]}" = "$EXPECTED_ANDROID_SIGNER_SHA256"
          test "${#companion_signer_digests[@]}" -eq 1
          test "${companion_signer_digests[0]}" = "$EXPECTED_ANDROID_SIGNER_SHA256"
          test "${signer_digests[0]}" = "${companion_signer_digests[0]}"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}

      - name: Verify signed APK payload binding
        working-directory: /home/vagrant/build/com.dobby.vpn
        run: |
          set -euo pipefail
          version="${APP_MAJOR_VERSION}.${APP_MINOR_VERSION}.${APP_MAINTENANCE_VERSION}"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_android_reproducibility.py" verify-signed-payload \
            --unsigned-apk "fastlane/DobbyVPN-v${version}-unsign.apk" \
            --signed-apk "fastlane/DobbyVPN-v${version}-sign.apk"

      - name: Create Android source and digest provenance
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION_NAME: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
          VERSION_CODE: ${{ inputs.android_version_code }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

          signed="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-sign.apk"
          unsigned="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-unsign.apk"
          companion="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-android-test-companion.apk"
          reproducibility="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-android-reproducibility.json"
          driver_manifest="$FDROID_COMPAT_SOURCE_ROOT/runtime/android-build-driver-manifest.json"
          manifest="$FDROID_COMPAT_SOURCE_ROOT/fastlane/DobbyVPN-v$VERSION_NAME-android-provenance.json"
          test -f "$companion"

          SIGNED_APK="$signed" UNSIGNED_APK="$unsigned" COMPANION_APK="$companion" \
            REPRODUCIBILITY="$reproducibility" DRIVER_MANIFEST="$driver_manifest" MANIFEST="$manifest" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def artifact(kind: str, variable: str) -> dict[str, str]:
              path = Path(os.environ[variable])
              return {
                  "kind": kind,
                  "name": path.name,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          companion = Path(os.environ["COMPANION_APK"])

          document = {
              "schema": 1,
              "source_sha": os.environ["SOURCE_SHA"],
              "version_name": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "application_id": "com.dobby.vpn",
              "signer_certificate_sha256": os.environ["EXPECTED_ANDROID_SIGNER_SHA256"],
              "test_companion": {
                  "name": companion.name,
                  "sha256": hashlib.sha256(companion.read_bytes()).hexdigest(),
                  "bytes": companion.stat().st_size,
                  "application_id": "com.dobby.vpn.test",
                  "source_sha": os.environ["SOURCE_SHA"],
                  "signer_certificate_sha256": os.environ["EXPECTED_ANDROID_SIGNER_SHA256"],
              },
              "signed_payload_matches_unsigned": True,
              "build_driver": json.loads(
                  Path(os.environ["DRIVER_MANIFEST"]).read_text(encoding="utf-8")
              ),
              "reproducibility": json.loads(
                  Path(os.environ["REPRODUCIBILITY"]).read_text(encoding="utf-8")
              ),
              "artifacts": [
                  artifact("signed", "SIGNED_APK"),
                  artifact("unsigned", "UNSIGNED_APK"),
              ],
          }
          Path(os.environ["MANIFEST"]).write_text(
              json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-sign.apk
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-sign.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-unsign.apk
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-unsign.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Android test companion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-test-companion.apk
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-android-test-companion.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Android provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-android-provenance
          path: ${{ env.FDROID_COMPAT_SOURCE_ROOT }}/fastlane/DobbyVPN-v${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}-android-provenance.json
          if-no-files-found: error
          retention-days: 90
