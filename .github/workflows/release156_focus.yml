name: DIAGNOSTIC ONLY — Release 1.5.6 Android ADB transfer probe
run-name: DIAGNOSTIC ONLY / ADB transport fixture / ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adb_transfer:
    name: Diagnose hosted Android ADB file transfer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start shared job deadline and diagnostic directory
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$RUNNER_TEMP/dobbyvpn-release156-adb-transfer-$GITHUB_RUN_ID"
          mkdir -p "$RUN_DIR"
          printf 'RUN_DIR=%s\n' "$RUN_DIR" >> "$GITHUB_ENV"
          python3 -c 'import time; d=int(time.time())+480; print("RUN_DEADLINE_EPOCH="+str(d)); print("RUN_DEADLINE_EPOCH="+str(d))' >> "$GITHUB_ENV"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUN_DIR/run-start-utc.txt"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read authoritative Android SDK pins
        id: android_pins
        shell: bash
        run: |
          set -euo pipefail
          for pin in java_major android_sdk_platform android_build_tools android_ndk; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Install pinned JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.android_pins.outputs.java_major }}

      - name: Install pinned Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Run bounded transport fixture
        shell: bash
        env:
          ANDROID_SDK_PLATFORM: ${{ steps.android_pins.outputs.android_sdk_platform }}
          ANDROID_BUILD_TOOLS: ${{ steps.android_pins.outputs.android_build_tools }}
          ANDROID_NDK: ${{ steps.android_pins.outputs.android_ndk }}
          JAVA_MAJOR: ${{ steps.android_pins.outputs.java_major }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import os
          import re
          import shutil
          import signal
          import subprocess
          import sys
          import time
          import traceback
          from pathlib import Path

          run_dir = Path(os.environ["RUN_DIR"])
          log_dir = run_dir / "logs"
          avd_home = run_dir / "android-home" / ".android" / "avd"
          run_dir.mkdir(parents=True, exist_ok=True)
          log_dir.mkdir(parents=True, exist_ok=True)
          deadline = float(os.environ["RUN_DEADLINE_EPOCH"])
          sequence = 0
          active = {}
          failures = []
          cleanup_errors = []
          emulator_pid = None
          server = None
          trace = None
          logcat = None
          stream = None
          env = os.environ.copy()
          env.update({"ANDROID_SDK_HOME": str(run_dir / "android-home"),
                      "ANDROID_USER_HOME": str(run_dir / "android-home" / ".android"),
                      "ANDROID_AVD_HOME": str(avd_home), "ADB_TRACE": "all"})

          class ProbeFailure(RuntimeError):
              pass

          def remaining():
              value = deadline - time.time()
              if value <= 0:
                  raise ProbeFailure("shared job work deadline expired")
              return value

          def record_output(name, stdout, stderr):
              (log_dir / (name + ".stdout.log")).write_bytes(stdout)
              (log_dir / (name + ".stderr.log")).write_bytes(stderr)
              sys.stdout.buffer.write(stdout); sys.stdout.buffer.flush()
              sys.stderr.buffer.write(stderr); sys.stderr.buffer.flush()

          def run(name, argv, check=True, timeout=None, command_env=None):
              global sequence
              sequence += 1
              label = f"{sequence:03d}-{name}"
              try:
                  result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      env=command_env or env, timeout=min(remaining(), timeout or remaining()), check=False)
              except subprocess.TimeoutExpired as exc:
                  out = exc.stdout or b""; err = exc.stderr or b""
                  record_output(label, out, err)
                  failures.append(f"{name} timed out")
                  raise ProbeFailure(f"{name} timed out") from exc
              record_output(label, result.stdout, result.stderr)
              if check and result.returncode:
                  failures.append(f"{name} exited {result.returncode}")
                  raise ProbeFailure(f"{name} exited {result.returncode}")
              return result

          def start(name, argv, stdout_path=None, stderr_path=None, command_env=None):
              remaining()
              out = (log_dir / (name + ".stdout.log")).open("wb") if stdout_path is None else Path(stdout_path).open("wb")
              err = (log_dir / (name + ".stderr.log")).open("wb") if stderr_path is None else Path(stderr_path).open("wb")
              try:
                  proc = subprocess.Popen(argv, stdout=out, stderr=err, env=command_env or env, start_new_session=True)
              except Exception:
                  out.close(); err.close(); raise
              active[name] = (proc, out, err)
              return proc

          def stop(name, budget=5):
              item = active.pop(name, None)
              if not item:
                  return
              proc, out, err = item
              stop_end = min(recovery_end, time.monotonic() + max(0, budget))
              if proc.poll() is None:
                  os.killpg(proc.pid, signal.SIGTERM)
                  try: proc.wait(timeout=max(0, stop_end - time.monotonic()))
                  except subprocess.TimeoutExpired:
                      os.killpg(proc.pid, signal.SIGKILL)
                      try: proc.wait(timeout=max(0, recovery_end - time.monotonic()))
                      except subprocess.TimeoutExpired: cleanup_errors.append(f"could not stop {name}")
              out.close(); err.close()
              print(f"stopped {name}: returncode={proc.returncode}")
              for channel in ("stdout", "stderr"):
                  path = log_dir / (name + "." + channel + ".log")
                  if path.exists():
                      with path.open("rb") as source:
                          shutil.copyfileobj(source, sys.stdout.buffer if channel == "stdout" else sys.stderr.buffer)

          def adb(*args, **kwargs):
              return run("adb-" + "-".join(re.sub(r"[^a-zA-Z0-9]+", "_", x) for x in args[:2]),
                         ["adb", *args], **kwargs)

          def capture_sockets(label):
              result = run(label, ["ss", "-tnp"], check=False, timeout=10)
              return result.returncode

          def guest_file(path, size):
              adb("shell", f"head -c {size} /dev/urandom > {path}")
              size_out = adb("shell", "stat", "-c", "%s", path).stdout.decode().strip()
              hash_out = adb("shell", "sha256sum", path).stdout.decode().split()[0]
              if int(size_out) != size:
                  raise ProbeFailure(f"guest fixture size mismatch for {path}: {size_out}")
              return {"path": path, "size": size, "sha256": hash_out}

          def pull(condition, fixture, index):
              dest = run_dir / f"{condition}-{index:02d}-{Path(fixture['path']).name}"
              label = f"{condition}-{index:02d}"
              capture_sockets(label + "-sockets-before")
              if condition == "default-pull":
                  result = run(label, ["adb", "pull", fixture["path"], str(dest)], check=False)
              elif condition == "pull-no-compression":
                  result = run(label, ["adb", "pull", "-Z", fixture["path"], str(dest)], check=False)
              elif condition == "pull-lz4":
                  result = run(label, ["adb", "pull", "-z", "lz4", fixture["path"], str(dest)], check=False)
              else:
                  sequence_name = label + "-exec-out"
                  sequence_num = len(list(log_dir.glob("*-exec-out.stdout.log"))) + 1
                  try:
                      with dest.open("wb") as output:
                          proc = subprocess.run(["adb", "exec-out", "cat", fixture["path"]],
                              stdout=output, stderr=subprocess.PIPE, env=env,
                              timeout=remaining(), check=False)
                      (log_dir / f"{sequence_num:03d}-{sequence_name}.stderr.log").write_bytes(proc.stderr)
                      sys.stderr.buffer.write(proc.stderr); sys.stderr.buffer.flush()
                      result = proc
                  except subprocess.TimeoutExpired as exc:
                      err = exc.stderr or b""
                      (log_dir / f"{sequence_num:03d}-{sequence_name}.stderr.log").write_bytes(err)
                      raise ProbeFailure(f"{sequence_name} timed out") from exc
              if result.returncode != 0:
                  raise ProbeFailure(f"{label} exited {result.returncode}")
              data = dest.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != fixture["size"] or digest != fixture["sha256"]:
                  raise ProbeFailure(f"{label} mismatch: size={len(data)} sha256={digest}")
              return {"transfer": index, "size": len(data), "sha256": digest, "result": "pass"}

          try:
              sdk_root = Path(os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"])
              sdkmanager = shutil.which("sdkmanager")
              if not sdkmanager:
                  raise ProbeFailure("sdkmanager is not on PATH after pinned setup-android")
              emulator_bin = sdk_root / "emulator" / "emulator"
              packages = ["platform-tools", f"platforms;{os.environ['ANDROID_SDK_PLATFORM']}",
                          f"build-tools;{os.environ['ANDROID_BUILD_TOOLS']}", "emulator",
                          "system-images;android-35;google_apis;x86_64"]
              run("apt-get-update", ["sudo", "-n", "apt-get", "update"], timeout=None)
              run("apt-get-install-runtime", ["sudo", "-n", "apt-get", "install", "-y", "strace", "libpulse0"], timeout=None)
              run("sdkmanager-install", [str(sdkmanager), "--install", *packages], timeout=None)
              run("sdkmanager-version", [str(sdkmanager), "--version"])
              run("sdkmanager-installed-packages", [str(sdkmanager), "--list_installed"])
              run("java-version", ["java", "-version"])
              adb_version = run("adb-version", ["adb", "version"]).stdout.decode(errors="replace")
              if "37.0.1-15733141" not in adb_version:
                  raise ProbeFailure("ADB differs from failed hosted runtime37.0.1-15733141")
              emu_version = run("emulator-version", [str(emulator_bin), "-version"]).stdout.decode(errors="replace")
              if not re.search(r"Android emulator version 37\.2\.12\.0(?:\s|$)", emu_version):
                  raise ProbeFailure("emulator differs from failed hosted runtime37.2.12.0; see version logs")
              avd_home.mkdir(parents=True, exist_ok=True)
              run("avd-create", ["avdmanager", "create", "avd", "--force", "--name", "dobbyvpn-release",
                   "--package", "system-images;android-35;google_apis;x86_64", "--device", "pixel_2"])
              run("avd-list", [str(emulator_bin), "-list-avds"])
              run("kvm-owner", ["sudo", "-n", "chown", str(os.getuid()), "/dev/kvm"])
              run("emulator-acceleration-check", [str(emulator_bin), "-accel-check"])
              listener = run("adb-port-check", ["ss", "-H", "-ltnp", "sport = :5037"], check=False)
              if listener.stdout.strip():
                  raise ProbeFailure("ADB port 5037 is already occupied; refusing to take over an unowned server")
              server = start("adb-server-traced", ["adb", "nodaemon", "server"])
              deadline_poll = remaining()
              end = time.monotonic() + deadline_poll
              while time.monotonic() < end:
                  if server.poll() is not None:
                      raise ProbeFailure("owned foreground ADB server exited before readiness")
                  result = run("adb-server-ready", ["ss", "-H", "-ltnp", "sport = :5037"], check=False, timeout=remaining())
                  if result.returncode == 0 and result.stdout.strip():
                      break
                  time.sleep(min(1, max(0, end - time.monotonic())))
              else:
                  raise ProbeFailure("owned foreground ADB server did not become ready")
              emulator = start("emulator", [str(emulator_bin), "-avd", "dobbyvpn-release",
                  "-debug", "init,adb,adbserver,adbclient,log", "-no-window", "-no-audio",
                  "-no-boot-anim", "-no-snapshot"])
              emulator_pid = emulator.pid
              adb("wait-for-device", timeout=remaining())
              boot_end = time.monotonic() + remaining()
              while time.monotonic() < boot_end:
                  state = adb("shell", "getprop", "sys.boot_completed", check=False, timeout=remaining())
                  if state.returncode == 0 and state.stdout.strip() == b"1":
                      break
                  time.sleep(min(2, max(0, boot_end - time.monotonic())))
              else:
                  raise ProbeFailure("emulator boot readiness deadline expired")
              adb("root", timeout=remaining())
              root_end = time.monotonic() + remaining()
              while time.monotonic() < root_end:
                  identity = adb("shell", "id", check=False, timeout=remaining())
                  if identity.returncode == 0 and b"uid=0" in identity.stdout:
                      break
                  time.sleep(min(2, max(0, root_end - time.monotonic())))
              else:
                  raise ProbeFailure("emulator did not become root-ready")
              for prop in ("ro.build.version.release", "ro.build.version.sdk", "ro.build.fingerprint", "ro.product.cpu.abi"):
                  adb("shell", "getprop", prop)
              trace_path = log_dir / "emulator-network.strace.log"
              trace = start("strace-attach", ["sudo", "-n", "strace", "-f", "-e", "trace=network,close",
                  "-s", "256", "-ttt", "-p", str(emulator_pid), "-o", str(trace_path)])
              time.sleep(1)
              if trace.poll() is not None:
                  err = (log_dir / "strace-attach.stderr.log").read_bytes()
                  print("strace attachment failed: " + err.decode(errors="replace"), file=sys.stderr)
                  failures.append("strace attach failed; no trace is claimed")
              logcat = start("live-logcat", ["adb", "logcat", "-v", "epoch"])
              stream = start("long-lived-adb-shell", ["adb", "shell", "while true; do echo adb-stream; sleep 1; done"])
              fixtures = [guest_file("/data/local/tmp/dobbyvpn-transfer-384k.bin", 384 * 1024),
                          guest_file("/data/local/tmp/dobbyvpn-transfer-1m.bin", 1024 * 1024)]
              summary = {"emulator_pid": emulator_pid, "system_image": "system-images;android-35;google_apis;x86_64",
                         "emulator_version": emu_version.strip(), "sdk_packages": packages,
                         "fixtures": fixtures, "conditions": {}}
              for condition in ("default-pull", "pull-no-compression", "pull-lz4", "exec-out-cat"):
                  results = []
                  summary["conditions"][condition] = results
                  for index in range(1, 11):
                      fixture = fixtures[(index - 1) % len(fixtures)]
                      try:
                          results.append(pull(condition, fixture, index))
                      except Exception as exc:
                          traceback.print_exc()
                          capture_sockets(condition + f"-sockets-after-failure-{index}")
                          results.append({"transfer": index, "result": "fail", "error": str(exc)})
                          failures.append(f"{condition} stopped at first failure: {exc}")
                          break
              (run_dir / "transfer-summary.json").write_text(__import__("json").dumps(summary, indent=2) + "\n")
          except Exception as exc:
              traceback.print_exc()
              print(f"ADB transfer fixture failed: {exc}", file=sys.stderr)
              if not failures:
                  failures.append(str(exc))
          finally:
              recovery_end = time.monotonic() + 30
              for name in ("long-lived-adb-shell", "live-logcat", "strace-attach"):
                  try: stop(name, budget=max(0, min(5, recovery_end - time.monotonic())))
                  except Exception as exc: cleanup_errors.append(f"stop {name}: {exc}")
              try: stop("emulator", budget=max(0, min(5, recovery_end - time.monotonic())))
              except Exception as exc: cleanup_errors.append(f"stop emulator: {exc}")
              try: stop("adb-server-traced", budget=max(0, min(5, recovery_end - time.monotonic())))
              except Exception as exc: cleanup_errors.append(f"stop ADB server: {exc}")
              try:
                  result = subprocess.run(["avdmanager", "delete", "avd", "--name", "dobbyvpn-release"],
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env,
                      timeout=max(0, min(10, recovery_end - time.monotonic())), check=False)
                  record_output("cleanup-delete-avd", result.stdout, result.stderr)
                  if result.returncode:
                      cleanup_errors.append(f"delete AVD exited {result.returncode}")
              except Exception as exc: cleanup_errors.append(f"delete AVD: {exc}")
              if (run_dir / "android-home").exists():
                  try:
                      result = subprocess.run(["rm", "-rf", "--", str(run_dir / "android-home")],
                          stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                          timeout=max(0, recovery_end - time.monotonic()), check=False)
                      record_output("cleanup-remove-avd-home", result.stdout, result.stderr)
                      if result.returncode:
                          cleanup_errors.append(f"remove AVD home exited {result.returncode}")
                  except Exception as exc: cleanup_errors.append(f"remove AVD home: {exc}")
              if cleanup_errors:
                  (run_dir / "cleanup-errors.txt").write_text("\n".join(cleanup_errors) + "\n")
                  print("Cleanup errors: " + "; ".join(cleanup_errors), file=sys.stderr)
          if failures or cleanup_errors:
              sys.exit(1)
          print("All four ADB transfer conditions completed 10 byte-verified transfers each.")
          PYTHON

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release156-adb-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/dobbyvpn-release156-adb-transfer-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 1
