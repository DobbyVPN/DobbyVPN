name: Desktop Build

on:
  workflow_call:
    secrets:
      CONVEYOR_PASSPHRASE:
        required: true
      CONVEYOR_SIGNING_KEY:
        required: true
    inputs:
      source_sha:
        description: Full lowercase 40-character source commit SHA to build.
        type: string
        required: true
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true

jobs:
  desktop_build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $actual_sha, expected $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Download Windows gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: windows_grpcvpnserver.exe
          path: kmp_module/services

      - name: Download Linux gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: ubuntu_grpcvpnserver
          path: kmp_module/services

      - name: Add permissions to ubuntu service executable
        working-directory: kmp_module/services
        run: |
          chmod +x ubuntu_grpcvpnserver

      - name: Download macOS arm64 gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: macos_grpcvpnserver-arm64
          path: kmp_module/services

      - name: Download macOS amd64 gRPC vpn service
        uses: actions/download-artifact@v8
        with:
          name: macos_grpcvpnserver-amd64
          path: kmp_module/services/macos-amd64

      - name: Verify staged macOS gRPC vpn services
        working-directory: kmp_module/services
        run: |
          chmod +x macos_grpcvpnserver macos-amd64/macos_grpcvpnserver

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            kmp_module/**/*.gradle.kts
            kmp_module/gradle/libs.versions.toml
            kmp_module/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >
            platforms;android-35
            platforms;android-36
            build-tools;36.0.0

      - name: Build desktop via script
        run: |
          python .github/scripts/desktop_build.py app --skip-libs --require-all-services
        env:
          APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
          APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
          APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
          APPLE_BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Cache Conveyor downloads
        uses: actions/cache@v5
        with:
          path: .conveyor/cache
          key: conveyor-${{ runner.os }}-${{ hashFiles('kmp_module/conveyor.conf', 'kmp_module/**/*.gradle.kts', 'kmp_module/gradle/libs.versions.toml') }}
          restore-keys: |
            conveyor-${{ runner.os }}-

      - name: Conveyor build site
        uses: hydraulic-software/conveyor/actions/build@v16.0
        env:
          OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_MAJOR_VERSION: ${{ inputs.app_major_version }}
          APP_MINOR_VERSION: ${{ inputs.app_minor_version }}
          APP_MAINTENANCE_VERSION: ${{ inputs.app_maintenance_version }}
        with:
          command: make site
          extra_flags: "--passphrase=\"${{ secrets.CONVEYOR_PASSPHRASE }}\" -f kmp_module/conveyor.conf"
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1

      - name: Find files
        id: find_deb
        env:
          EXPECTED_VERSION: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
        run: |
          set -euo pipefail
          deb_file="./output/dobby-vpn_${EXPECTED_VERSION}_amd64.deb"
          mac_aarch64_file="./output/dobby-vpn-${EXPECTED_VERSION}-mac-aarch64.zip"
          mac_amd64_file="./output/dobby-vpn-${EXPECTED_VERSION}-mac-amd64.zip"
          win_zip_file="./output/dobby-vpn-${EXPECTED_VERSION}-windows-amd64.zip"
          for artifact in "$deb_file" "$mac_aarch64_file" "$mac_amd64_file" "$win_zip_file"; do
            test -f "$artifact"
          done
          test "$(dpkg-deb -f "$deb_file" Version)" = "$EXPECTED_VERSION"
          {
            echo "DEB_FILE=$deb_file"
            echo "MAC_AARCH64_FILE=$mac_aarch64_file"
            echo "MAC_AMD64_FILE=$mac_amd64_file"
            echo "WIN_ZIP_FILE=$win_zip_file"
          } >> "$GITHUB_ENV"

      - name: Verify Debian service runtime closure
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          trap 'rm -rf "$package_root"' EXIT
          dpkg-deb -x "${{ env.DEB_FILE }}" "$package_root"
          service="$package_root/opt/dobbyvpn/lib/app/ubuntu_grpcvpnserver"
          unit="$package_root/usr/local/lib/systemd/system/dobbyvpn.service"
          test -x "$service"
          test -f "$unit"
          grep -Fx 'Environment=LD_LIBRARY_PATH=/opt/dobbyvpn/lib/runtime/lib' "$unit"
          LD_LIBRARY_PATH="$package_root/opt/dobbyvpn/lib/runtime/lib" ldd "$service" > "$package_root/ldd.txt"
          if grep -F 'not found' "$package_root/ldd.txt"; then
            echo 'Debian service has an unresolved runtime library' >&2
            exit 1
          fi

      - name: Verify Windows GUI and CLI launcher subsystems
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          trap 'rm -rf "$package_root"' EXIT
          unzip -q "${{ env.WIN_ZIP_FILE }}" -d "$package_root"
          python3 - "$package_root" <<'PY'
          from pathlib import Path
          import struct
          import sys

          root = Path(sys.argv[1])

          def single(name: str) -> Path:
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {name}, found {len(matches)}")
              return matches[0]

          def subsystem(path: Path) -> int:
              data = path.read_bytes()
              if data[:2] != b"MZ" or len(data) < 0x40:
                  raise SystemExit(f"{path.name} is not a PE executable")
              offset = struct.unpack_from("<I", data, 0x3C)[0]
              if data[offset:offset + 4] != b"PE\0\0":
                  raise SystemExit(f"{path.name} has an invalid PE header")
              return struct.unpack_from("<H", data, offset + 4 + 20 + 68)[0]

          if subsystem(single("Dobby Vpn.exe")) != 2:
              raise SystemExit("Dobby Vpn.exe must remain a GUI launcher")
          if subsystem(single("dobby-cli.exe")) != 3:
              raise SystemExit("dobby-cli.exe must be a console launcher")
          PY

      - name: Rename files
        run: |
          mkdir upload
          cp "${{ env.DEB_FILE }}" upload/dobbyVPN-linux.deb
          cp "${{ env.MAC_AARCH64_FILE }}" upload/dobbyVPN-macos-aarch64.zip
          cp "${{ env.MAC_AMD64_FILE }}" upload/dobbyVPN-macos-amd64.zip
          cp "${{ env.WIN_ZIP_FILE }}" upload/dobbyVPN-windows.zip

      - name: Upload Debian
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-linux.deb
          path: upload/dobbyVPN-linux.deb
          if-no-files-found: error

      - name: Upload zip for macOS aarch64
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-macos-aarch64.zip
          path: upload/dobbyVPN-macos-aarch64.zip
          if-no-files-found: error

      - name: Upload zip for macOS amd64
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-macos-amd64.zip
          path: upload/dobbyVPN-macos-amd64.zip
          if-no-files-found: error

      - name: Upload Windows zip
        uses: actions/upload-artifact@v7
        with:
          name: dobbyVPN-windows.zip
          path: upload/dobbyVPN-windows.zip
          if-no-files-found: error

      - name: Display file tree with sizes after Windows build
        run: |
          echo "Displaying the size of files and directories in 'output' directory:"
          du -ah output | sort -rh
