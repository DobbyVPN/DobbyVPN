name: Desktop Build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full lowercase 40-character source commit SHA to build.
        type: string
        required: true
      app_major_version:
        type: string
        required: true
      app_minor_version:
        type: string
        required: true
      app_maintenance_version:
        type: string
        required: true

jobs:
  desktop_build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download Windows backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobbyvpn-backend-windows-amd64
          path: runtime/services/windows-amd64
      - name: Download Windows CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-cli-windows-amd64
          path: runtime/services/windows-amd64
      - name: Download Windows frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-native-ui-windows-amd64
          path: runtime/services/windows-amd64/frontend

      - name: Download Linux backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobbyvpn-backend-linux-amd64
          path: runtime/services/linux-amd64
      - name: Download Linux CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-cli-linux-amd64
          path: runtime/services/linux-amd64

      - name: Download macOS arm64 backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobbyvpn-backend-macos-arm64
          path: runtime/services/macos-arm64
      - name: Download macOS arm64 CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-cli-macos-arm64
          path: runtime/services/macos-arm64
      - name: Download macOS arm64 frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-native-ui-macos-arm64
          path: runtime/services/macos-arm64

      - name: Download macOS amd64 backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobbyvpn-backend-macos-amd64
          path: runtime/services/macos-amd64
      - name: Download macOS amd64 CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-cli-macos-amd64
          path: runtime/services/macos-amd64
      - name: Download macOS amd64 frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dobby-native-ui-macos-amd64
          path: runtime/services/macos-amd64

      - name: Restore Unix executable modes and verify staged closure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x runtime/services/linux-amd64/dobbyvpn-backend runtime/services/linux-amd64/dobby-cli
          chmod +x runtime/services/macos-arm64/dobbyvpn-backend runtime/services/macos-arm64/dobby-cli runtime/services/macos-arm64/DobbyVPNMacApp
          chmod +x runtime/services/macos-amd64/dobbyvpn-backend runtime/services/macos-amd64/dobby-cli runtime/services/macos-amd64/DobbyVPNMacApp runtime/services/macos-amd64/trusttunnel_client
          python3 .github/scripts/desktop_build.py app --skip-libs --require-all-services

      - name: Assemble native desktop archives
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 .github/scripts/package_desktop.py \
            --version "${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}" \
            --staging-root runtime/services \
            --output output

      - name: Verify package outputs and runtime closure
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.app_major_version }}.${{ inputs.app_minor_version }}.${{ inputs.app_maintenance_version }}
        run: |
          set -euo pipefail
          deb_file="output/dobby-vpn_${EXPECTED_VERSION}_amd64.deb"
          mac_aarch64_file="output/dobby-vpn-${EXPECTED_VERSION}-mac-aarch64.zip"
          mac_amd64_file="output/dobby-vpn-${EXPECTED_VERSION}-mac-amd64.zip"
          win_zip_file="output/dobby-vpn-${EXPECTED_VERSION}-windows-amd64.zip"
          for artifact in "$deb_file" "$mac_aarch64_file" "$mac_amd64_file" "$win_zip_file"; do test -f "$artifact"; done
          test "$(dpkg-deb -f "$deb_file" Version)" = "$EXPECTED_VERSION"

          package_root="$(mktemp -d)"
          trap 'rm -rf "$package_root"' EXIT
          dpkg-deb -x "$deb_file" "$package_root/debian"
          service="$package_root/debian/opt/dobbyvpn/bin/dobbyvpn-backend"
          unit="$package_root/debian/usr/lib/systemd/system/dobbyvpn.service"
          test -x "$service"; test -f "$unit"
          grep -Fx 'ExecStart=/opt/dobbyvpn/bin/dobbyvpn-backend' "$unit"
          LD_LIBRARY_PATH="$package_root/debian/opt/dobbyvpn/lib" ldd "$service" > "$package_root/ldd.txt"
          if grep -F 'not found' "$package_root/ldd.txt"; then
            cat "$package_root/ldd.txt" >&2
            exit 1
          fi

          mkdir "$package_root/windows"
          unzip "$win_zip_file" -d "$package_root/windows"
          python3 - "$package_root/windows" <<'PY'
          from pathlib import Path
          import struct
          import sys
          root = Path(sys.argv[1])
          def one(name: str) -> Path:
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {name}, found {len(matches)}")
              return matches[0]
          def subsystem(path: Path) -> int:
              data = path.read_bytes()
              if data[:2] != b"MZ" or len(data) < 0x40:
                  raise SystemExit(f"{path.name} is not a PE executable")
              offset = struct.unpack_from("<I", data, 0x3C)[0]
              if data[offset:offset + 4] != b"PE\0\0":
                  raise SystemExit(f"{path.name} has an invalid PE header")
              return struct.unpack_from("<H", data, offset + 4 + 20 + 68)[0]
          if subsystem(one("DobbyVPN.exe")) != 2:
              raise SystemExit("DobbyVPN.exe must be a Windows GUI application")
          if subsystem(one("dobby-cli.exe")) != 3:
              raise SystemExit("dobby-cli.exe must be a console application")
          one("dobbyvpn-backend.exe")
          one("dobby_bridge.dll")
          one("wintun.dll")
          PY

          mkdir upload
          cp "$deb_file" upload/dobbyVPN-linux.deb
          cp "$mac_aarch64_file" upload/dobbyVPN-macos-aarch64.zip
          cp "$mac_amd64_file" upload/dobbyVPN-macos-amd64.zip
          cp "$win_zip_file" upload/dobbyVPN-windows.zip

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyVPN-linux.deb
          path: upload/dobbyVPN-linux.deb
          if-no-files-found: error
          retention-days: 90
      - name: Upload macOS arm64 archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyVPN-macos-aarch64.zip
          path: upload/dobbyVPN-macos-aarch64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload macOS amd64 archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyVPN-macos-amd64.zip
          path: upload/dobbyVPN-macos-amd64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload Windows archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyVPN-windows.zip
          path: upload/dobbyVPN-windows.zip
          if-no-files-found: error
          retention-days: 90
