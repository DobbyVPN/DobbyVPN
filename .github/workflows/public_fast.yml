name: Fast behavioral tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast behavioral tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check public Go behavior
        working-directory: core
        env:
          GOTOOLCHAIN: local
        run: go test -race -count=1 -tags=ci -p 2 ./protocol ./sessionapi ./outline

  macos_pf:
    name: macOS pf rules (pfctl parse and load)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache: false
      # Parses the rules with pfctl -n, then loads them into the top-level
      # anchor dobbyvpn-ci, which the main ruleset never evaluates, checks the
      # kernel table size and flushes the anchor. Runner only.
      - name: Parse and load generated kill switch rules with pfctl
        working-directory: core
        env:
          GOTOOLCHAIN: local
          DOBBY_PFCTL_PARSE: "1"
          DOBBY_PFCTL_LOAD: "1"
        run: go test -count=1 -run '^TestMacOSPFRulesParseWithPfctl$' -v ./routing
