name: Release installer migration qualification

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      architecture:
        required: true
        type: string
      version_name:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  migration:
    name: Installer migration / ${{ inputs.platform }} / ${{ inputs.architecture }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || inputs.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 20
    steps:
      - name: Reject Release reruns
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dobbyVPN-${{ inputs.platform }}-${{ inputs.platform == 'windows' && 'amd64.msi' || inputs.architecture == 'arm64' && 'aarch64.pkg' || 'amd64.pkg' }}
          path: ${{ runner.temp }}/dobbyvpn-installer-migration/package

      - name: Qualify fresh install, upgrade, rollback, and final uninstall
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version_name }}
          PLATFORM: ${{ inputs.platform }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          case "$PLATFORM:$ARCHITECTURE" in
            windows:amd64) package=dobbyVPN-windows-amd64.msi ;;
            macos:arm64) package=dobbyVPN-macos-aarch64.pkg ;;
            macos:amd64) package=dobbyVPN-macos-amd64.pkg ;;
            *) exit 1 ;;
          esac
          python3 .github/scripts/desktop/installer_migration.py \
            --platform "$PLATFORM" \
            --package "$RUNNER_TEMP/dobbyvpn-installer-migration/package/$package" \
            --current-version "$EXPECTED_VERSION" \
            --log-dir "$RUNNER_TEMP/dobbyvpn-installer-migration/logs"

      - name: Remove migration temporary state
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/dobbyvpn-installer-migration"
