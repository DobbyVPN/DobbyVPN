name: Release hosted mini platform

on:
  workflow_call:
    inputs:
      platform:
        description: Platform to qualify.
        required: true
        type: string
      render_artifact_name:
        description: Artifact containing the shared Render VPN profile.
        required: true
        type: string

jobs:
  qualification:
    name: Release hosted mini / ${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || inputs.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PLATFORM: ${{ inputs.platform }}
      DOBBYVPN_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Reject Release reruns before package qualification
        shell: bash
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "Release reruns are unsupported; dispatch a fresh Release workflow." >&2
            exit 1
          fi

      - name: Check out Release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Linux package
        if: inputs.platform == 'linux'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dobbyVPN-linux.deb
          path: release-packages
      - name: Download Windows package
        if: inputs.platform == 'windows'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: dobbyVPN-windows-amd64.msi
          path: release-packages
      - name: Download macOS packages
        if: inputs.platform == 'macos'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: dobbyVPN-macos-*.pkg
          path: release-packages
          merge-multiple: true
      - name: Download Android packages
        if: inputs.platform == 'android'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: dobbyvpn-android-*.apk
          path: release-packages
          merge-multiple: true
      - name: Download shared Render VPN profile
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ inputs.render_artifact_name }}
          path: render

      - name: Initialize runner-local qualification paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RESULT_DIR=$RUNNER_TEMP/dobbyvpn-release-result"
            echo "RUN_DIR=$RUNNER_TEMP/dobbyvpn-release-run"
            echo "ARTIFACT_DIR=$RUNNER_TEMP/dobbyvpn-release-diagnostics"
            echo "RESULT_PATH=$RUNNER_TEMP/dobbyvpn-release-result/functional-result.json"
          } >> "$GITHUB_ENV"
          if [ "$PLATFORM" = linux ]; then
            echo "CONTROL_DIR=$RUNNER_TEMP/dobbyvpn-release-control" >> "$GITHUB_ENV"
          fi

      - name: Check package and prepare qualification directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR" "$RUN_DIR"
          if [ "$PLATFORM" = linux ]; then
            mkdir -p "$CONTROL_DIR"
          fi
          case "$PLATFORM" in linux|windows|macos|android) ;; *) exit 1 ;; esac
          [[ "$DOBBYVPN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DOBBYVPN_COMMIT_SHA"
          test -s "$GITHUB_WORKSPACE/render/profile.toml"
          case "$PLATFORM" in
            linux) test -f "$GITHUB_WORKSPACE/release-packages/dobbyVPN-linux.deb" ;;
            windows) test -f "$GITHUB_WORKSPACE/release-packages/dobbyVPN-windows-amd64.msi" ;;
            macos) test -f "$GITHUB_WORKSPACE/release-packages/dobbyVPN-macos-aarch64.pkg" ;;
            android) test "$(find "$GITHUB_WORKSPACE/release-packages" -maxdepth 1 -name 'DobbyVPN-*-sign.apk' -type f | wc -l)" -eq 1; test "$(find "$GITHUB_WORKSPACE/release-packages" -maxdepth 1 -name 'DobbyVPN-*-android-test-companion.apk' -type f | wc -l)" -eq 1 ;;
            *) exit 1 ;;
          esac
          deadline="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/render/deadline_epoch.txt")"
          [[ "$deadline" =~ ^[0-9]+$ ]]
          printf 'RUN_DEADLINE_EPOCH=%s\n' "$deadline" >> "$GITHUB_ENV"

      - name: Install Android tooling for the exact Release APKs
        if: inputs.platform == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools

      - name: Install the exact native Release package
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              sudo -n dpkg -i "$GITHUB_WORKSPACE/release-packages/dobbyVPN-linux.deb"
              mapfile -t cli_matches < <(find /opt/dobbyvpn -xdev -type f -name dobby-cli -perm -0100)
              mapfile -t service_matches < <(find /opt/dobbyvpn -xdev -type f -name dobbyvpn-backend -perm -0100)
              test "${#cli_matches[@]}" -eq 1; test "${#service_matches[@]}" -eq 1
              printf 'CLI=%s\nSERVICE=%s\nSERVICE_SOCKET=%s\nSERVICE_LIBRARY_PATH=%s\n' \
                "${cli_matches[0]}" "${service_matches[0]}" "$CONTROL_DIR/control.sock" /opt/dobbyvpn/lib >> "$GITHUB_ENV"
              ;;
            windows)
              package="$GITHUB_WORKSPACE/release-packages/dobbyVPN-windows-amd64.msi"
              PACKAGE_WIN="$(cygpath -w "$package")"
              export PACKAGE_WIN
              installed_paths="$(powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$ErrorActionPreference="Stop"; $p=Start-Process msiexec.exe -ArgumentList @("/i", "`"$env:PACKAGE_WIN`"", "/qn", "/norestart") -Wait -PassThru; if ($p.ExitCode -ne 0) { throw "msiexec failed" }; $root="$env:ProgramFiles\DobbyVPN"; $cli=Get-ChildItem $root -Filter "dobby-cli.exe" -Recurse -File; $service=Get-ChildItem $root -Filter "dobbyvpn-backend.exe" -Recurse -File; $ui=Join-Path $root "bin\DobbyVPN.exe"; if ($cli.Count -ne 1 -or $service.Count -ne 1 -or -not (Test-Path $ui)) { throw "installed closure is ambiguous" }; Write-Output ("$($cli[0].FullName)|$($service[0].FullName)|$ui")')"
              IFS='|' read -r cli service ui_binary <<< "${installed_paths//$'\r'/}"
              cli="$(cygpath "$cli")"; service="$(cygpath "$service")"; ui_binary="$(cygpath "$ui_binary")"
              printf 'CLI=%s\nSERVICE=%s\nUI_BINARY=%s\nSERVICE_PIPE=DobbyVPN.Control\n' "$cli" "$service" "$ui_binary" >> "$GITHUB_ENV"
              ;;
            macos)
              case "$(uname -m)" in arm64) package=dobbyVPN-macos-aarch64.pkg ;; x86_64) package=dobbyVPN-macos-amd64.pkg ;; *) exit 1 ;; esac
              sudo -n env \
                "DOBBYVPN_CONTROL_PEER_UID=$(id -u)" \
                "DOBBY_LOG_PATH=$RUN_DIR/service.log" \
                installer -pkg "$GITHUB_WORKSPACE/release-packages/$package" -target /
              printf 'CLI=%s\nSERVICE=%s\nUI_BINARY=%s\nSERVICE_SOCKET=%s\n' "/Applications/Dobby VPN.app/Contents/Resources/dobby-cli" "/Applications/Dobby VPN.app/Contents/Resources/dobbyvpn-backend" "/Applications/Dobby VPN.app/Contents/MacOS/DobbyVPNMacApp" "/var/run/dobbyvpn/control.sock" >> "$GITHUB_ENV"
              test -x "/Applications/Dobby VPN.app/Contents/Resources/dobby-cli"
              test -x "/Applications/Dobby VPN.app/Contents/Resources/dobbyvpn-backend"
              ;;
            android)
              sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is unavailable}}"
              sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
              emulator_bin="$sdk_root/emulator/emulator"
              test -x "$emulator_bin"
              android_sdk_home="$RUNNER_TEMP/dobbyvpn-android"
              export ANDROID_SDK_HOME="$android_sdk_home"
              export ANDROID_USER_HOME="$android_sdk_home/.android"
              export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
              mkdir -p "$ANDROID_AVD_HOME"
              printf 'Android AVD home: %s\n' "$ANDROID_AVD_HOME"
              avdmanager create avd --force --name dobbyvpn-release --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
              test -s "$ANDROID_AVD_HOME/dobbyvpn-release.ini"
              avd_list_stdout="$RUN_DIR/android-avds.stdout.log"
              avd_list_stderr="$RUN_DIR/android-avds.stderr.log"
              if ! "$emulator_bin" -list-avds >"$avd_list_stdout" 2>"$avd_list_stderr"; then
                cat "$avd_list_stdout" >&2
                cat "$avd_list_stderr" >&2
                exit 1
              fi
              cat "$avd_list_stdout" >&2
              cat "$avd_list_stderr" >&2
              avd_found=false
              while IFS= read -r avd_name; do
                if [ "$avd_name" = dobbyvpn-release ]; then avd_found=true; fi
              done < "$avd_list_stdout"
              test "$avd_found" = true
              sudo -n chown "$(id -un)" /dev/kvm
              "$emulator_bin" -accel-check
              "$emulator_bin" -avd dobbyvpn-release -no-window -no-audio -no-boot-anim -no-snapshot \
                > "$RUN_DIR/android-emulator.stdout.log" \
                2> "$RUN_DIR/android-emulator.stderr.log" &
              if ! timeout 120s adb wait-for-device; then
                echo "Android emulator did not become visible to ADB" >&2
                exit 1
              fi
              booted=false; for _ in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && booted=true && break; sleep 1; done
              test "$booted" = true
              adb root
              timeout 120s adb wait-for-device
              test "$(adb shell id -u | tr -d '\r')" = 0
              signed="$(find release-packages -maxdepth 1 -name 'DobbyVPN-*-sign.apk' -type f)"
              companion="$(find release-packages -maxdepth 1 -name 'DobbyVPN-*-android-test-companion.apk' -type f)"
              test -f "$signed"; test -f "$companion"
              apksigner_bin="$sdk_root/build-tools/36.0.0/apksigner"
              test -x "$apksigner_bin"
              signed_cert_stdout="$RUN_DIR/apksigner-signed.stdout.log"
              signed_cert_stderr="$RUN_DIR/apksigner-signed.stderr.log"
              companion_cert_stdout="$RUN_DIR/apksigner-companion.stdout.log"
              companion_cert_stderr="$RUN_DIR/apksigner-companion.stderr.log"
              if ! "$apksigner_bin" verify --print-certs "$signed" >"$signed_cert_stdout" 2>"$signed_cert_stderr"; then
                cat "$signed_cert_stdout" >&2
                cat "$signed_cert_stderr" >&2
                exit 1
              fi
              if ! "$apksigner_bin" verify --print-certs "$companion" >"$companion_cert_stdout" 2>"$companion_cert_stderr"; then
                cat "$companion_cert_stdout" >&2
                cat "$companion_cert_stderr" >&2
                exit 1
              fi
              cat "$signed_cert_stdout" "$signed_cert_stderr" "$companion_cert_stdout" "$companion_cert_stderr" >&2
              signed_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$signed_cert_stdout")"
              companion_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$companion_cert_stdout")"
              cert_digest_re='^([0-9A-Fa-f]{64}|[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31})$'
              [[ "$signed_cert" =~ $cert_digest_re ]]
              test "$signed_cert" = "$companion_cert"
              adb install -r "$signed"; adb install -r -t "$companion"
              printf 'ADB=%s\n' "$(command -v adb)" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Record observed platform version
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              test -r /etc/os-release
              . /etc/os-release
              platform_version="${ID:-linux}-${VERSION_ID:-unknown}"
              ;;
            windows)
              platform_version="$(powershell.exe -NoLogo -NoProfile -NonInteractive -Command '[Environment]::OSVersion.Version.ToString()' | tr -d '\r\n')"
              ;;
            macos)
              platform_version="$(sw_vers -productVersion | tr -d '\r\n')"
              ;;
            android)
              release="$("$ADB" shell getprop ro.build.version.release | tr -d '\r\n')"
              api="$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r\n')"
              platform_version="android-${release}-api-${api}"
              ;;
            *)
              printf 'unsupported platform=%s\n' "$PLATFORM" >&2
              exit 1
              ;;
          esac
          test -n "$platform_version"
          test "$platform_version" != "$PLATFORM"
          printf 'PLATFORM_VERSION=%s\n' "$platform_version" >> "$GITHUB_ENV"

      - name: Validate complete Android failure diagnostics
        if: inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          reporter_stdout="$RUN_DIR/android-complete-throwable-self-test.stdout.log"
          reporter_stderr="$RUN_DIR/android-complete-throwable-self-test.stderr.log"
          reporter_status=0
          reporter_timed_out=false
          timeout --foreground 60s "$ADB" shell am instrument -w -r \
            -e class com.dobby.CompleteThrowableReporterTest \
            com.dobby.vpn.test/androidx.test.runner.AndroidJUnitRunner \
            >"$reporter_stdout" 2>"$reporter_stderr" || reporter_status=$?
          if [ "$reporter_status" -eq 124 ]; then
            reporter_timed_out=true
          fi
          parser_args=(
            --stdout "$reporter_stdout" --stderr "$reporter_stderr"
            --returncode "$reporter_status" --complete-throwable
          )
          if [ "$reporter_timed_out" = true ]; then
            parser_args+=(--timed-out)
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/torturer${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m torturer_checks.android_instrumentation \
            "${parser_args[@]}"
          printf '%s\n' '[android-complete-throwable-self-test stdout]' >&2
          cat "$reporter_stdout" >&2
          printf '%s\n' '[android-complete-throwable-self-test stderr]' >&2
          cat "$reporter_stderr" >&2

      - name: Exercise the native Android UI
        if: inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          # This is the same release APK installed for the functional lane,
          # not the renderer-only helper. UI Automator launches the production
          # Compose activity, enters synthetic invalid input through the native
          # touch/input path, and verifies the visible failure/reopen flow.
          # The functional lane below owns the real profile, VPN consent,
          # traffic, Connect, and Disconnect checks.
          ui_stdout="$RUN_DIR/android-native-ui.stdout.log"
          ui_stderr="$RUN_DIR/android-native-ui.stderr.log"
          ui_status=0
          ui_timed_out=false
          timeout --foreground 300s "$ADB" shell am instrument -w -r \
            -e class com.dobby.NativeUiInstrumentedTest \
            com.dobby.vpn.test/androidx.test.runner.AndroidJUnitRunner \
            >"$ui_stdout" 2>"$ui_stderr" || ui_status=$?
          if [ "$ui_status" -eq 124 ]; then
            ui_timed_out=true
          fi
          parser_args=(
            --stdout "$ui_stdout" --stderr "$ui_stderr"
            --returncode "$ui_status"
          )
          if [ "$ui_timed_out" = true ]; then
            parser_args+=(--timed-out)
          fi
          parser_status=0
          PYTHONPATH="$GITHUB_WORKSPACE/torturer${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m torturer_checks.android_instrumentation \
            "${parser_args[@]}" || parser_status=$?
          printf '%s\n' '[android-native-ui stdout]' >&2
          cat "$ui_stdout" >&2
          printf '%s\n' '[android-native-ui stderr]' >&2
          cat "$ui_stderr" >&2
          printf 'ANDROID_UI_TEST_PARSER_STATUS=%s\n' "$parser_status" >> "$GITHUB_ENV"
          if [ "$parser_status" -ne 0 ]; then
            exit 1
          fi

      - name: Retain Android native UI screenshots
        if: always() && inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          ui_stdout="$RUN_DIR/android-native-ui.stdout.log"
          if [ ! -s "$ui_stdout" ]; then
            printf 'Android UI screenshot collection failed: complete instrumentation stdout is unavailable: %s\n' "$ui_stdout" >&2
            exit 1
          fi
          destination="$RUN_DIR/screenshots/android-native-ui"
          mkdir -p "$destination"
          screenshot_count=0
          collection_status=0
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^INSTRUMENTATION_STATUS:\ stream=DOBBY_UI_SCREENSHOT\ label=([A-Za-z0-9_-]+)\ path=(/data/user/0/com\.dobby\.vpn/cache/dobbyvpn-rendered-screenshots/[A-Za-z0-9_-]+\.png)\ bytes=([0-9]+)\ sha256=([0-9a-f]{64})\ width=([1-9][0-9]*)\ height=([1-9][0-9]*)$ ]]; then
              printf 'Android UI screenshot marker is malformed; the complete original marker remains in %s: %s\n' "$ui_stdout" "$line" >&2
              collection_status=1
              continue
            fi
            label="${BASH_REMATCH[1]}"
            remote="${BASH_REMATCH[2]}"
            expected_bytes="${BASH_REMATCH[3]}"
            expected_sha="${BASH_REMATCH[4]}"
            target="$destination/$label.png"
            partial="$target.partial"
            screenshot_count=$((screenshot_count + 1))
            if [ -e "$target" ] || [ -e "$partial" ]; then
              printf 'Android UI screenshot label was emitted more than once: %s\n' "$label" >&2
              collection_status=1
              continue
            fi
            if ! "$ADB" pull "$remote" "$partial"; then
              collection_status=1
              continue
            fi
            actual_bytes="$(wc -c < "$partial" | tr -d '[:space:]')"
            actual_sha="$(sha256sum "$partial")"
            actual_sha="${actual_sha%% *}"
            if [ "$actual_bytes" != "$expected_bytes" ] || [ "$actual_sha" != "$expected_sha" ]; then
              printf 'Android UI screenshot transfer mismatch: label=%s expected_bytes=%s actual_bytes=%s expected_sha256=%s actual_sha256=%s; downloaded bytes remain at %s\n' \
                "$label" "$expected_bytes" "$actual_bytes" "$expected_sha" "$actual_sha" "$partial" >&2
              collection_status=1
              continue
            fi
            mv "$partial" "$target"
            printf 'Android UI screenshot retained and matched its complete instrumentation marker: label=%s bytes=%s sha256=%s path=%s\n' \
              "$label" "$actual_bytes" "$actual_sha" "$target"
          done < <(grep -a '^INSTRUMENTATION_STATUS: stream=DOBBY_UI_SCREENSHOT ' "$ui_stdout")
          if [ "$screenshot_count" -eq 0 ]; then
            printf 'Android UI screenshot collection failed: instrumentation emitted no screenshot markers; complete output remains in %s\n' "$ui_stdout" >&2
            collection_status=1
          fi
          if [ "${ANDROID_UI_TEST_PARSER_STATUS:-}" = 0 ]; then
            for label in startup failure-state reopened; do
              if [ ! -f "$destination/$label.png" ]; then
                printf 'Android UI screenshot collection failed: successful UI run is missing required screenshot label=%s\n' "$label" >&2
                collection_status=1
              fi
            done
          elif [ ! -f "$destination/failure.png" ]; then
            printf 'Android UI screenshot collection failed: failed UI run is missing its failure screenshot\n' >&2
            collection_status=1
          fi
          exit "$collection_status"

      - name: Start installed service
        if: inputs.platform != 'android'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then
            SERVICE_WIN="$(cygpath -w "$SERVICE")"
            SERVICE_OUT_WIN="$(cygpath -w "$RUN_DIR/service.log.stdout")"
            SERVICE_ERR_WIN="$(cygpath -w "$RUN_DIR/service.log.stderr")"
            SERVICE_LOG_PATH_WIN="$(cygpath -w "$RUN_DIR/service.log")"
            SERVICE_LOG_ROOT_WIN="$(cygpath -w "$RUN_DIR")"
            SERVICE_PID_FILE="$RUN_DIR/windows-service.pid"
            SERVICE_PID_FILE_WIN="$(cygpath -w "$SERVICE_PID_FILE")"
            SERVICE_START_LOG="$RUN_DIR/windows-service-start.log"
            export SERVICE_WIN SERVICE_OUT_WIN SERVICE_ERR_WIN SERVICE_LOG_PATH_WIN SERVICE_LOG_ROOT_WIN SERVICE_PID_FILE_WIN
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '
          $ErrorActionPreference = "Stop"
          [Console]::Error.WriteLine("Resolving MSI-managed service")
          $installed = Get-Service -Name "DobbyVPN Go backend"
          if ($installed.Status -ne "Stopped") {
            [Console]::Error.WriteLine("Stopping MSI-managed service")
            Stop-Service -InputObject $installed -Force
            $installed.WaitForStatus("Stopped", [TimeSpan]::FromSeconds(30))
            [Console]::Error.WriteLine("MSI-managed service stopped")
          }
          $env:DOBBY_LOG_PATH = $env:SERVICE_LOG_PATH_WIN
          $env:DOBBY_LOG_ROOT = $env:SERVICE_LOG_ROOT_WIN
          [Console]::Error.WriteLine("Starting qualification process")
          $process = Start-Process -FilePath $env:SERVICE_WIN -ArgumentList @("-mode", "normal") -RedirectStandardOutput $env:SERVICE_OUT_WIN -RedirectStandardError $env:SERVICE_ERR_WIN -PassThru
          [Console]::Error.WriteLine("Qualification process started")
          [System.IO.File]::WriteAllText($env:SERVICE_PID_FILE_WIN, [string]$process.Id)
          [Console]::Error.WriteLine("Qualification PID saved")
          ' > "$SERVICE_START_LOG" 2>&1 &
            launcher_pid=$!
            for _ in $(seq 1 30); do
              [ -s "$SERVICE_PID_FILE" ] && break
              if ! kill -0 "$launcher_pid"; then
                if ! wait "$launcher_pid"; then
                  printf 'Windows service launcher exited nonzero before publishing its PID\n' >&2
                fi
                break
              fi
              sleep 1
            done
            cat "$SERVICE_START_LOG" >&2
            if [ ! -s "$SERVICE_PID_FILE" ]; then
              exit 1
            fi
            service_pid="$(tr -d '\r\n' < "$SERVICE_PID_FILE")"
            [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
            if kill "$launcher_pid"; then
              if ! wait "$launcher_pid"; then
                printf 'Windows service launcher exited nonzero after publishing its PID\n' >&2
              fi
            elif ! wait "$launcher_pid"; then
              printf 'Windows service launcher had already exited nonzero\n' >&2
            fi
          elif [ "$PLATFORM" = macos ]; then
            launchd_stdout="$RUN_DIR/macos-launchd-print.stdout.log"
            launchd_stderr="$RUN_DIR/macos-launchd-print.stderr.log"
            if ! launchctl print system/com.dobby.vpnservice > "$launchd_stdout" 2> "$launchd_stderr"; then
              cat "$launchd_stdout" >&2
              cat "$launchd_stderr" >&2
              exit 1
            fi
            cat "$launchd_stdout" >&2
            cat "$launchd_stderr" >&2
            service_pid="$(python3 - "$launchd_stdout" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          matches = re.findall(r"(?m)^\s*pid\s*=\s*([1-9][0-9]*)\s*$", text)
          if len(matches) != 1:
              raise SystemExit("launchd service PID is missing or ambiguous")
          print(matches[0])
          PY
            )"
            [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
          else
            # Linux retains its existing candidate service launcher.
            service_pid="$(sudo -n sh -c '
              set -eu
              binary=$1
              control_socket=$2
              peer_uid=$3
              library_path=$4
              log_path=$5
              stdout_path=$6
              stderr_path=$7
              if [ -n "$library_path" ]; then
                env LD_LIBRARY_PATH="$library_path" DOBBYVPN_CONTROL_SOCKET="$control_socket" DOBBYVPN_CONTROL_PEER_UID="$peer_uid" DOBBY_LOG_PATH="$log_path" DOBBY_LOG_ROOT="$(dirname "$log_path")" "$binary" > "$stdout_path" 2> "$stderr_path" < /dev/null &
              else
                env DOBBYVPN_CONTROL_SOCKET="$control_socket" DOBBYVPN_CONTROL_PEER_UID="$peer_uid" DOBBY_LOG_PATH="$log_path" DOBBY_LOG_ROOT="$(dirname "$log_path")" "$binary" > "$stdout_path" 2> "$stderr_path" < /dev/null &
              fi
              printf "%s\\n" "$!"
            ' dobbyvpn-service "$SERVICE" "$SERVICE_SOCKET" "$(id -u)" "${SERVICE_LIBRARY_PATH:-}" "$RUN_DIR/service.log" "$RUN_DIR/service.log.stdout" "$RUN_DIR/service.log.stderr")"
            [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
          printf 'SERVICE_BINARY=%s\nSERVICE_PID=%s\n' "$SERVICE" "$service_pid" >> "$GITHUB_ENV"
          sleep 2

      - name: Run canonical test set against exact Release package
        id: functional
        working-directory: torturer
        shell: bash
        run: |
          set -euo pipefail
          lane_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - 300))
          if [ "$lane_timeout" -le 0 ]; then
            printf 'functional lane has no provider-bound execution budget\n' >&2
            exit 1
          fi
          if [ "$PLATFORM" = android ]; then
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.run \
              --platform android --suite mini --adb "$ADB" --profile "$GITHUB_WORKSPACE/render/profile.toml" --source-sha "$DOBBYVPN_COMMIT_SHA" \
              --platform-version "$PLATFORM_VERSION" --lane-timeout-seconds "$lane_timeout" --output "$RESULT_PATH" \
              --raw-log-dir "$RUN_DIR"
          else
            release_args=(
              --platform "$PLATFORM"
              --suite mini
              --cli "$CLI"
              --profile "$GITHUB_WORKSPACE/render/profile.toml"
              --source-sha "$DOBBYVPN_COMMIT_SHA"
              --platform-version "$PLATFORM_VERSION"
              --lane-timeout-seconds "$lane_timeout"
              --output "$RESULT_PATH"
              --raw-log-dir "$RUN_DIR"
              --service-pid "$SERVICE_PID"
              --service-binary "$SERVICE_BINARY"
            )
            if [ "$PLATFORM" = windows ]; then
              release_args+=(--service-pipe "$SERVICE_PIPE")
            else
              release_args+=(--service-socket "$SERVICE_SOCKET")
            fi
            if [ "$PLATFORM" = linux ]; then
              export DOBBYVPN_CONTROL_SOCKET="$SERVICE_SOCKET"
              release_args+=(--service-library-path "$SERVICE_LIBRARY_PATH")
            fi
            if [ "$PLATFORM" = macos ]; then
              export DOBBYVPN_CONTROL_SOCKET="$SERVICE_SOCKET"
              export DOBBY_LOG_PATH="$RUN_DIR/service.log"
              export DOBBY_LOG_ROOT="$RUN_DIR"
            fi
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_checks.hosted.run "${release_args[@]}"
          fi

      - name: Stop Linux qualification service
        if: always() && inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SERVICE_PID:-}" ]; then
            if sudo -n kill -0 "$SERVICE_PID"; then
              sudo -n kill -TERM "$SERVICE_PID"
              sleep 2
              if sudo -n kill -0 "$SERVICE_PID"; then
                sudo -n kill -KILL "$SERVICE_PID"
                sleep 1
              fi
            else
              printf 'Linux qualification service was already stopped before cleanup: pid=%s\n' "$SERVICE_PID"
            fi
          fi
          if [ -n "${SERVICE_SOCKET:-}" ]; then
            sudo -n rm -f "$SERVICE_SOCKET"
          fi
          if [ -n "${CONTROL_DIR:-}" ] && [ -d "$CONTROL_DIR" ]; then
            sudo -n rmdir "$CONTROL_DIR"
          fi

      - name: Remove Android standalone probe staging
        if: always() && inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          adb_bin="${ADB:-adb}"
          "$adb_bin" shell \
            'for path in /data/local/tmp/dobbyvpn-probe-*; do
               case "$path" in
                 /data/local/tmp/dobbyvpn-probe-*)
                   [ -d "$path" ] || continue
                   rm -rf -- "$path"
                   ;;
               esac
             done'

      - name: Remove Android qualification routing rules
        if: always() && inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          adb_bin="${ADB:-adb}"
          "$adb_bin" shell \
            'inventory="$(iptables -S)" || exit $?
             printf "%s\n" "$inventory"
             while case "$inventory" in *"-A OUTPUT -j DOBBYVPN_TORTURER"*) true;; *) false;; esac; do
               iptables -D OUTPUT -j DOBBYVPN_TORTURER || exit $?
               inventory="$(iptables -S)" || exit $?
               printf "%s\n" "$inventory"
             done
             case "$inventory" in
               *"-N DOBBYVPN_TORTURER"*)
                 iptables -F DOBBYVPN_TORTURER || exit $?
                 iptables -X DOBBYVPN_TORTURER || exit $?
                 ;;
             esac
             inventory="$(iptables -S)" || exit $?
             printf "%s\n" "$inventory"
             case "$inventory" in
               *DOBBYVPN_TORTURER*)
                 echo "Android qualification routing chain remains: DOBBYVPN_TORTURER" >&2
                 exit 1
                 ;;
             esac'

      - name: Make system-service log readable for redacted diagnostics
        if: always() && env.RUN_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLATFORM" != linux ] && [ "$PLATFORM" != macos ]; then
            exit 0
          fi
          service_log="$RUN_DIR/service.log"
          if [ ! -f "$service_log" ]; then
            printf 'System-service log is unavailable before diagnostics collection: %s\n' "$service_log" >&2
            exit 0
          fi
          sudo chown "$(id -u):$(id -g)" "$service_log"
          test -r "$service_log"

      - name: Collect complete redacted qualification diagnostics
        if: always() && env.RUN_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_diagnostics.py \
            --profile "$GITHUB_WORKSPACE/render/profile.toml" \
            --source "$RESULT_DIR" \
            --source "$RUN_DIR" \
            --output "$ARTIFACT_DIR"

      - name: Remove shared profile from runner
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/render/profile.toml"

      - name: Inventory complete qualification diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -type f -print

      - name: Retain complete qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-qualification-${{ inputs.platform }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Remove disposable qualification scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUN_DIR"
          rm -rf "$RESULT_DIR"
          rm -rf "$ARTIFACT_DIR"
