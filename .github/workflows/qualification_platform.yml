name: Hosted mini platform qualification

on:
  workflow_call:
    outputs:
      android_pairing:
        value: ${{ jobs.qualification.outputs.android_pairing }}
    inputs:
      diagnostic_scenario:
        description: Optional Android scenario or isolated N11 diagnosis; Test leaves empty.
        type: string
        default: ''
      android_companion_manifest_sha256:
        description: Digest of the separately compiled Android test input manifest.
        type: string
        default: ''
      android_companion_producer_attempt:
        description: Original compilation attempt retained across execution retries.
        type: string
        default: ''
      build_packages:
        description: Exact readiness-selected Build artifacts, when overlapping Build.
        type: string
        required: false
        default: ''
      torturer_sha:
        required: true
        type: string
      torturer_tree_sha256:
        required: true
        type: string
      platform:
        description: Platform to qualify.
        required: true
        type: string
      architecture:
        description: Native package architecture for macOS qualification.
        required: false
        type: string
        default: ''
      fixture_artifact_name:
        description: Artifact containing this platform’s disposable VPN profiles.
        required: true
        type: string
      fixture_host_name:
        description: Exact reusable fixture producer job name in this run.
        required: true
        type: string
      build_run_id:
        description: Successful Build run containing the packages to install.
        required: false
        default: ''
        type: string
      source_sha:
        description: Product revision selected by the Build run.
        required: false
        default: ''
        type: string
      retention_days:
        default: 1
        type: number

env:
  DOBBY_BUILD_PACKAGES: ${{ inputs.build_packages }}

jobs:
  qualification:
    name: Hosted mini / ${{ inputs.platform }} / ${{ inputs.architecture || 'default' }}
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || inputs.platform == 'macos' && inputs.architecture == 'amd64' && 'macos-15-intel' || inputs.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    environment: release-tests
    permissions:
      contents: read
      actions: read
    outputs:
      android_pairing: ${{ steps.android_companion.outputs.pairing }}
    env:
      DOBBY_PRODUCT_ROOT: ${{ github.workspace }}
      DOBBY_TESTS_ROOT: ${{ github.workspace }}/torturer
      DOBBY_TEST_SHA: ${{ inputs.torturer_sha }}
      DOBBY_TEST_TREE_SHA256: ${{ inputs.torturer_tree_sha256 }}
      PYTHONPATH: ${{ github.workspace }}/torturer
      PLATFORM: ${{ inputs.platform }}
      ARCHITECTURE: ${{ inputs.architecture }}
      DOBBYVPN_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
      SELECTED_BUILD_RUN_ID: ${{ inputs.build_run_id || github.run_id }}
      ANDROID_DIAGNOSTIC_SCENARIO: ${{ inputs.diagnostic_scenario }}
    steps:
      - name: Initialize runner-local qualification paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RESULT_DIR=$RUNNER_TEMP/dobbyvpn-release-result"
            echo "RUN_DIR=$RUNNER_TEMP/dobbyvpn-release-run"
            echo "ARTIFACT_DIR=$RUNNER_TEMP/dobbyvpn-release-diagnostics"
            echo "RESULT_PATH=$RUNNER_TEMP/dobbyvpn-release-result/functional-result.json"
            echo "DESKTOP_PACKAGE_DESCRIPTOR=$RUNNER_TEMP/dobbyvpn-release-run/desktop-package.json"
            echo "INSTALLED_DESCRIPTOR=$RUNNER_TEMP/dobbyvpn-release-run/installed.json"
            echo "ANDROID_SIGNED_DIR=$RUNNER_TEMP/dobbyvpn-android-test-signed"
            echo "RUN_DEADLINE_EPOCH=$(( $(date +%s) + 45 * 60 ))"
          } >> "$GITHUB_ENV"
          if [ "$PLATFORM" = linux ]; then
            echo "CONTROL_DIR=$RUNNER_TEMP/dobbyvpn-release-control" >> "$GITHUB_ENV"
          fi

      - name: Require main before package qualification
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" -ge 1

      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Check out exact private tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DobbyVPN/Torturer
          ref: ${{ inputs.torturer_sha }}
          path: torturer
          ssh-key: ${{ secrets.TORTURER_READ_KEY }}
          persist-credentials: false
      - name: Verify private tests identity
        shell: bash
        env:
          TORTURER_SHA: ${{ inputs.torturer_sha }}
          TORTURER_TREE_SHA256: ${{ inputs.torturer_tree_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts/release")
          import release_guard
          actual = subprocess.check_output(["git", "-C", "torturer", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["TORTURER_SHA"] or release_guard.tests_tree_sha256(Path("torturer")) != os.environ["TORTURER_TREE_SHA256"]:
              raise SystemExit("private test identity differs from reserved candidate")
          PYTHON

      - name: Restore Android Gradle dependency archives
        if: inputs.platform == 'android'
        uses: ./.github/actions/dependency-cache
        with:
          go-modules: 'false'
          gradle: 'true'
          gradle-extra-dependency-files: torturer/source_tests/product/ui/android/app/android-test-wiring.gradle.kts

      - name: Download selected qualification packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PLATFORM" in
            linux) artifacts=(dobbyVPN-linux.deb) ;;
            windows) artifacts=(dobbyVPN-windows-amd64.msi) ;;
            android) artifacts=(dobbyvpn-android-unsign.apk) ;;
            macos)
              case "$ARCHITECTURE" in
                arm64) artifacts=(dobbyVPN-macos-aarch64.pkg) ;;
                amd64) artifacts=(dobbyVPN-macos-amd64.pkg) ;;
                *) echo "unsupported macOS package architecture: $ARCHITECTURE" >&2; exit 1 ;;
              esac
              ;;
            *) echo "unsupported qualification platform: $PLATFORM" >&2; exit 1 ;;
          esac
          for artifact in "${artifacts[@]}"; do
            python3 .github/scripts/release/download_artifact.py \
              "$SELECTED_BUILD_RUN_ID" "$artifact" release-packages
          done

      - name: Wait for disposable fixture readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_ARTIFACT_NAME: ${{ inputs.fixture_artifact_name }}
          FIXTURE_HOST_NAME: ${{ inputs.fixture_host_name }}
        run: |
          python3 .github/scripts/fixture_jobs.py ready \
            --key "$PLATFORM" --producer-name "$FIXTURE_HOST_NAME" --output fixtures

      - name: Download producer's compiled Android companion
        if: inputs.platform == 'android'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dobbyvpn-android-test-inputs-${{ github.run_id }}-${{ inputs.android_companion_producer_attempt }}
          path: ${{ runner.temp }}/private-android-companion

      - name: Check package and prepare qualification directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR" "$RUN_DIR"
          if [ "$PLATFORM" = linux ]; then
            mkdir -p "$CONTROL_DIR"
          fi
          case "$PLATFORM" in linux|windows|macos|android) ;; *) exit 1 ;; esac
          [[ "$DOBBYVPN_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DOBBYVPN_COMMIT_SHA"
          test -s "$GITHUB_WORKSPACE/fixtures/profile.toml"
          test -s "$GITHUB_WORKSPACE/fixtures/websocket-profile.toml"
          test -s "$GITHUB_WORKSPACE/fixtures/trusttunnel-profile.toml"
          case "$PLATFORM" in
            linux) test -f "$GITHUB_WORKSPACE/release-packages/dobbyVPN-linux.deb" ;;
            windows) test -f "$GITHUB_WORKSPACE/release-packages/dobbyVPN-windows-amd64.msi" ;;
            macos)
              case "$ARCHITECTURE" in
                arm64) package=dobbyVPN-macos-aarch64.pkg ;;
                amd64) package=dobbyVPN-macos-amd64.pkg ;;
                *) echo "unsupported macOS package architecture: $ARCHITECTURE" >&2; exit 1 ;;
              esac
              test -f "$GITHUB_WORKSPACE/release-packages/$package"
              ;;
            android)
              version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
              test -s "$GITHUB_WORKSPACE/release-packages/DobbyVPN-v${version}-unsign.apk"
              ;;
            *) exit 1 ;;
          esac
          [[ "$RUN_DEADLINE_EPOCH" =~ ^[0-9]+$ ]]

      - name: Verify fixture protocols against selected source
        if: inputs.platform == 'linux'
        uses: ./.github/actions/fixture-protocol-check

      - name: Read Android SDK pins
        id: android_java
        if: inputs.platform == 'android'
        run: |
          set -euo pipefail
          for pin in java_major android_sdk_platform android_build_tools android_ndk; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Install pinned JDK for temporary Android test signing
        if: inputs.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.android_java.outputs.java_major }}

      - name: Install Android tooling for selected package qualification
        if: inputs.platform == 'android'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - name: Validate reusable Android companion against current tools and package
        id: android_companion
        if: inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdk_platform="${{ steps.android_java.outputs.android_sdk_platform }}"
          build_tools="${{ steps.android_java.outputs.android_build_tools }}"
          ndk="${{ steps.android_java.outputs.android_ndk }}"
          sdk_install_stdout="$RUN_DIR/android-companion-sdk-install.stdout.log"
          sdk_install_stderr="$RUN_DIR/android-companion-sdk-install.stderr.log"
          if sdkmanager --install "platforms;$sdk_platform" "build-tools;$build_tools" "ndk;$ndk" \
            >"$sdk_install_stdout" 2>"$sdk_install_stderr"; then
            sdk_install_status=0
          else
            sdk_install_status=$?
          fi
          sdk_stdout_forward_status=0
          sdk_stderr_forward_status=0
          if cat "$sdk_install_stdout"; then
            :
          else
            sdk_stdout_forward_status=$?
          fi
          if cat "$sdk_install_stderr" >&2; then
            :
          else
            sdk_stderr_forward_status=$?
          fi
          if [ "$sdk_install_status" -ne 0 ]; then
            if [ "$sdk_stdout_forward_status" -ne 0 ]; then
              printf 'could not forward Android companion SDK install stdout (exit %s)\n' \
                "$sdk_stdout_forward_status" >&2 || true
            fi
            if [ "$sdk_stderr_forward_status" -ne 0 ]; then
              printf 'could not forward Android companion SDK install stderr (exit %s)\n' \
                "$sdk_stderr_forward_status" >&2 || true
            fi
            exit "$sdk_install_status"
          fi
          if [ "$sdk_stdout_forward_status" -ne 0 ] || [ "$sdk_stderr_forward_status" -ne 0 ]; then
            printf 'could not forward Android companion SDK install output (stdout exit %s, stderr exit %s)\n' \
              "$sdk_stdout_forward_status" "$sdk_stderr_forward_status" >&2 || true
            if [ "$sdk_stdout_forward_status" -ne 0 ]; then
              exit "$sdk_stdout_forward_status"
            fi
            exit "$sdk_stderr_forward_status"
          fi
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          from torturer_runner.android_instrumentation import bind_reusable_test_companion, validate_reusable_test_companion
          from torturer_runner.compiled_test_inputs import command_tool_identity, file_sha256
          product = Path(os.environ["DOBBY_PRODUCT_ROOT"])
          version = (product / "VERSION").read_text().strip()
          sdk = Path(os.environ.get("ANDROID_SDK_ROOT") or os.environ["ANDROID_HOME"])
          sdk_platform = "${{ steps.android_java.outputs.android_sdk_platform }}"
          build_tools = "${{ steps.android_java.outputs.android_build_tools }}"
          ndk = "${{ steps.android_java.outputs.android_ndk }}"
          gradlew = product / "ui/android/gradlew"
          java = Path(os.environ["JAVA_HOME"]) / "bin/java"
          tools = {
              "gradle": command_tool_identity(
                  "gradle", [str(gradlew), "--version", "--no-daemon"],
                  executable_path=gradlew, cwd=product,
              ),
              "java": command_tool_identity(
                  "java", [str(java), "-version"], executable_path=java, cwd=product,
              ),
          }
          properties = lambda path: file_sha256(path / "source.properties")
          compatibility = {
              "sdk_platform": sdk_platform,
              "sdk_platform_sha256": properties(sdk / "platforms" / sdk_platform),
              "build_tools": build_tools,
              "build_tools_sha256": properties(sdk / "build-tools" / build_tools),
              "ndk": ndk,
              "ndk_sha256": properties(sdk / "ndk" / ndk),
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "private-android-companion"
          manifest_sha = "${{ inputs.android_companion_manifest_sha256 }}"
          producer_attempt = int("${{ inputs.android_companion_producer_attempt }}")
          source_sha = os.environ["DOBBYVPN_COMMIT_SHA"]
          tests_sha = os.environ["DOBBY_TEST_SHA"]
          tests_tree = os.environ["DOBBY_TEST_TREE_SHA256"]
          companion_name = "dobbyvpn-test-companion-unsigned.apk"
          # Verify the selected APK, then bind the already compiled companion
          # to this exact producer selection before accepting it for execution.
          import subprocess, sys
          apk = product / "release-packages" / f"DobbyVPN-v{version}-unsign.apk"
          apk_sha_before = file_sha256(apk)
          version_code = subprocess.check_output([sys.executable,
              str(product / ".github/scripts/release/version_metadata.py"),
              "--version-file", str(product / "VERSION"), "--field", "android_version_code"], text=True).strip()
          analyzer = subprocess.check_output([sys.executable,
              str(product / ".github/scripts/android/android_tool_selection.py"), "--tool", "apkanalyzer"], text=True).strip()
          subprocess.run([sys.executable, str(product / ".github/scripts/android/verify_android_apk_source.py"),
              "--apk", str(apk), "--source-sha", source_sha, "--repository", os.environ["GITHUB_REPOSITORY"],
              "--version-name", version, "--version-code", version_code, "--apkanalyzer", analyzer], check=True)
          manifest_sha, compatibility = bind_reusable_test_companion(
              root, expected_manifest_sha256=manifest_sha, source_sha=source_sha,
              tests_sha=tests_sha, tests_tree_sha256=tests_tree, producer_attempt=producer_attempt,
              tools=tools, compatibility=compatibility, verified_product_apk=apk,
              verified_product_apk_sha256=apk_sha_before,
              build_packages=json.loads(os.environ["DOBBY_BUILD_PACKAGES"]))
          print("Bound Android companion manifest SHA256=" + manifest_sha, flush=True)
          companion = validate_reusable_test_companion(
              root, companion_relative_path=companion_name,
              expected_manifest_sha256=manifest_sha, source_sha=source_sha,
              tests_sha=tests_sha, tests_tree_sha256=tests_tree,
              producer_attempt=producer_attempt, tools=tools,
              compatibility=compatibility,
          )
          apk_sha = file_sha256(companion)
          pairing = {
              "product_sha": source_sha,
              "unsigned_product_apk_sha256": compatibility["product_apk_sha256"],
              "test_companion_sha256": apk_sha,
              "torturer_repository": "DobbyVPN/Torturer",
              "torturer_sha": tests_sha,
              "torturer_tree_sha256": tests_tree,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("pairing=" + json.dumps(pairing, separators=(",", ":")) + "\n")
          PYTHON

      - name: Validate and install the exact selected native package
        shell: bash
        run: |
          set -euo pipefail
          qualification_progress="$RUNNER_TEMP/dobbyvpn-qualification-progress.jsonl"
          : > "$qualification_progress"
          trap 'if [ -s "$qualification_progress" ]; then cat "$qualification_progress" >&2; fi; rm -f "$qualification_progress"' EXIT
          emit_phase_event() {
            local event="$1" phase="$2" started_ns="$3" returncode="${4:-}"
            python3 - "$qualification_progress" "$event" "$phase" "$started_ns" "$returncode" <<'PY'
          from datetime import datetime, timezone
          import json
          import sys
          import time

          path, event, phase, started_ns, returncode = sys.argv[1:]
          record = {
              "kind": "dobbyvpn.qualification.progress",
              "event": event,
              "phase": phase,
              "timestamp_utc": datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
          }
          if event == "phase-finish":
              record["duration_seconds"] = max(0, time.monotonic_ns() - int(started_ns)) / 1_000_000_000
              record["returncode"] = int(returncode)
          with open(path, "a", encoding="utf-8") as stream:
              stream.write(json.dumps(record, sort_keys=True, allow_nan=False) + "\n")
          PY
          }
          run_timed() {
            local phase="$1" status=0 started_ns
            shift
            started_ns="$(python3 -c 'import time; print(time.monotonic_ns())')"
            emit_phase_event phase-start "$phase" "$started_ns"
            "$@" || status=$?
            emit_phase_event phase-finish "$phase" "$started_ns" "$status"
            return "$status"
          }
          if [ "$PLATFORM" != android ]; then
            version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")"
            case "$PLATFORM" in
              linux)
                architecture=amd64
                package="$GITHUB_WORKSPACE/release-packages/dobbyVPN-linux.deb"
                ;;
              windows)
                architecture=amd64
                package="$GITHUB_WORKSPACE/release-packages/dobbyVPN-windows-amd64.msi"
                ;;
              macos)
                architecture="$ARCHITECTURE"
                case "$architecture" in
                  arm64)
                    test "$(uname -m)" = arm64
                    package="$GITHUB_WORKSPACE/release-packages/dobbyVPN-macos-aarch64.pkg"
                    ;;
                  amd64)
                    test "$(uname -m)" = x86_64
                    package="$GITHUB_WORKSPACE/release-packages/dobbyVPN-macos-amd64.pkg"
                    ;;
                  *) exit 1 ;;
                esac
                ;;
              *) printf 'unsupported desktop platform=%s\n' "$PLATFORM" >&2; exit 1 ;;
            esac
            run_timed desktop-package-validation python3 .github/scripts/desktop/desktop_package.py describe \
              --platform "$PLATFORM" --arch "$architecture" --version "$version" \
              --source-sha "$DOBBYVPN_COMMIT_SHA" --package "$package" \
              --output "$DESKTOP_PACKAGE_DESCRIPTOR"
            if [ "$PLATFORM" = linux ]; then
              # Exercise the selected DEB before functional setup stops/restarts it.
              export DOBBYVPN_COMMAND_DEADLINE_MONOTONIC="$(python3 -c 'import os,time; print(time.monotonic() + max(0, float(os.environ["RUN_DEADLINE_EPOCH"]) - time.time()))')"
              run_timed linux-installer-migration python3 -m torturer_runner.installer_migration \
                --platform linux --package "$package" --current-version "$version" \
                --package-sha256 "$(python3 -c 'import json,os; print(json.load(open(os.environ["DESKTOP_PACKAGE_DESCRIPTOR"]))["package_sha256"])')" \
                --log-dir "$RUN_DIR/installer-migration" --temp-parent "$RUN_DIR"
            fi
            install_arguments=(
              install
              --build-descriptor "$DESKTOP_PACKAGE_DESCRIPTOR"
              --run-dir "$RUN_DIR"
              --output "$INSTALLED_DESCRIPTOR"
            )
            run_timed desktop-package-install python3 .github/scripts/desktop/desktop_package.py "${install_arguments[@]}"
            installed_values=()
            while IFS= read -r installed_value; do
              installed_values+=("$installed_value")
            done < <(python3 - "$INSTALLED_DESCRIPTOR" <<'PY'
          import json
          import sys
          from pathlib import Path

          installed = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("cli", "service", "ui", "library_path"):
              print(installed.get(key, ""))
          PY
            )
            test "${#installed_values[@]}" -eq 4
            CLI="${installed_values[0]}"
            SERVICE="${installed_values[1]}"
            UI_BINARY="${installed_values[2]}"
            SERVICE_LIBRARY_PATH="${installed_values[3]}"
            if [ "$PLATFORM" = windows ]; then
              CLI="$(cygpath -u "$CLI")"
              SERVICE="$(cygpath -u "$SERVICE")"
              UI_BINARY="$(cygpath -u "$UI_BINARY")"
              SERVICE_PIPE=DobbyVPN.Control
            elif [ "$PLATFORM" = linux ]; then
              SERVICE_SOCKET="$CONTROL_DIR/control.sock"
            else
              SERVICE_SOCKET=/var/run/dobbyvpn/control.sock
            fi
            if [ "$PLATFORM" = linux ]; then
              printf 'CLI=%s\nSERVICE=%s\nSERVICE_SOCKET=%s\nSERVICE_LIBRARY_PATH=%s\n' \
                "$CLI" "$SERVICE" "$SERVICE_SOCKET" "$SERVICE_LIBRARY_PATH" >> "$GITHUB_ENV"
            elif [ "$PLATFORM" = windows ]; then
              printf 'CLI=%s\nSERVICE=%s\nUI_BINARY=%s\nSERVICE_PIPE=%s\n' \
                "$CLI" "$SERVICE" "$UI_BINARY" "$SERVICE_PIPE" >> "$GITHUB_ENV"
            else
              printf 'CLI=%s\nSERVICE=%s\nUI_BINARY=%s\nSERVICE_SOCKET=%s\n' \
                "$CLI" "$SERVICE" "$UI_BINARY" "$SERVICE_SOCKET" >> "$GITHUB_ENV"
            fi
          fi
          case "$PLATFORM" in
            android)
              sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is unavailable}}"
              sdk_platform="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin android_sdk_platform)"
              build_tools="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin android_build_tools)"
              sdk_install_stdout="$RUN_DIR/android-sdk-install.stdout.log"
              sdk_install_stderr="$RUN_DIR/android-sdk-install.stderr.log"
              if run_timed android-sdk-install sdkmanager --install \
                'platform-tools' "platforms;$sdk_platform" "build-tools;$build_tools" \
                'emulator' 'system-images;android-35;google_apis;x86_64' \
                >"$sdk_install_stdout" 2>"$sdk_install_stderr"; then
                sdk_install_status=0
              else
                sdk_install_status=$?
              fi
              sdk_stdout_forward_status=0
              sdk_stderr_forward_status=0
              if cat "$sdk_install_stdout"; then
                :
              else
                sdk_stdout_forward_status=$?
              fi
              if cat "$sdk_install_stderr" >&2; then
                :
              else
                sdk_stderr_forward_status=$?
              fi
              if [ "$sdk_install_status" -ne 0 ]; then
                if [ "$sdk_stdout_forward_status" -ne 0 ]; then
                  printf 'could not forward Android SDK install stdout (exit %s)\n' \
                    "$sdk_stdout_forward_status" >&2 || true
                fi
                if [ "$sdk_stderr_forward_status" -ne 0 ]; then
                  printf 'could not forward Android SDK install stderr (exit %s)\n' \
                    "$sdk_stderr_forward_status" >&2 || true
                fi
                exit "$sdk_install_status"
              fi
              if [ "$sdk_stdout_forward_status" -ne 0 ] || [ "$sdk_stderr_forward_status" -ne 0 ]; then
                printf 'could not forward Android SDK install output (stdout exit %s, stderr exit %s)\n' \
                  "$sdk_stdout_forward_status" "$sdk_stderr_forward_status" >&2 || true
                if [ "$sdk_stdout_forward_status" -ne 0 ]; then
                  exit "$sdk_stdout_forward_status"
                fi
                exit "$sdk_stderr_forward_status"
              fi
              unsigned_app="$GITHUB_WORKSPACE/release-packages/DobbyVPN-v$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/VERSION")-unsign.apk"
              unsigned_companion="$RUNNER_TEMP/private-android-companion/dobbyvpn-test-companion-unsigned.apk"
              signed_app="$ANDROID_SIGNED_DIR/DobbyVPN-test.apk"
              signed_companion="$ANDROID_SIGNED_DIR/DobbyVPN-test-companion.apk"
              mkdir -p "$ANDROID_SIGNED_DIR"
              apksigner_bin="$sdk_root/build-tools/$build_tools/apksigner"
              keytool_bin="$JAVA_HOME/bin/keytool"
              test -x "$keytool_bin"
              run_timed android-temporary-test-signature python3 .github/scripts/android/android_apk_signing.py sign-test \
                --unsigned-app "$unsigned_app" --unsigned-companion "$unsigned_companion" \
                --signed-app "$signed_app" --signed-companion "$signed_companion" \
                --apksigner "$apksigner_bin" --keytool "$keytool_bin"
              printf 'ANDROID_SIGNED_APP=%s\nANDROID_SIGNED_COMPANION=%s\n' \
                "$signed_app" "$signed_companion" >> "$GITHUB_ENV"
              emulator_bin="$sdk_root/emulator/emulator"
              test -x "$emulator_bin"
              android_sdk_home="$RUNNER_TEMP/dobbyvpn-android"
              export ANDROID_SDK_HOME="$android_sdk_home"
              export ANDROID_USER_HOME="$android_sdk_home/.android"
              export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
              mkdir -p "$ANDROID_AVD_HOME"
              printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
              printf 'Android AVD home: %s\n' "$ANDROID_AVD_HOME"
              run_timed android-avd-create avdmanager create avd --force --name dobbyvpn-release --package 'system-images;android-35;google_apis;x86_64' --device pixel_2
              test -s "$ANDROID_AVD_HOME/dobbyvpn-release.ini"
              avd_list_stdout="$RUN_DIR/android-avds.stdout.log"
              avd_list_stderr="$RUN_DIR/android-avds.stderr.log"
              if ! run_timed android-avd-list "$emulator_bin" -list-avds >"$avd_list_stdout" 2>"$avd_list_stderr"; then
                cat "$avd_list_stdout" >&2
                cat "$avd_list_stderr" >&2
                exit 1
              fi
              cat "$avd_list_stdout" >&2
              cat "$avd_list_stderr" >&2
              avd_found=false
              while IFS= read -r avd_name; do
                if [ "$avd_name" = dobbyvpn-release ]; then avd_found=true; fi
              done < "$avd_list_stdout"
              test "$avd_found" = true
              sudo -n chown "$(id -un)" /dev/kvm
              run_timed android-emulator-acceleration-check "$emulator_bin" -accel-check
              adb_listener_stdout="$RUN_DIR/android-adb-listener-5037.stdout.log"
              adb_listener_stderr="$RUN_DIR/android-adb-listener-5037.stderr.log"
              if run_timed android-adb-listener-5037 ss -H -ltnp 'sport = :5037' \
                >"$adb_listener_stdout" 2>"$adb_listener_stderr"; then
                adb_listener_status=0
              else
                adb_listener_status=$?
              fi
              cat "$adb_listener_stdout" || printf 'could not forward Android ADB listener stdout: %s\n' "$adb_listener_stdout" >&2
              cat "$adb_listener_stderr" >&2 || printf 'could not forward Android ADB listener stderr: %s\n' "$adb_listener_stderr" >&2
              if [ "$adb_listener_status" -ne 0 ]; then
                printf 'Host ADB tracing unavailable: listener inspection failed (status %s); leaving any existing ADB server untouched.\n' \
                  "$adb_listener_status" >&2
              elif [ -s "$adb_listener_stdout" ]; then
                printf 'Host ADB tracing unavailable: an existing listener uses port 5037; leaving it untouched.\n' >&2
              else
                adb_start_stdout="$RUN_DIR/android-adb-start-server.stdout.log"
                adb_start_stderr="$RUN_DIR/android-adb-start-server.stderr.log"
                if run_timed android-adb-start-server env ADB_TRACE=transport,sockets \
                  ANDROID_ADB_LOG_PATH="$RUN_DIR/android-adb-server.log" adb start-server \
                  >"$adb_start_stdout" 2>"$adb_start_stderr"; then
                  adb_start_status=0
                else
                  adb_start_status=$?
                fi
                cat "$adb_start_stdout" || printf 'could not forward Android ADB start-server stdout: %s\n' "$adb_start_stdout" >&2
                cat "$adb_start_stderr" >&2 || printf 'could not forward Android ADB start-server stderr: %s\n' "$adb_start_stderr" >&2
                if [ "$adb_start_status" -ne 0 ]; then
                  printf 'Host ADB tracing unavailable: adb start-server failed (status %s); no retry or server restart attempted.\n' \
                    "$adb_start_status" >&2
                else
                  adb_status_stdout="$RUN_DIR/android-adb-server-status.stdout.log"
                  adb_status_stderr="$RUN_DIR/android-adb-server-status.stderr.log"
                  if run_timed android-adb-server-status adb server-status \
                    >"$adb_status_stdout" 2>"$adb_status_stderr"; then
                    adb_status_status=0
                  else
                    adb_status_status=$?
                  fi
                  cat "$adb_status_stdout" || printf 'could not forward Android ADB server-status stdout: %s\n' "$adb_status_stdout" >&2
                  cat "$adb_status_stderr" >&2 || printf 'could not forward Android ADB server-status stderr: %s\n' "$adb_status_stderr" >&2
                  if [ "$adb_status_status" -ne 0 ]; then
                    printf 'Host ADB server status unavailable: adb server-status failed (status %s).\n' \
                      "$adb_status_status" >&2
                  fi
                fi
              fi
              # The captured 67,072-byte adbd VSOCK write failed ENOMEM. Limit each
              # upstream linear skb packet allocation to 16 KiB; fragmentation remains
              # a hypothesis, and the guest readback below verifies this launch setting.
              "$emulator_bin" -avd dobbyvpn-release -debug adb,adbserver,adbclient,log \
                -no-window -no-audio -no-boot-anim -no-snapshot \
                -qemu -append 'vmw_vsock_virtio_transport_common.virtio_transport_max_vsock_pkt_buf_size=16384' \
                > "$RUN_DIR/android-emulator.stdout.log" \
                2> "$RUN_DIR/android-emulator.stderr.log" &
              emulator_pid=$!
              printf '%s\n' "$emulator_pid" > "$RUN_DIR/android-emulator.pid"
              export ANDROID_EMULATOR_PID="$emulator_pid"
              printf 'ANDROID_EMULATOR_PID=%s\n' "$emulator_pid" >> "$GITHUB_ENV"
              if ! run_timed android-emulator-adb-ready timeout 120s adb wait-for-device; then
                echo "Android emulator did not become visible to ADB" >&2
                exit 1
              fi
              wait_for_android_boot() {
                local booted=false
                for _ in $(seq 1 120); do
                  [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && booted=true && break
                  sleep 1
                done
                test "$booted" = true
              }
              run_timed android-emulator-boot wait_for_android_boot
              adbd_trace_status=0
              adbd_setup_deadline="$(python3 -c 'import os,time; print(min(float(os.environ["RUN_DEADLINE_EPOCH"]), time.time() + 30))')"
              run_timed android-adbd-trace-prepare python3 -m torturer_runner.android_adbd_diagnostics prepare \
                --adb "$(command -v adb)" --run-dir "$RUN_DIR" --deadline-epoch "$adbd_setup_deadline" \
                || adbd_trace_status=$?
              run_timed android-emulator-root timeout 120s bash .github/scripts/android/require_adb_root.sh "$RUN_DIR"
              if [ "$adbd_trace_status" -eq 0 ]; then
                adbd_verify_deadline="$(python3 -c 'import os,time; print(min(float(os.environ["RUN_DEADLINE_EPOCH"]), time.time() + 30))')"
                run_timed android-adbd-trace-verify python3 -m torturer_runner.android_adbd_diagnostics verify \
                  --adb "$(command -v adb)" --run-dir "$RUN_DIR" --deadline-epoch "$adbd_verify_deadline" \
                  || adbd_trace_status=$?
              fi
              if [ "$adbd_trace_status" -ne 0 ]; then
                printf 'Android daemon tracing unavailable (status %s); complete setup diagnostics are retained.\n' "$adbd_trace_status" >&2
                if [ "$ANDROID_DIAGNOSTIC_SCENARIO" = android.n11-consent-grant-selection ]; then
                  exit "$adbd_trace_status"
                fi
              fi
              # Verify the guest VSOCK packet limit requested at launch before installation.
              vsock_limit_stdout="$RUN_DIR/android-vsock-packet-limit.stdout.log"
              vsock_limit_stderr="$RUN_DIR/android-vsock-packet-limit.stderr.log"
              if ! vsock_limit_timeout="$(python3 -c 'import os,time; remaining=float(os.environ["RUN_DEADLINE_EPOCH"])-time.time(); print(f"{remaining:.9f}" if remaining > 0 else "")')"; then
                printf 'Android VSOCK packet limit readback cannot compute remaining qualification time; refusing to run tests.\n' >&2
                exit 1
              fi
              if [ -z "$vsock_limit_timeout" ]; then
                printf 'Android VSOCK packet limit readback skipped: qualification deadline has expired; refusing to run tests.\n' >&2
                exit 1
              fi
              if run_timed android-vsock-packet-limit-readback timeout --signal=KILL "${vsock_limit_timeout}s" adb shell cat \
                /sys/module/vmw_vsock_virtio_transport_common/parameters/virtio_transport_max_vsock_pkt_buf_size \
                >"$vsock_limit_stdout" 2>"$vsock_limit_stderr"; then
                vsock_limit_status=0
              else
                vsock_limit_status=$?
              fi
              cat "$vsock_limit_stdout"
              cat "$vsock_limit_stderr" >&2
              if [ "$vsock_limit_status" -ne 0 ]; then
                printf 'Android VSOCK packet limit readback failed (status %s); refusing to run tests.\n' \
                  "$vsock_limit_status" >&2
                exit "$vsock_limit_status"
              fi
              vsock_limit_value="$(tr -d '\r' < "$vsock_limit_stdout")"
              if [ "$vsock_limit_value" != 16384 ]; then
                printf 'Android VSOCK packet limit mismatch: expected 16384, observed:\n' >&2
                cat "$vsock_limit_stdout" >&2
                exit 1
              fi
              signed="$signed_app"
              companion="$signed_companion"
              test -f "$signed"; test -f "$companion"
              test -x "$apksigner_bin"
              signed_cert_stdout="$RUN_DIR/apksigner-signed.stdout.log"
              signed_cert_stderr="$RUN_DIR/apksigner-signed.stderr.log"
              companion_cert_stdout="$RUN_DIR/apksigner-companion.stdout.log"
              companion_cert_stderr="$RUN_DIR/apksigner-companion.stderr.log"
              if ! run_timed android-signed-apk-verify "$apksigner_bin" verify --print-certs "$signed" >"$signed_cert_stdout" 2>"$signed_cert_stderr"; then
                cat "$signed_cert_stdout" >&2
                cat "$signed_cert_stderr" >&2
                exit 1
              fi
              if ! run_timed android-companion-apk-verify "$apksigner_bin" verify --print-certs "$companion" >"$companion_cert_stdout" 2>"$companion_cert_stderr"; then
                cat "$companion_cert_stdout" >&2
                cat "$companion_cert_stderr" >&2
                exit 1
              fi
              cat "$signed_cert_stdout" "$signed_cert_stderr" "$companion_cert_stdout" "$companion_cert_stderr" >&2
              signed_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$signed_cert_stdout")"
              companion_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$companion_cert_stdout")"
              cert_digest_re='^([0-9A-Fa-f]{64}|[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31})$'
              [[ "$signed_cert" =~ $cert_digest_re ]]
              test "$signed_cert" = "$companion_cert"
              run_timed android-signed-apk-install adb install -r "$signed"
              run_timed android-companion-apk-install adb install -r -t "$companion"
              printf 'ADB=%s\n' "$(command -v adb)" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Start Android live ADB diagnostics
        if: inputs.platform == 'android'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/android/android_emulator_diagnostics.py start \
            --adb "$ADB" --run-dir "$RUN_DIR" --deadline-epoch "$RUN_DEADLINE_EPOCH"

      - name: Record observed platform version
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            linux)
              test -r /etc/os-release
              . /etc/os-release
              platform_version="${ID:-linux}-${VERSION_ID:-unknown}"
              ;;
            windows)
              platform_version="$(powershell.exe -NoLogo -NoProfile -NonInteractive -Command '[Environment]::OSVersion.Version.ToString()' | tr -d '\r\n')"
              ;;
            macos)
              platform_version="$(sw_vers -productVersion | tr -d '\r\n')"
              ;;
            android)
              release="$("$ADB" shell getprop ro.build.version.release | tr -d '\r\n')"
              api="$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r\n')"
              platform_version="android-${release}-api-${api}"
              ;;
            *)
              printf 'unsupported platform=%s\n' "$PLATFORM" >&2
              exit 1
              ;;
          esac
          test -n "$platform_version"
          test "$platform_version" != "$PLATFORM"
          printf 'PLATFORM_VERSION=%s\n' "$platform_version" >> "$GITHUB_ENV"

      - name: Exercise the native Android UI
        if: inputs.platform == 'android' && inputs.diagnostic_scenario != 'android.n11-consent-grant-selection'
        shell: bash
        run: |
          set -euo pipefail
          # Start the 420-second UI allowance before setup diagnostics and
          # method selection, and clip it to the inherited qualification end.
          ui_deadline_monotonic="$(python3 - <<'PYTHON'
          import os
          import time

          monotonic_now = time.monotonic()
          wall_now = time.time()
          inherited_remaining = max(0.0, float(os.environ["RUN_DEADLINE_EPOCH"]) - wall_now)
          print(f"{min(monotonic_now + 420.0, monotonic_now + inherited_remaining):.9f}")
          PYTHON
          )"
          export ANDROID_UI_SUPERVISION_DEADLINE_MONOTONIC="$ui_deadline_monotonic"
          # This is the same release APK installed for the functional lane,
          # not the renderer-only helper. UI Automator launches the production
          # Compose activity, enters synthetic invalid input through the native
          # touch/input path, and verifies the visible failure/reopen flow.
          # The functional lane below owns the real profile, VPN consent,
          # traffic, Connect, and Disconnect checks.
          ui_stdout="$RUN_DIR/android-native-ui.stdout.log"
          ui_stderr="$RUN_DIR/android-native-ui.stderr.log"
          # Torturer owns serial lookup and the one bounded IME capture.
          capture_android_ime_diagnostics() {
            local phase="$1"
            python3 - "$phase" <<'PYTHON'
          import os
          import sys
          import time
          from pathlib import Path

          from torturer_runner.local_vm_android import capture_android_ime_diagnostics

          phase = sys.argv[1]
          run_dir = Path(os.environ["RUN_DIR"])
          logs = run_dir / f"android-native-ui-ime-{phase}"
          if phase == "failure":
              # Failure evidence may use bounded time left in the qualification
              # recovery window; it never extends the UI allowance or starts tests.
              global_remaining = max(0.0, float(os.environ["RUN_DEADLINE_EPOCH"]) - time.time())
              owner_deadline = time.monotonic() + global_remaining
          else:
              owner_deadline = float(os.environ["ANDROID_UI_SUPERVISION_DEADLINE_MONOTONIC"])
          for error in capture_android_ime_diagnostics(
              os.environ["ADB"],
              run_dir=run_dir,
              logs=logs,
              phase=phase,
              owner_deadline=owner_deadline,
              environment=os.environ.copy(),
          ):
              print(error, file=sys.stderr)
          PYTHON
          }
          capture_android_ime_diagnostics setup || true
          ui_status=0
          ui_timed_out=false
          ui_methods="$(PYTHONPATH="$GITHUB_WORKSPACE/torturer${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -c 'from torturer_runner.native_cases import ANDROID_DEFAULT_UI_METHODS; print(",".join(ANDROID_DEFAULT_UI_METHODS))')"
          # The lifecycle suite uses the remaining UI allowance for both the
          # outer ADB process and the native watcher; neither timer restarts.
          ui_timeout="$(python3 - <<'PYTHON'
          import os
          import time

          remaining = max(0.0, float(os.environ["ANDROID_UI_SUPERVISION_DEADLINE_MONOTONIC"]) - time.monotonic())
          print(repr(remaining) if remaining > 0 else "0")
          PYTHON
          )"
          if [ "$ui_timeout" = 0 ]; then
            ui_timed_out=true
            ui_status=124
            printf 'Android UI supervision expired before instrumentation started; no further test work was launched.\n' >&2
          else
            printf 'Android UI remaining supervision seconds: %s\n' "$ui_timeout" >&2
            timeout --foreground "${ui_timeout}s" "$ADB" shell am instrument -w -r \
              -e class "$ui_methods" \
              -e dobbyvpn_native_timeout_seconds "$ui_timeout" \
              com.dobby.vpn.test/androidx.test.runner.AndroidJUnitRunner \
              >"$ui_stdout" 2>"$ui_stderr" || ui_status=$?
          fi
          if [ "$ui_status" -eq 124 ]; then
            ui_timed_out=true
          fi
          parser_args=(
            --stdout "$ui_stdout" --stderr "$ui_stderr"
            --returncode "$ui_status"
          )
          IFS=, read -r -a selected_methods <<< "$ui_methods"
          for method in "${selected_methods[@]}"; do
            parser_args+=(--expected-method "$method")
          done
          if [ "$ui_timed_out" = true ]; then
            parser_args+=(--timed-out)
          fi
          parser_status=0
          PYTHONPATH="$GITHUB_WORKSPACE/torturer${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m torturer_runner.android_instrumentation \
            "${parser_args[@]}" || parser_status=$?
          if [ "$parser_status" -ne 0 ]; then
            capture_android_ime_diagnostics failure || true
          fi
          printf '%s\n' '[android-native-ui stdout]' >&2
          if [ -f "$ui_stdout" ]; then
            cat "$ui_stdout" >&2
          else
            printf 'Android native UI stdout was not created because instrumentation did not start.\n' >&2
          fi
          printf '%s\n' '[android-native-ui stderr]' >&2
          if [ -f "$ui_stderr" ]; then
            cat "$ui_stderr" >&2
          else
            printf 'Android native UI stderr was not created because instrumentation did not start.\n' >&2
          fi
          printf 'ANDROID_UI_TEST_PARSER_STATUS=%s\n' "$parser_status" >> "$GITHUB_ENV"
          if [ "$parser_status" -ne 0 ]; then
            exit 1
          fi

      - name: Retain Android native UI screenshots
        if: always() && inputs.platform == 'android' && inputs.diagnostic_scenario != 'android.n11-consent-grant-selection'
        shell: bash
        run: |
          set -euo pipefail
          ui_stdout="$RUN_DIR/android-native-ui.stdout.log"
          if [ ! -s "$ui_stdout" ]; then
            printf 'Android UI screenshot collection failed: complete instrumentation stdout is unavailable: %s\n' "$ui_stdout" >&2
            exit 1
          fi
          destination="$RUN_DIR/screenshots/android-native-ui"
          mkdir -p "$destination"
          screenshot_count=0
          collection_status=0
          while IFS= read -r line; do
            if [[ ! "$line" =~ ^INSTRUMENTATION_STATUS:\ stream=DOBBY_UI_SCREENSHOT\ label=([A-Za-z0-9_-]+)\ path=(/data/user/0/com\.dobby\.vpn/files/dobbyvpn-rendered-screenshots/[A-Za-z0-9_-]+\.png)\ bytes=([0-9]+)\ sha256=([0-9a-f]{64})\ width=([1-9][0-9]*)\ height=([1-9][0-9]*)$ ]]; then
              printf 'Android UI screenshot marker is malformed; the complete original marker remains in %s: %s\n' "$ui_stdout" "$line" >&2
              collection_status=1
              continue
            fi
            label="${BASH_REMATCH[1]}"
            remote="${BASH_REMATCH[2]}"
            expected_bytes="${BASH_REMATCH[3]}"
            expected_sha="${BASH_REMATCH[4]}"
            target="$destination/$label.png"
            partial="$target.partial"
            screenshot_count=$((screenshot_count + 1))
            if [ -e "$target" ] || [ -e "$partial" ]; then
              printf 'Android UI screenshot label was emitted more than once: %s\n' "$label" >&2
              collection_status=1
              continue
            fi
            if ! "$ADB" pull "$remote" "$partial"; then
              collection_status=1
              continue
            fi
            actual_bytes="$(wc -c < "$partial" | tr -d '[:space:]')"
            actual_sha="$(sha256sum "$partial")"
            actual_sha="${actual_sha%% *}"
            if [ "$actual_bytes" != "$expected_bytes" ] || [ "$actual_sha" != "$expected_sha" ]; then
              printf 'Android UI screenshot transfer mismatch: label=%s expected_bytes=%s actual_bytes=%s expected_sha256=%s actual_sha256=%s; downloaded bytes remain at %s\n' \
                "$label" "$expected_bytes" "$actual_bytes" "$expected_sha" "$actual_sha" "$partial" >&2
              collection_status=1
              continue
            fi
            mv "$partial" "$target"
            printf 'Android UI screenshot retained and matched its complete instrumentation marker: label=%s bytes=%s sha256=%s path=%s\n' \
              "$label" "$actual_bytes" "$actual_sha" "$target"
          done < <(grep -a '^INSTRUMENTATION_STATUS: stream=DOBBY_UI_SCREENSHOT ' "$ui_stdout")
          if [ "$screenshot_count" -eq 0 ]; then
            printf 'Android UI screenshot collection failed: instrumentation emitted no screenshot markers; complete output remains in %s\n' "$ui_stdout" >&2
            collection_status=1
          fi
          if [ "${ANDROID_UI_TEST_PARSER_STATUS:-}" = 0 ]; then
            for label in startup failure-state reopened; do
              if [ ! -f "$destination/$label.png" ]; then
                printf 'Android UI screenshot collection failed: successful UI run is missing required screenshot label=%s\n' "$label" >&2
                collection_status=1
              fi
            done
          elif [ ! -f "$destination/failure.png" ]; then
            printf 'Android UI screenshot collection failed: failed UI run is missing its failure screenshot\n' >&2
            collection_status=1
          fi
          exit "$collection_status"

      - name: Start installed service
        if: inputs.platform != 'android'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = windows ]; then
            SERVICE_WIN="$(cygpath -w "$SERVICE")"
            SERVICE_OUT_WIN="$(cygpath -w "$RUN_DIR/service.log.stdout")"
            SERVICE_ERR_WIN="$(cygpath -w "$RUN_DIR/service.log.stderr")"
            SERVICE_LOG_PATH_WIN="$(cygpath -w "$RUN_DIR/service.log")"
            SERVICE_LOG_ROOT_WIN="$(cygpath -w "$RUN_DIR")"
            SERVICE_PID_FILE="$RUN_DIR/windows-service.pid"
            SERVICE_PID_FILE_WIN="$(cygpath -w "$SERVICE_PID_FILE")"
            SERVICE_START_LOG="$RUN_DIR/windows-service-start.log"
            export SERVICE_WIN SERVICE_OUT_WIN SERVICE_ERR_WIN SERVICE_LOG_PATH_WIN SERVICE_LOG_ROOT_WIN SERVICE_PID_FILE_WIN
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '
          $ErrorActionPreference = "Stop"
          [Console]::Error.WriteLine("Resolving MSI-managed service")
          $installed = Get-Service -Name "DobbyVPN Go backend"
          if ($installed.Status -ne "Stopped") {
            [Console]::Error.WriteLine("Stopping MSI-managed service")
            Stop-Service -InputObject $installed -Force
            $installed.WaitForStatus("Stopped", [TimeSpan]::FromSeconds(30))
            [Console]::Error.WriteLine("MSI-managed service stopped")
          }
          $env:DOBBY_LOG_PATH = $env:SERVICE_LOG_PATH_WIN
          $env:DOBBY_LOG_ROOT = $env:SERVICE_LOG_ROOT_WIN
          [Console]::Error.WriteLine("Starting qualification process")
          $process = Start-Process -FilePath $env:SERVICE_WIN -ArgumentList @("-mode", "normal") -RedirectStandardOutput $env:SERVICE_OUT_WIN -RedirectStandardError $env:SERVICE_ERR_WIN -PassThru
          $identityTemporaryFile = $null
          $startupError = $null
          try {
            [Console]::Error.WriteLine("Qualification process started")
            $service = Get-CimInstance -ClassName Win32_Process -Filter ("ProcessId = {0}" -f $process.Id) -ErrorAction Stop
            if ($null -eq $service) { throw "Qualification process exited before its identity was recorded: pid=$($process.Id)" }
            if ($null -eq $service.CreationDate -or [string]::IsNullOrWhiteSpace($service.ExecutablePath)) {
              throw "Qualification process identity is unavailable: pid=$($process.Id)"
            }
            $creationTicks = $service.CreationDate.ToUniversalTime().Ticks
            $identity = "{0}|{1}|{2}" -f $service.ProcessId, $creationTicks, $service.ExecutablePath
            $encoding = [System.Text.UTF8Encoding]::new($false)
            $identityTemporaryFile = $env:SERVICE_PID_FILE_WIN + "." + [guid]::NewGuid().ToString("N") + ".tmp"
            [System.IO.File]::WriteAllText($identityTemporaryFile, $identity + [Environment]::NewLine, $encoding)
            [Console]::Error.WriteLine("Qualification process identity prepared: pid=$($process.Id) ticks=$creationTicks path=$($service.ExecutablePath)")
            [System.IO.File]::Move($identityTemporaryFile, $env:SERVICE_PID_FILE_WIN)
            $identityTemporaryFile = $null
          } catch {
            $startupError = $_
            if ($null -ne $identityTemporaryFile -and [System.IO.File]::Exists($identityTemporaryFile)) {
              try {
                [System.IO.File]::Delete($identityTemporaryFile)
              } catch {
                $cleanupDiagnostic = $_ | Format-List * -Force | Out-String -Width 4096
                [Console]::Error.WriteLine("Qualification process identity temporary-file cleanup failed: path=$identityTemporaryFile`n$cleanupDiagnostic")
              }
            }
            $killRequired = $true
            try {
              $killRequired = -not $process.HasExited
            } catch {
              $cleanupDiagnostic = $_ | Format-List * -Force | Out-String -Width 4096
              [Console]::Error.WriteLine("Qualification process state query failed after startup failure: pid=$($process.Id)`n$cleanupDiagnostic")
            }
            if ($killRequired) {
              try {
                $process.Kill()
              } catch {
                $cleanupDiagnostic = $_ | Format-List * -Force | Out-String -Width 4096
                [Console]::Error.WriteLine("Qualification process termination failed after startup failure: pid=$($process.Id)`n$cleanupDiagnostic")
              }
            }
            try {
              if (-not $process.WaitForExit(30000)) { throw "Qualification process did not stop after startup failure: pid=$($process.Id)" }
              [Console]::Error.WriteLine("Qualification process stopped after startup failure: pid=$($process.Id)")
            } catch {
              $cleanupDiagnostic = $_ | Format-List * -Force | Out-String -Width 4096
              [Console]::Error.WriteLine("Qualification process reap failed after startup failure: pid=$($process.Id)`n$cleanupDiagnostic")
            }
            throw $startupError
          } finally {
            try {
              $process.Dispose()
            } catch {
              $cleanupDiagnostic = $_ | Format-List * -Force | Out-String -Width 4096
              [Console]::Error.WriteLine("Qualification process handle disposal failed: pid=$($process.Id)`n$cleanupDiagnostic")
              if ($null -eq $startupError) { throw }
            }
          }
          ' > "$SERVICE_START_LOG" 2>&1 &
            launcher_pid=$!
            for _ in $(seq 1 30); do
              [ -s "$SERVICE_PID_FILE" ] && break
              if ! kill -0 "$launcher_pid"; then
                if ! wait "$launcher_pid"; then
                  printf 'Windows service launcher exited nonzero before publishing its PID\n' >&2
                fi
                break
              fi
              sleep 1
            done
            cat "$SERVICE_START_LOG" >&2
            if [ ! -s "$SERVICE_PID_FILE" ]; then
              exit 1
            fi
            IFS='|' read -r service_pid service_creation_ticks service_executable_path < "$SERVICE_PID_FILE"
            [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
            [[ "$service_creation_ticks" =~ ^[1-9][0-9]*$ ]]
            [[ -n "$service_executable_path" ]]
            if kill "$launcher_pid"; then
              if ! wait "$launcher_pid"; then
                printf 'Windows service launcher exited nonzero after publishing its PID\n' >&2
              fi
            elif ! wait "$launcher_pid"; then
              printf 'Windows service launcher had already exited nonzero\n' >&2
            fi
          elif [ "$PLATFORM" = macos ]; then
            launchd_stdout="$RUN_DIR/macos-launchd-print.stdout.log"
            launchd_stderr="$RUN_DIR/macos-launchd-print.stderr.log"
            if ! launchctl print system/com.dobby.vpnservice > "$launchd_stdout" 2> "$launchd_stderr"; then
              cat "$launchd_stdout" >&2
              cat "$launchd_stderr" >&2
              exit 1
            fi
            cat "$launchd_stdout" >&2
            cat "$launchd_stderr" >&2
            service_pid="$(python3 - "$launchd_stdout" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          matches = re.findall(r"(?m)^\s*pid\s*=\s*([1-9][0-9]*)\s*$", text)
          if len(matches) != 1:
              raise SystemExit("launchd service PID is missing or ambiguous")
          print(matches[0])
          PY
            )"
            [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
          else
            # Linux retains its existing candidate service launcher.
            service_pid="$(sudo -n sh -c '
              set -eu
              binary=$1
              control_socket=$2
              peer_uid=$3
              library_path=$4
              log_path=$5
              stdout_path=$6
              stderr_path=$7
              if [ -n "$library_path" ]; then
                env LD_LIBRARY_PATH="$library_path" DOBBYVPN_CONTROL_SOCKET="$control_socket" DOBBYVPN_CONTROL_PEER_UID="$peer_uid" DOBBY_LOG_PATH="$log_path" DOBBY_LOG_ROOT="$(dirname "$log_path")" "$binary" > "$stdout_path" 2> "$stderr_path" < /dev/null &
              else
                env DOBBYVPN_CONTROL_SOCKET="$control_socket" DOBBYVPN_CONTROL_PEER_UID="$peer_uid" DOBBY_LOG_PATH="$log_path" DOBBY_LOG_ROOT="$(dirname "$log_path")" "$binary" > "$stdout_path" 2> "$stderr_path" < /dev/null &
              fi
              printf "%s\\n" "$!"
            ' dobbyvpn-service "$SERVICE" "$SERVICE_SOCKET" "$(id -u)" "${SERVICE_LIBRARY_PATH:-}" "$RUN_DIR/service.log" "$RUN_DIR/service.log.stdout" "$RUN_DIR/service.log.stderr")"
            [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$service_pid" =~ ^[1-9][0-9]*$ ]]
          printf 'SERVICE_BINARY=%s\nSERVICE_PID=%s\n' "$SERVICE" "$service_pid" >> "$GITHUB_ENV"
          sleep 2

      - name: Run canonical test set against exact selected package
        id: functional
        env:
          DIAGNOSTIC_SCENARIO: ${{ inputs.diagnostic_scenario }}
        working-directory: torturer
        shell: bash
        run: |
          set -euo pipefail
          lane_timeout=$((RUN_DEADLINE_EPOCH - $(date +%s) - 300))
          if [ "$lane_timeout" -le 0 ]; then
            printf 'functional lane has no provider-bound execution budget\n' >&2
            exit 1
          fi
          if [ "$PLATFORM" = android ]; then
            scenario_args=()
            if [ "$DIAGNOSTIC_SCENARIO" = android.n11-consent-grant-selection ]; then
              scenario_args=(--android-n11-only)
            elif [ -n "$DIAGNOSTIC_SCENARIO" ]; then
              scenario_args=(--scenario "$DIAGNOSTIC_SCENARIO")
            fi
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_runner.hosted \
              --platform android --suite mini --adb "$ADB" --profile "$GITHUB_WORKSPACE/fixtures/profile.toml" --source-sha "$DOBBYVPN_COMMIT_SHA" \
              --app-apk "$ANDROID_SIGNED_APP" --test-companion-apk "$ANDROID_SIGNED_COMPANION" \
              --platform-version "$PLATFORM_VERSION" --lane-timeout-seconds "$lane_timeout" --output "$RESULT_PATH" \
              --raw-log-dir "$RUN_DIR" "${scenario_args[@]}"
          else
            release_args=(
              test
              --mode hosted
              --platform "$PLATFORM"
              --installed-descriptor "$INSTALLED_DESCRIPTOR"
              --profile "$GITHUB_WORKSPACE/fixtures/profile.toml"
              --suite mini
              --platform-version "$PLATFORM_VERSION"
              --lane-timeout-seconds "$lane_timeout"
              --output "$RESULT_PATH"
              --raw-log-dir "$RUN_DIR"
              --service-pid "$SERVICE_PID"
            )
            if [ "$PLATFORM" = windows ]; then
              release_args+=(--service-pipe "$SERVICE_PIPE")
            else
              release_args+=(--service-socket "$SERVICE_SOCKET")
            fi
            if [ "$PLATFORM" = linux ]; then
              export DOBBYVPN_CONTROL_SOCKET="$SERVICE_SOCKET"
            fi
            env PYTHONPATH="$GITHUB_WORKSPACE/torturer" python3 -m torturer_runner.desktop_platform "${release_args[@]}"
          fi

      - name: Stop Android live ADB diagnostics
        if: always() && inputs.platform == 'android' && env.RUN_DIR != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/android/android_emulator_diagnostics.py stop \
            --run-dir "$RUN_DIR"

      - name: Stop Linux qualification service
        if: always() && inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SERVICE_PID:-}" ]; then
            if sudo -n kill -0 "$SERVICE_PID"; then
              sudo -n kill -TERM "$SERVICE_PID"
              sleep 2
              if sudo -n kill -0 "$SERVICE_PID"; then
                sudo -n kill -KILL "$SERVICE_PID"
                sleep 1
              fi
            else
              printf 'Linux qualification service was already stopped before cleanup: pid=%s\n' "$SERVICE_PID"
            fi
          fi
          if [ -n "${SERVICE_SOCKET:-}" ]; then
            sudo -n rm -f "$SERVICE_SOCKET"
          fi
          if [ -n "${CONTROL_DIR:-}" ] && [ -d "$CONTROL_DIR" ]; then
            sudo -n rmdir "$CONTROL_DIR"
          fi

      - name: Stop Windows qualification process
        if: always() && inputs.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stop_status=0
          service_identity_file="$RUN_DIR/windows-service.pid"
          if [ -s "$service_identity_file" ]; then
            if SERVICE_IDENTITY_FILE_WIN="$(cygpath -w "$service_identity_file")"; then
              export SERVICE_IDENTITY_FILE_WIN
              powershell.exe -NoLogo -NoProfile -NonInteractive -Command '
          $ErrorActionPreference = "Stop"
          $record = [System.IO.File]::ReadAllText($env:SERVICE_IDENTITY_FILE_WIN).TrimEnd("`r", "`n")
          $parts = $record -split "\|", 3
          if ($parts.Count -ne 3) { throw "Windows qualification process identity record is malformed" }
          $servicePid = 0
          $expectedTicks = [long]0
          if (-not [int]::TryParse($parts[0], [ref]$servicePid) -or $servicePid -le 0) {
            throw "Windows qualification process identity record has an invalid PID"
          }
          if (-not [long]::TryParse($parts[1], [ref]$expectedTicks) -or $expectedTicks -le 0) {
            throw "Windows qualification process identity record has invalid creation ticks"
          }
          $expectedPath = $parts[2]
          if ([string]::IsNullOrWhiteSpace($expectedPath)) {
            throw "Windows qualification process identity record has no executable path"
          }
          $preliminaryProcess = Get-CimInstance -ClassName Win32_Process -Filter ("ProcessId = {0}" -f $servicePid) -ErrorAction Stop
          if ($null -eq $preliminaryProcess) {
            Write-Output "Windows qualification process was already stopped: pid=$servicePid"
            exit 0
          }
          if ($null -eq $preliminaryProcess.CreationDate -or [string]::IsNullOrWhiteSpace($preliminaryProcess.ExecutablePath)) {
            throw "Windows qualification process identity query returned incomplete data: pid=$servicePid"
          }
          if ($preliminaryProcess.CreationDate.ToUniversalTime().Ticks -ne $expectedTicks -or -not [System.StringComparer]::OrdinalIgnoreCase.Equals($preliminaryProcess.ExecutablePath, $expectedPath)) {
            Write-Output "Windows qualification process identity changed; original instance already stopped: pid=$servicePid"
            exit 0
          }
          $ownedProcess = Get-Process -Id $servicePid -ErrorAction Stop
          try {
            $nativeHandle = $ownedProcess.Handle
            $process = Get-CimInstance -ClassName Win32_Process -Filter ("ProcessId = {0}" -f $servicePid) -ErrorAction Stop
            if ($null -eq $process) {
              Write-Output "Windows qualification process was already stopped: pid=$servicePid"
            } elseif ($null -eq $process.CreationDate -or [string]::IsNullOrWhiteSpace($process.ExecutablePath)) {
              throw "Windows qualification process identity query returned incomplete data: pid=$servicePid"
            } else {
              $actualTicks = $process.CreationDate.ToUniversalTime().Ticks
              $pathMatches = [System.StringComparer]::OrdinalIgnoreCase.Equals($process.ExecutablePath, $expectedPath)
              if ($actualTicks -ne $expectedTicks -or -not $pathMatches) {
                Write-Output "Windows qualification process identity changed; original instance already stopped: pid=$servicePid"
              } else {
                $ownedProcess.Kill()
                if (-not $ownedProcess.WaitForExit(30000)) { throw "Windows qualification process did not stop: pid=$servicePid" }
                Write-Output "Windows qualification process stopped: pid=$servicePid"
              }
            }
          } finally {
            $ownedProcess.Dispose()
          }
          ' || stop_status=$?
            else
              stop_status=$?
              printf 'Windows qualification process identity path conversion failed: status=%s\n' "$stop_status" >&2
            fi
          fi
          forward_status=0
          if [ -f "$RUN_DIR/service.log.stdout" ]; then
            cat "$RUN_DIR/service.log.stdout" || {
              forward_status=$?
              printf 'Windows qualification service stdout forwarding failed: status=%s\n' "$forward_status" >&2
            }
          fi
          if [ -f "$RUN_DIR/service.log.stderr" ]; then
            cat "$RUN_DIR/service.log.stderr" >&2 || {
              cat_status=$?
              printf 'Windows qualification service stderr forwarding failed: status=%s\n' "$cat_status" >&2
              if [ "$forward_status" -eq 0 ]; then forward_status=$cat_status; fi
            }
          fi
          if [ "$stop_status" -ne 0 ]; then exit "$stop_status"; fi
          exit "$forward_status"

      - name: Recover interrupted Linux installer migration
        if: always() && inputs.platform == 'linux' && env.RUN_DIR != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import time

          run_dir = Path(os.environ["RUN_DIR"])
          if any(run_dir.glob("dobbyvpn-installer-migration-*")):
              # Share the existing command runner's standalone cleanup allowance
              # across recovery operations instead of restarting it per command.
              os.environ.setdefault("DOBBYVPN_COMMAND_DEADLINE_MONOTONIC", str(time.monotonic() + 300))
              from torturer_runner.installer_migration import cleanup_interrupted_linux
              cleanup_interrupted_linux(run_dir, log_dir=run_dir / "installer-migration-recovery")
          else:
              print("No interrupted Linux installer migration remains.")
          PY

      - name: Remove exact installed desktop package
        if: always() && inputs.platform != 'android'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$INSTALLED_DESCRIPTOR" ]; then
            printf 'No functional-install descriptor was created; no package remains recorded by this step.\n'
            exit 0
          fi
          python3 .github/scripts/desktop/desktop_package.py uninstall \
            --installed-descriptor "$INSTALLED_DESCRIPTOR" --run-dir "$RUN_DIR"

      - name: Retain installed desktop backend diagnostics
        if: always() && (inputs.platform == 'macos' || inputs.platform == 'windows') && env.RUN_DIR != ''
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/torturer
        run: |
          set -euo pipefail
          if [ ! -s "$INSTALLED_DESCRIPTOR" ]; then
            printf 'No installed package descriptor exists; installed backend logs are unavailable.\n' >&2
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          from torturer_runner.diagnostics import collect_installed_backend_logs

          directory = (
              Path("/Library/Logs/DobbyVPN") if os.environ["PLATFORM"] == "macos"
              else Path(os.environ["PROGRAMDATA"]) / "DobbyVPN" / "Logs"
          )
          errors = []
          collect_installed_backend_logs(directory, Path(os.environ["RUN_DIR"]) / "logs", errors)
          if errors:
              raise RuntimeError("\n".join(errors))
          PY

      - name: Remove Android standalone probe staging
        if: always() && inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          adb_bin="${ADB:-adb}"
          "$adb_bin" shell \
            'for path in /data/local/tmp/dobbyvpn-probe-*; do
               case "$path" in
                 /data/local/tmp/dobbyvpn-probe-*)
                   [ -d "$path" ] || continue
                   rm -rf -- "$path"
                   ;;
               esac
             done'

      - name: Remove Android qualification routing rules
        if: always() && inputs.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          adb_bin="${ADB:-adb}"
          "$adb_bin" shell \
            'inventory="$(iptables -S)" || exit $?
             printf "%s\n" "$inventory"
             while case "$inventory" in *"-A OUTPUT -j DOBBYVPN_TORTURER"*) true;; *) false;; esac; do
               iptables -D OUTPUT -j DOBBYVPN_TORTURER || exit $?
               inventory="$(iptables -S)" || exit $?
               printf "%s\n" "$inventory"
             done
             case "$inventory" in
               *"-N DOBBYVPN_TORTURER"*)
                 iptables -F DOBBYVPN_TORTURER || exit $?
                 iptables -X DOBBYVPN_TORTURER || exit $?
                 ;;
             esac
             inventory="$(iptables -S)" || exit $?
             printf "%s\n" "$inventory"
             case "$inventory" in
               *DOBBYVPN_TORTURER*)
                 echo "Android qualification routing chain remains: DOBBYVPN_TORTURER" >&2
                 exit 1
                 ;;
             esac'

      - name: Collect final Android application diagnostics
        if: always() && inputs.platform == 'android' && env.RUN_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=torturer python3 - <<'PY'
          import os
          from pathlib import Path
          from torturer_runner.local_vm import _run_logged
          from torturer_runner.local_vm_android import _collect_android_diagnostics

          run = Path(os.environ["RUN_DIR"])
          logs = run / "android-final"
          logs.mkdir(parents=True, exist_ok=True)
          environment = os.environ.copy()
          adb = environment.get("ADB", "adb")
          serial = _run_logged(
              [adb, "get-serialno"], cwd=run, logs=logs,
              label="android-final-serial", timeout=30, environment=environment,
          ).stdout.decode().strip()
          errors = _collect_android_diagnostics(
              adb, serial, run_dir=run, logs=logs, timeout=30,
              environment=environment,
          )
          if errors:
              raise RuntimeError("\n".join(errors))
          PY

      - name: Retain Android daemon transport diagnostics
        if: always() && inputs.platform == 'android' && env.ANDROID_EMULATOR_PID != ''
        continue-on-error: ${{ inputs.diagnostic_scenario != 'android.n11-consent-grant-selection' }}
        shell: bash
        run: |
          set -euo pipefail
          # One optional collection budget covers snapshot, transfer and cleanup.
          # Recovery collects diagnostics only; it cannot start another test.
          collection_deadline="$(python3 -c 'import time; print(time.time() + 30)')"
          python3 -m torturer_runner.android_adbd_diagnostics collect \
            --adb "${ADB:-adb}" --run-dir "$RUN_DIR" --deadline-epoch "$collection_deadline"

      - name: Make qualification files readable for diagnostics
        if: always() && env.RUN_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLATFORM" != linux ] && [ "$PLATFORM" != macos ]; then
            exit 0
          fi
          if [ ! -d "$RUN_DIR" ]; then
            printf 'Qualification directory is unavailable before diagnostics collection: %s\n' "$RUN_DIR" >&2
            exit 0
          fi
          # The stopped privileged service also owns rotation generations,
          # raw stderr and lock files. Keep all of them readable by the collector.
          # -h preserves symlink targets; the collector rejects links itself.
          sudo chown -Rh "$(id -u):$(id -g)" "$RUN_DIR"

      - name: Collect complete qualification diagnostics
        if: always() && env.RUN_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_diagnostics.py \
            --source "$RESULT_DIR" \
            --source "$RUN_DIR" \
            --output "$ARTIFACT_DIR"

      - name: Remove disposable profiles from runner
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/fixtures/profile.toml" \
            "$GITHUB_WORKSPACE/fixtures/websocket-profile.toml" \
            "$GITHUB_WORKSPACE/fixtures/trusttunnel-profile.toml"

      - name: Inventory complete qualification diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ARTIFACT_DIR"
          find "$ARTIFACT_DIR" -type f -print

      - name: Retain complete qualification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dobbyvpn-qualification-${{ inputs.platform }}-${{ inputs.architecture || 'default' }}-attempt-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: ${{ inputs.retention_days }}

      - name: Remove disposable qualification scratch
        if: always()
        shell: bash
        run: |
          rm -rf "$RUN_DIR"
          rm -rf "$RESULT_DIR"
          rm -rf "$ARTIFACT_DIR"
          rm -rf "$ANDROID_SIGNED_DIR" "$RUNNER_TEMP/private-android-companion"
