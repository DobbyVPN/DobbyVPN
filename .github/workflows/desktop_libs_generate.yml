name: Build Desktop VPN Libraries

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full lowercase 40-character source commit SHA to build.
        required: true
        type: string

jobs:
  build_desktop_libs:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu
            runner: ubuntu-latest
            platform: linux
            arch: amd64
          - os: macos
            runner: macos-15
            platform: macos
            arch: arm64
          - os: macos
            runner: macos-15-intel
            platform: macos
            arch: amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $actual_sha, expected $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Cache desktop VPN library
        id: desktop_lib_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            go_module/windows_grpcvpnserver.exe
            go_module/ubuntu_grpcvpnserver
            go_module/macos_grpcvpnserver
            go_module/trusttunnel_client
            go_module/dobby_bridge.dll
            go_module/libdobby_bridge.so
            go_module/libc++.so.1
            go_module/libc++abi.so.1
            go_module/wintun.dll
          key: ${{ runner.os }}-${{ matrix.arch }}-desktop-vpn-lib-${{ hashFiles('.go-version', 'go_module/**', '.github/scripts/desktop_build.py', '.github/workflows/desktop_libs_generate.yml') }}

      - name: Set up Go
        if: steps.desktop_lib_cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go_module/go.sum

      # Intel macOS deliberately uses the official CLI helper rather than the
      # arm64-only go-go-tunnel static archive. The release is universal, but
      # it is packaged only with the amd64 service artifact.
      - name: Download official TrustTunnel macOS universal helper
        if: matrix.os == 'macos' && matrix.arch == 'amd64' && steps.desktop_lib_cache.outputs.cache-hit != 'true'
        working-directory: go_module
        shell: bash
        run: |
          curl -#fL -o trusttunnel_client-v1.0.49-macos-universal.tar.gz "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/v1.0.49/trusttunnel_client-v1.0.49-macos-universal.tar.gz"
          echo "f2dab732d17a885dcc4c81831fa4b263db250f5bea8a151416b518e936979c64  trusttunnel_client-v1.0.49-macos-universal.tar.gz" | shasum -a 256 -c -
          tar -xzf trusttunnel_client-v1.0.49-macos-universal.tar.gz --strip-components=1 trusttunnel_client-v1.0.49-macos-universal/trusttunnel_client
          chmod 755 trusttunnel_client
          codesign --verify --strict --verbose=2 trusttunnel_client
          # Preserve the complete codesign diagnostic before deriving the
          # stable TeamIdentifier assertion.
          codesign -dv --verbose=2 trusttunnel_client 2>&1 | tee /dev/stderr | grep -F "TeamIdentifier=TC3Q7MAJXF"
          rm trusttunnel_client-v1.0.49-macos-universal.tar.gz

      - name: Build desktop VPN library
        if: steps.desktop_lib_cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.os }}" == "macos" ] && [ "${{ matrix.arch }}" == "arm64" ]; then
            export CGO_LDFLAGS="-lc++ -framework SystemConfiguration -framework CoreFoundation -framework Security -framework Network"
          elif [ "${{ matrix.os }}" == "macos" ] && [ "${{ matrix.arch }}" == "amd64" ]; then
            # The Intel backend has no go-go-tunnel cgo dependency.
            unset CGO_LDFLAGS
          else
            export CGO_LDFLAGS="-L${{ github.workspace }}/go_module"
          fi
          python .github/scripts/desktop_build.py libs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --go-mod-tidy
        shell: bash

      - name: Verify Windows service runtime closure
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            windows_grpcvpnserver.exe \
            dobby_bridge.dll \
            wintun.dll; do
            path="go_module/$file"
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "Windows service runtime closure is missing a regular $file" >&2
              exit 1
            fi
          done
          python3 - <<'PY'
          from hashlib import file_digest
          from pathlib import Path

          expected = {
              "dobby_bridge.dll": "10e2f921aaa949060bed936e3c361b0967b2ad8b7a71dd983d36abd94c903063",
              "wintun.dll": "e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce",
          }
          for name, digest in expected.items():
              with (Path("go_module") / name).open("rb") as file:
                  actual = file_digest(file, "sha256").hexdigest()
              if actual != digest:
                  raise SystemExit(f"{name} checksum mismatch")
          PY

      - name: Upload built libraries
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows_grpcvpnserver.exe
          path: |
            go_module/windows_grpcvpnserver.exe
            go_module/dobby_bridge.dll
            go_module/wintun.dll
          if-no-files-found: error

      - name: Upload built libraries
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ubuntu_grpcvpnserver
          path: |
            go_module/ubuntu_grpcvpnserver
            go_module/libdobby_bridge.so
            go_module/libc++.so.1
            go_module/libc++abi.so.1
          if-no-files-found: error

      - name: Upload macOS arm64 service
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos_grpcvpnserver-${{ matrix.arch }}
          path: |
            go_module/macos_grpcvpnserver
          if-no-files-found: error

      - name: Upload macOS amd64 service and TrustTunnel helper
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos_grpcvpnserver-${{ matrix.arch }}
          path: |
            go_module/macos_grpcvpnserver
            go_module/trusttunnel_client
          if-no-files-found: error
