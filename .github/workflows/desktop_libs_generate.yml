name: Build shared Go backend and native desktop frontends

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full lowercase 40-character source commit SHA to build.
        required: true
        type: string

env:
  GOTOOLCHAIN: local

jobs:
  build_desktop:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: amd64
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      # Intel macOS uses the official universal helper; the other targets use
      # the in-process TrustTunnel bridge.
      - name: Download official TrustTunnel macOS helper
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        working-directory: go_module
        shell: bash
        run: |
          set -euo pipefail
          curl -#fL -o trusttunnel_client-v1.0.49-macos-universal.tar.gz "https://github.com/TrustTunnel/TrustTunnelClient/releases/download/v1.0.49/trusttunnel_client-v1.0.49-macos-universal.tar.gz"
          echo "f2dab732d17a885dcc4c81831fa4b263db250f5bea8a151416b518e936979c64  trusttunnel_client-v1.0.49-macos-universal.tar.gz" | shasum -a 256 -c -
          tar -xzf trusttunnel_client-v1.0.49-macos-universal.tar.gz --strip-components=1 trusttunnel_client-v1.0.49-macos-universal/trusttunnel_client
          chmod 755 trusttunnel_client
          codesign --verify --strict --verbose=2 trusttunnel_client
          codesign_stdout="$RUNNER_TEMP/trusttunnel-codesign.stdout"
          codesign_stderr="$RUNNER_TEMP/trusttunnel-codesign.stderr"
          set +e
          codesign -dv --verbose=2 trusttunnel_client >"$codesign_stdout" 2>"$codesign_stderr"
          status=$?
          set -e
          cat "$codesign_stdout"
          cat "$codesign_stderr" >&2
          test "$status" -eq 0
          grep -F "TeamIdentifier=TC3Q7MAJXF" "$codesign_stderr"
          rm trusttunnel_client-v1.0.49-macos-universal.tar.gz

      - name: Build Go backend and CLI
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == macos && "${{ matrix.arch }}" == arm64 ]]; then
            export CGO_LDFLAGS="-lc++ -framework SystemConfiguration -framework CoreFoundation -framework Security -framework Network"
          elif [[ "${{ matrix.platform }}" == macos ]]; then
            unset CGO_LDFLAGS
          else
            export CGO_LDFLAGS="-L${GITHUB_WORKSPACE}/go_module"
          fi
          python3 .github/scripts/desktop_build.py libs \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --go-mod-tidy --with-cli

      - name: Build Windows WinUI frontend
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          dotnet publish windows_module/DobbyVPN.Windows/DobbyVPN.Windows.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            "-p:Version=$version" `
            -p:SourceCommit="${{ inputs.source_sha }}" `
            --output runtime/services/windows-amd64/frontend
          if (-not (Test-Path runtime/services/windows-amd64/frontend/DobbyVPN.exe)) {
            throw "WinUI publish did not produce DobbyVPN.exe"
          }

      - name: Build macOS SwiftUI frontend
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="${{ inputs.source_sha }}" python3 .github/scripts/desktop_build.py native-ui \
            --platform macos --arch "${{ matrix.arch }}" \
            --output "runtime/services/macos-${{ matrix.arch }}/DobbyVPNMacApp"

      - name: Verify Windows backend runtime closure
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          for file in dobbyvpn-backend.exe dobby_bridge.dll wintun.dll; do
            path="runtime/services/windows-amd64/$file"
            test -f "$path" && test ! -L "$path"
          done
          python3 - <<'PY'
          from hashlib import file_digest
          from pathlib import Path
          expected = {
              "dobby_bridge.dll": "10e2f921aaa949060bed936e3c361b0967b2ad8b7a71dd983d36abd94c903063",
              "wintun.dll": "e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce",
          }
          for name, digest in expected.items():
              with (Path("runtime/services/windows-amd64") / name).open("rb") as file:
                  actual = file_digest(file, "sha256").hexdigest()
              if actual != digest:
                  raise SystemExit(f"{name} checksum mismatch")
          PY

      - name: Upload Windows backend
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-backend-windows-amd64
          path: |
            runtime/services/windows-amd64/dobbyvpn-backend.exe
            runtime/services/windows-amd64/dobby_bridge.dll
            runtime/services/windows-amd64/wintun.dll
          if-no-files-found: error
          retention-days: 3

      - name: Upload Linux backend
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-backend-linux-amd64
          path: |
            runtime/services/linux-amd64/dobbyvpn-backend
            runtime/services/linux-amd64/libdobby_bridge.so
            runtime/services/linux-amd64/libc++.so.1
            runtime/services/linux-amd64/libc++abi.so.1
          if-no-files-found: error
          retention-days: 3

      - name: Upload macOS backend
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobbyvpn-backend-macos-${{ matrix.arch }}
          path: |
            runtime/services/macos-${{ matrix.arch }}/dobbyvpn-backend
            runtime/services/macos-${{ matrix.arch }}/trusttunnel_client
          if-no-files-found: error
          retention-days: 3

      - name: Upload native desktop CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobby-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: runtime/services/${{ matrix.platform }}-${{ matrix.arch }}/dobby-cli*
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows frontend
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobby-native-ui-windows-amd64
          path: runtime/services/windows-amd64/frontend/**
          if-no-files-found: error
          retention-days: 3

      - name: Upload macOS frontend
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dobby-native-ui-macos-${{ matrix.arch }}
          path: runtime/services/macos-${{ matrix.arch }}/DobbyVPNMacApp
          if-no-files-found: error
          retention-days: 3
