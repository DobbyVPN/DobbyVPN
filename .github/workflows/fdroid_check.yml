name: F-Droid Compatibility

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version_name:
        type: string
        required: true
      version_code:
        type: string
        required: true

jobs:
  build:
    name: Build through the upstream F-Droid recipe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      FDROID_IMAGE: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download unsigned Android app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dobbyvpn-android-unsign.apk
          path: ${{ runner.temp }}/fdroid-reference

      - name: Download unsigned Android test companion
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dobbyvpn-android-test-companion-unsigned.apk
          path: ${{ runner.temp }}/fdroid-reference

      - name: Verify release inputs
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-unsign.apk"
          test -f "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-android-test-companion-unsigned.apk"

      - name: Read Android dependency versions
        id: pins
        run: |
          set -euo pipefail
          for pin in java_major android_build_tools; do
            value="$(python3 .github/scripts/android/android_dependency_provenance.py --print-pin "$pin")"
            echo "$pin=$value" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ steps.pins.outputs.java_major }}
          distribution: temurin

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: build-tools;${{ steps.pins.outputs.android_build_tools }}

      - name: Sign a disposable F-Droid reference APK
        run: |
          set -euo pipefail
          python3 .github/scripts/android/android_apk_signing.py sign-test \
            --unsigned-app "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-unsign.apk" \
            --unsigned-companion "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-android-test-companion-unsigned.apk" \
            --signed-app "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-sign.apk" \
            --signed-companion "$RUNNER_TEMP/fdroid-reference/DobbyVPN-v${VERSION_NAME}-android-test-companion.apk" \
            --apksigner "$ANDROID_SDK_ROOT/build-tools/${{ steps.pins.outputs.android_build_tools }}/apksigner" \
            --keytool "$(command -v keytool)"

      - name: Fetch current F-Droid metadata and server
        id: upstream
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata"
          git clone --depth 1 --branch master https://gitlab.com/fdroid/fdroidserver.git "$RUNNER_TEMP/fdroidserver"
          fdroiddata_sha="$(git -C "$RUNNER_TEMP/fdroiddata" rev-parse HEAD)"
          fdroidserver_sha="$(git -C "$RUNNER_TEMP/fdroidserver" rev-parse HEAD)"
          echo "fdroiddata_sha=$fdroiddata_sha" >> "$GITHUB_OUTPUT"
          echo "fdroidserver_sha=$fdroidserver_sha" >> "$GITHUB_OUTPUT"
          echo "fdroiddata: $fdroiddata_sha"
          echo "fdroidserver: $fdroidserver_sha"

      - name: Pull the official F-Droid build environment
        id: image
        run: |
          set -euo pipefail
          docker pull "$FDROID_IMAGE"
          digest="$(docker image inspect --format='{{index .RepoDigests 0}}' "$FDROID_IMAGE")"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "F-Droid build image: $digest"

      - name: Run the F-Droid metadata-driven build and scans
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fdroid-diagnostics"
          # fdroid_release_check.sh serves the disposable test-signed APK over a
          # temporary, container-local HTTPS endpoint for fdroidserver's
          # reference-binary comparison.
          docker run --rm --init \
            --volume "$GITHUB_WORKSPACE:/workspace/product:ro" \
            --volume "$RUNNER_TEMP/fdroiddata:/workspace/fdroiddata" \
            --volume "$RUNNER_TEMP/fdroidserver:/workspace/fdroidserver:ro" \
            --volume "$RUNNER_TEMP/fdroid-reference:/workspace/reference" \
            --volume "$RUNNER_TEMP/fdroid-diagnostics:/workspace/diagnostics" \
            --env SOURCE_SHA \
            --env VERSION_NAME \
            --env VERSION_CODE \
            --env FDROID_DIAGNOSTIC_DIR=/workspace/diagnostics \
            "$FDROID_IMAGE" \
            /workspace/product/.github/scripts/android/fdroid_release_check.sh \
              --fdroiddata /workspace/fdroiddata \
              --fdroidserver /workspace/fdroidserver \
              --reference-apk "/workspace/reference/DobbyVPN-v${VERSION_NAME}-sign.apk" \
              --source-sha "$SOURCE_SHA" \
              --version-name "$VERSION_NAME" \
              --version-code "$VERSION_CODE"

      - name: Record upstream inputs
        if: always()
        run: |
          {
            echo "F-Droid data: ${{ steps.upstream.outputs.fdroiddata_sha }}"
            echo "F-Droid server: ${{ steps.upstream.outputs.fdroidserver_sha }}"
            echo "Build image: ${{ steps.image.outputs.digest }}"
            echo "Source: $SOURCE_SHA"
            echo "Version: $VERSION_NAME ($VERSION_CODE)"
          } >> "$GITHUB_STEP_SUMMARY"
