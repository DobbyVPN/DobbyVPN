name: Submit App Store Release
run-name: Submit v${{ inputs.version }} build ${{ inputs.build_number }} to App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to submit (X.Y.Z)
        required: true
        type: string
      build_number:
        description: Exact CI and App Store Connect build number
        required: true
        type: string
      run_id:
        description: Successful Release workflow run that uploaded the build
        required: true
        type: string
      commit_sha:
        description: Exact main commit built by the selected run
        required: true
        type: string
      whats_new:
        description: Optional en-US App Store release notes
        required: false
        type: string
      inspect_only:
        description: Read the active App Review version/build/state without changing it
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: submit-app-store-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validated_build: ${{ steps.preflight.outputs.validated_build }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_SOURCE_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate trusted workflow and selected release run
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "${{ inputs.inspect_only }}" = "true" ]]; then
            test "$GITHUB_REF" = "refs/heads/release/v1.4.7-appstore-review-inspection"
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$current_main...$GITHUB_SHA")"
            test "$(jq -r .ahead_by <<<"$comparison")" = "1"
            test "$(jq -r .behind_by <<<"$comparison")" = "0"
            test "$(jq -r '.files | length' <<<"$comparison")" = "1"
            test "$(jq -r '.files[0].filename' <<<"$comparison")" = ".github/workflows/submit_app_store.yml"
          else
            test "$GITHUB_REF" = "refs/heads/main"
            test "$GITHUB_SHA" = "$current_main"
          fi
          test "$RELEASE_SOURCE_SHA" = "$current_main"

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must use X.Y.Z format" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be numeric" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "run_id must be numeric" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full commit SHA" >&2
            exit 1
          fi

          run_json="$(
            gh run view "$RELEASE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json conclusion,event,headBranch,headSha,jobs,number,status,workflowName
          )"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .workflowName <<<"$run_json")" = "Release"
          test "$(jq -r .event <<<"$run_json")" = "push"
          test "$(jq -r .headBranch <<<"$run_json")" = "main"
          test "$(jq -r .headSha <<<"$run_json")" = "$RELEASE_SOURCE_SHA"
          test "$(jq -r .number <<<"$run_json")" = "$RELEASE_BUILD_NUMBER"

          ios_success="$(
            jq -r \
              '[.jobs[] | select(.name == "ios_build / ios_build" and .conclusion == "success")] | length' \
              <<<"$run_json"
          )"
          test "$ios_success" = "1"

          encoded_version="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$RELEASE_SOURCE_SHA" \
              --jq .content
          )"
          source_version="$(printf '%s' "$encoded_version" | base64 --decode | tr -d '[:space:]')"
          test "$source_version" = "$RELEASE_VERSION"

          echo "validated_build=$RELEASE_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Validated production submission for v$RELEASE_VERSION build $RELEASE_BUILD_NUMBER"

  submit:
    needs: validate
    runs-on: macos-15
    environment: release
    timeout-minutes: 30
    env:
      APP_STORE_VERSION: ${{ inputs.version }}
      APP_STORE_BUILD_NUMBER: ${{ needs.validate.outputs.validated_build }}
      APP_STORE_SOURCE_SHA: ${{ inputs.commit_sha }}
      APP_STORE_RELEASE_NOTES: ${{ inputs.whats_new }}
    steps:
      - name: Check out trusted main submission tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Download exact IPA from selected Release run
        if: ${{ !inputs.inspect_only }}
        uses: actions/download-artifact@v7
        with:
          name: DobbyVPN.ipa
          path: selected-release/ipa
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download exact IPA provenance from selected Release run
        if: ${{ !inputs.inspect_only }}
        uses: actions/download-artifact@v7
        with:
          name: DobbyVPN.ipa.provenance
          path: selected-release/provenance
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify selected IPA provenance before submission
        if: ${{ !inputs.inspect_only }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ios_artifact_provenance.py verify \
            --ipa-dir selected-release/ipa \
            --provenance selected-release/provenance/DobbyVPN.ipa.provenance.json \
            --source-sha "$APP_STORE_SOURCE_SHA" \
            --version "$APP_STORE_VERSION" \
            --build-number "$APP_STORE_BUILD_NUMBER"

      - name: Submit exact build to production App Review
        if: ${{ !inputs.inspect_only }}
        env:
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: bundle exec fastlane ios submit_app_store_review

      - name: Inspect active production App Review
        if: ${{ inputs.inspect_only }}
        env:
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bundle exec ruby <<'RUBY'
          require "spaceship"

          token = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch("APP_STORE_KEY_ID"),
            issuer_id: ENV.fetch("APP_STORE_ISSUER_ID"),
            key: ENV.fetch("APP_STORE_API_KEY"),
            duration: 1200
          )
          Spaceship::ConnectAPI.token = token

          app = Spaceship::ConnectAPI::App.find("vpn.dobby.app")
          raise "App Store application was not found" if app.nil?

          submission = app.get_in_progress_review_submission(
            platform: "IOS",
            includes: "appStoreVersionForReview"
          )
          raise "No in-progress iOS review submission was found" if submission.nil?

          version = submission.app_store_version_for_review
          raise "The in-progress submission has no App Store version" if version.nil?
          build = version.get_build
          raise "The in-progress App Store version has no selected build" if build.nil?

          puts "active_review_state=#{submission.state}"
          puts "active_review_version=#{version.version_string}"
          puts "active_review_build=#{build.version}"
          puts "active_app_version_state=#{version.app_version_state}"

          items = Spaceship::ConnectAPI::ReviewSubmissionItem.all(
            review_submission_id: submission.id,
            includes: "appStoreVersion"
          )
          raise "The in-progress submission has no review items" if items.empty?
          item_states = items.map(&:state).compact.uniq.sort
          puts "active_review_item_states=#{item_states.join(',')}"
          RUBY
