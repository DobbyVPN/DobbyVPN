name: Torturer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-cross-platform-contract:
    name: Public cross-platform contract
    permissions:
      contents: read
    uses: DobbyVPN/Torturer/.github/workflows/verify.yml@7b428988858c1a68bf7486f7e50af5e67f8f4bdb
    with:
      source_repository: ${{ github.event.pull_request.head.repo.full_name }}
      commit_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      torturer_sha: 7b428988858c1a68bf7486f7e50af5e67f8f4bdb
