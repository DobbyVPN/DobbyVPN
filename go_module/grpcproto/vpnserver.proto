syntax = "proto3";

package grpcproto;

option go_package = "go_module/grpcproto";

service Vpn {
  rpc InitLogger (InitLoggerRequest) returns (Empty);
  rpc ValidateConfig(SessionValidateConfigRequest) returns (SessionValidateConfigResponse);
  rpc Configure(SessionConfigureRequest) returns (SessionConfigureResponse);
  rpc Start(SessionStartRequest) returns (SessionStartResponse);
  rpc Stop(SessionStopRequest) returns (SessionStopResponse);
  rpc Snapshot(SessionSnapshotRequest) returns (SessionSnapshotResponse);
  rpc Watch(SessionSnapshotRequest) returns (stream SessionSnapshot);
  rpc Reset(SessionResetRequest) returns (SessionResetResponse);
}

message InitLoggerRequest { string path = 1; }
message Empty {}

enum SessionProtocol { SESSION_PROTOCOL_UNSPECIFIED = 0; SESSION_PROTOCOL_OUTLINE = 1; SESSION_PROTOCOL_XRAY = 2; SESSION_PROTOCOL_TRUST_TUNNEL = 3; }
enum SessionState { SESSION_STATE_UNSPECIFIED = 0; SESSION_STATE_IDLE = 1; SESSION_STATE_CONFIGURED = 2; SESSION_STATE_PROBING = 3; SESSION_STATE_PREPARING = 4; SESSION_STATE_CONNECTED = 5; SESSION_STATE_STOPPING = 6; SESSION_STATE_FAILED = 7; reserved 8; }
enum SessionFailureCode { SESSION_FAILURE_CODE_UNSPECIFIED = 0; SESSION_FAILURE_CODE_INVALID_ARGUMENT = 1; SESSION_FAILURE_CODE_NOT_FOUND = 2; SESSION_FAILURE_CODE_CONFLICT = 3; SESSION_FAILURE_CODE_NOT_CONFIGURED = 4; SESSION_FAILURE_CODE_STALE_GENERATION = 5; SESSION_FAILURE_CODE_UNSUPPORTED = 6; SESSION_FAILURE_CODE_MALFORMED_CONFIG = 7; SESSION_FAILURE_CODE_PROBE_FAILED = 8; SESSION_FAILURE_CODE_PLATFORM_FAILED = 9; SESSION_FAILURE_CODE_RUNTIME_FAILED = 10; SESSION_FAILURE_CODE_CANCELED = 11; SESSION_FAILURE_CODE_INTERNAL = 12; SESSION_FAILURE_CODE_CLEANUP_FAILED = 13; }
enum SessionSourceKind { SESSION_SOURCE_KIND_UNSPECIFIED = 0; SESSION_SOURCE_KIND_INLINE = 1; SESSION_SOURCE_KIND_URL = 2; }
enum SessionStartMode { SESSION_START_MODE_UNSPECIFIED = 0; SESSION_START_MODE_AUTO_SELECT = 1; SESSION_START_MODE_PROFILE_INDEX = 2; }

message SessionFailure { SessionFailureCode code = 1; string message = 2; }
message SessionProfile { int32 index = 1; SessionProtocol protocol = 2; string description = 3; }
message SessionWarning { string code = 1; string message = 2; }
message SessionSnapshot { string session_id = 1; uint64 generation = 2; SessionState state = 3; bool configured = 4; SessionProfile active_profile = 5; SessionFailure last_failure = 6; bool cleanup_complete = 7; uint64 sequence = 8; string digest = 9; SessionSourceKind source_kind = 10; repeated SessionProfile profiles = 11; repeated SessionWarning warnings = 12; bool recovering = 13; }
message SessionValidateConfigRequest { bytes raw_config = 1; }
message SessionValidateConfigResponse { string digest = 1; repeated SessionProfile profiles = 2; repeated SessionWarning warnings = 3; SessionSourceKind source_kind = 4; SessionFailure failure = 100; }
message SessionConfigureRequest { string session_id = 1; reserved 2, 4; bytes raw_config = 3; uint64 expected_sequence = 5; }
message SessionConfigureResponse { string digest = 1; repeated SessionProfile profiles = 2; repeated SessionWarning warnings = 3; SessionSourceKind source_kind = 4; uint64 sequence = 5; SessionFailure failure = 100; }
message SessionStartRequest { string session_id = 1; reserved 2; SessionStartMode mode = 3; int32 profile_index = 4; uint64 expected_sequence = 5; }
message SessionStartResponse { uint64 generation = 1; uint64 sequence = 2; SessionFailure failure = 100; }
message SessionStopRequest { string session_id = 1; reserved 2; uint64 generation = 3; }
message SessionStopResponse { uint64 generation = 1; uint64 sequence = 2; SessionFailure failure = 100; }
message SessionSnapshotRequest { string session_id = 1; }
message SessionSnapshotResponse { SessionSnapshot snapshot = 1; SessionFailure failure = 100; }
message SessionResetRequest { string session_id = 1; uint64 expected_sequence = 2; }
message SessionResetResponse { SessionSnapshot snapshot = 1; SessionFailure failure = 100; }
