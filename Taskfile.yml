version: "3"

tasks:
  install-tools:
    desc: "Install all linting tools"
    cmds:
      - task: install-golangci-lint
      - task: install-lefthook
      - task: install-trufflehog
    silent: false

  install-golangci-lint:
    desc: "Install golangci-lint"
    status:
      - golangci-lint version
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
    silent: true

  install-lefthook:
    desc: "Install lefthook (git hooks manager)"
    status:
      - lefthook version
    cmds:
      - go install github.com/evilmartians/lefthook/v2@v2.1.10
    silent: true

  install-trufflehog:
    desc: "Install trufflehog (secret scanner)"
    status:
      - trufflehog --version
    cmds:
      - go install github.com/trufflesecurity/trufflehog/v3@v3.93.3
    silent: true

  hooks:
    desc: "Install git hooks via lefthook"
    cmds:
      - lefthook install
    silent: false

  hooks:uninstall:
    desc: "Uninstall git hooks"
    cmds:
      - lefthook uninstall
    silent: false

  lint:
    desc: "Run all linters"
    cmds:
      - task: lint:go
      - task: lint:kotlin

  lint:go:
    desc: "Run golangci-lint for go_module"
    cmds:
      - task: lint:go:client

  lint:go:client:
    desc: "Lint go_module (Go)"
    dir: "{{.ROOT_DIR}}/go_module"
    cmds:
      - cmd: golangci-lint run $(go list ./... | grep -v '_exports$')
        platforms: [linux, darwin]
      - cmd: 'powershell -Command "golangci-lint run (go list ./... | Where-Object {$_ -notmatch ''_exports$''})"'
        platforms: [windows]
    sources:
      - "**/*.go"

  lint:kotlin:
    desc: "Run detekt for Kotlin Multiplatform"
    dir: "{{.ROOT_DIR}}/kmp_module"
    cmds:
      - cmd: ./gradlew :app:detektMetadataCommonMain :app:detektJvmMain :grpcstub:detekt
        platforms: [linux, darwin]
      - cmd: gradlew.bat :app:detektMetadataCommonMain :app:detektJvmMain :grpcstub:detekt
        platforms: [windows]

  lint:swift:
    desc: "Run SwiftLint for iOS (macOS only)"
    platforms: [darwin]
    dir: "{{.ROOT_DIR}}/swift_module"
    cmds:
      - swiftlint lint --config .swiftlint.yml
